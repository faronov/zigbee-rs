[package]
name = "nrf52840-dk"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Board support for the Nordic nRF52840 DK"
repository = "https://github.com/faronov/zigbee-rs"
publish = false

[dependencies]
embassy-nrf = { version = "0.3", features = ["nrf52840"] }

[features]
# AT2401C (SKY66112-11-class two-pin) RF front-end add-on wired to the DK
# header as in devbis/nrf-ncp's nrf52840dk overlay: CTX on P1.04, CRX on
# P1.02. Not fitted on a stock DK; hardware-unverified.
fem-at2401c = []
