[package]
name = "sonoff-dongle-m"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Board support for the radio side of the SONOFF Dongle Max (Dongle-M) (EFR32MG24A420F1536IM48)"
repository = "https://github.com/faronov/zigbee-rs"
publish = false

[features]
# Interrupt-driven USART0 host link (`efr32s2-hal` `usart0-host`): defines
# the USART0 interrupt handlers, so only images that use it enable it.
host-uart = ["efr32s2-hal/usart0-host"]

[dependencies]
# 20 dBm PA, 38.4 MHz crystal (no `hfxo-39mhz`). The xG24 radio tables are
# verified at 39 MHz only, so on this board `RadioToken::init` returns
# `Unsupported` until the 38.4 MHz PHY passes its hardware gates.
efr32s2-hal = { path = "../../efr32s2-hal", features = ["efr32mg24-pa20"] }
