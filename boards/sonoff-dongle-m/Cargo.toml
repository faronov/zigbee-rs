[package]
name = "sonoff-dongle-m"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Board support for the radio side of the SONOFF Dongle Max (Dongle-M) (EFR32MG24A420F1536IM48)"
repository = "https://github.com/faronov/zigbee-rs"
publish = false

[features]
# Interrupt-driven USART0 host link (`efr32s2-hal` `usart0-host`): defines
# the USART0 interrupt handlers, so only images that use it enable it.
host-uart = ["efr32s2-hal/usart0-host"]

[dependencies]
# 20 dBm PA, 38.4 MHz crystal. `hfxo-38m4hz` enables the xG24 38.4 MHz PHY:
# the RAIL configuration of the stock Dongle-M EmberZNet image (GSDK
# `config_38M4Hz`, byte-identical) with RAIL's per-channel words. It has not
# run on our stack yet (first HIL pending, platform guide).
efr32s2-hal = { path = "../../efr32s2-hal", features = ["efr32mg24-pa20", "hfxo-38m4hz"] }
