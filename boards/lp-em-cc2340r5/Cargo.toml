[package]
name = "lp-em-cc2340r5"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pure-Rust board support for the TI LP-EM-CC2340R5"
repository = "https://github.com/faronov/zigbee-rs"
publish = false

# This board is intentionally standalone and is not added to the repository
# workspace by the CC2340 platform-services repair.
[workspace]

[dependencies]
embedded-storage = "0.3"

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
embassy-time = "0.5"
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000_000"] }
portable-atomic = { version = "1", features = ["critical-section"] }
