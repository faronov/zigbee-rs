[package]
name = "efr32mg1-hal"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pure-Rust EFR32MG1 peripheral support"
repository = "https://github.com/faronov/zigbee-rs"
publish = false

[dependencies]
embedded-hal = "1.0"
embedded-storage = "0.3"

[dev-dependencies]
# Host-only oracle for the CRYPTO AES register-protocol tests.
aes = { version = "0.8", default-features = false }
