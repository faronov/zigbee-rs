[package]
name = "cc2340r5-hal"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pure-Rust CC2340R52 chip services and peripheral drivers"
repository = "https://github.com/faronov/zigbee-rs"
publish = false

# Standalone like the CC2340 board crates; consumed by path.
[workspace]

[dependencies]
embedded-hal = "1.0"
embedded-storage = "0.3"

[features]
default = ["runtime"]
# Application runtime: Embassy time driver, interrupt dispatch, standby and
# `take_core`. Bootloaders disable it and use `take_boot`.
runtime = ["dep:embassy-time", "dep:embassy-time-driver"]

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
embassy-time = { version = "0.5", optional = true }
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000_000"], optional = true }
portable-atomic = { version = "1", features = ["critical-section"] }
