[package]
name = "cc2340r5-hal"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pure-Rust CC2340R52 chip services and peripheral drivers"
repository = "https://github.com/faronov/zigbee-rs"
publish = false

# Standalone like the CC2340 board crates; consumed by path.
[workspace]

[dependencies]
embedded-hal = "1.0"
embedded-storage = "0.3"

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
embassy-time = "0.5"
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000_000"] }
portable-atomic = { version = "1", features = ["critical-section"] }
