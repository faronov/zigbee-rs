[package]
name = "zigbee-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Zigbee device runtime — event loop, device builder, NV storage"

[dependencies]
embedded-storage = { workspace = true }
heapless = "0.9"
zigbee-types = { version = "0.1.0", path = "../zigbee-types" }
zigbee-mac = { version = "0.1.0", path = "../zigbee-mac" }
zigbee-nwk = { version = "0.1.0", path = "../zigbee-nwk" }
zigbee-aps = { version = "0.1.0", path = "../zigbee-aps" }
zigbee-zdo = { version = "0.1.0", path = "../zigbee-zdo" }
zigbee-bdb = { version = "0.1.0", path = "../zigbee-bdb", default-features = false }
zigbee-zcl = { version = "0.1.0", path = "../zigbee-zcl", default-features = false }
log = "0.4"

[features]
default = [
    "float32",
    "float64",
    "finding-binding",
    "centralized-tclk",
    "distributed-security",
    "groups",
]
float32 = ["zigbee-bdb/float32", "zigbee-zcl/float32"]
float64 = ["zigbee-bdb/float64", "zigbee-zcl/float64"]
centralized-tclk = ["zigbee-bdb/centralized-tclk"]
distributed-security = ["zigbee-bdb/distributed-security"]
groups = []
end-device = [
    "centralized-tclk",
    "zigbee-bdb/end-device",
    "zigbee-zdo/end-device",
]
sleepy-end-device = [
    "end-device",
    "zigbee-aps/sleepy-end-device",
    "zigbee-bdb/sleepy-end-device",
]
application-link-key-installation = []
finding-binding = ["zigbee-bdb/finding-binding"]
finding-binding-target = ["zigbee-bdb/finding-binding-target"]
router = [
    "centralized-tclk",
    "distributed-security",
    "finding-binding",
    "groups",
    "zigbee-aps/router",
    "zigbee-bdb/router",
    "zigbee-nwk/router",
    "zigbee-zdo/router",
]
trust-center = ["router", "zigbee-aps/trust-center", "zigbee-bdb/trust-center"]
ota = []
trace = ["zigbee-bdb/trace", "zigbee-aps/trace", "zigbee-nwk/trace"]
constrained-memory = [
    "zigbee-zcl/constrained-memory",
    "zigbee-zdo/constrained-memory",
]
compact-single-endpoint = [
    "zigbee-zcl/compact-single-endpoint",
    "zigbee-zdo/compact-single-endpoint",
]

[dev-dependencies]
# Runtime unit tests expose coordinator helpers under `cfg(test)`; compile the
# BDB formation implementation without enabling router behavior.
zigbee-bdb = { path = "../zigbee-bdb", default-features = false, features = ["formation"] }
zigbee-mac = { path = "../zigbee-mac", features = ["mock"] }
# NOTE: do not enable `zigbee-nwk/router` here. A dev-dependency feature is
# unified into this package's own build, so it silently gave every
# `zigbee-runtime` build the router routing/BTR/source-route tables even for
# sleepy sensors. The router-side host tests are gated on this crate's own
# `router` feature (`cargo test -p zigbee-runtime --features router`), which
# forwards to `zigbee-aps/router` and `zigbee-nwk/router`.
