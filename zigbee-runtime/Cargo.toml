[package]
name = "zigbee-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Zigbee device runtime — event loop, device builder, NV storage"

[dependencies]
# `host-passthrough` queue only.
critical-section = { version = "1.2", optional = true }
embedded-storage = { workspace = true }
heapless = "0.9"
zigbee-types = { version = "0.1.0", path = "../zigbee-types" }
zigbee-mac = { version = "0.1.0", path = "../zigbee-mac" }
zigbee-nwk = { version = "0.1.0", path = "../zigbee-nwk" }
zigbee-aps = { version = "0.1.0", path = "../zigbee-aps" }
zigbee-zdo = { version = "0.1.0", path = "../zigbee-zdo" }
zigbee-bdb = { version = "0.1.0", path = "../zigbee-bdb", default-features = false }
zigbee-zcl = { version = "0.1.0", path = "../zigbee-zcl", default-features = false }
zigbee-gp = { version = "0.1.0", path = "../zigbee-gp", optional = true, features = ["proxy"] }
log = "0.4"

[features]
default = [
    "float32",
    "float64",
    "finding-binding",
    "centralized-tclk",
    "distributed-security",
    "groups",
]
float32 = ["zigbee-bdb/float32", "zigbee-zcl/float32"]
float64 = ["zigbee-bdb/float64", "zigbee-zcl/float64"]
centralized-tclk = ["zigbee-bdb/centralized-tclk"]
distributed-security = ["zigbee-bdb/distributed-security"]
groups = []
end-device = [
    "centralized-tclk",
    "zigbee-bdb/end-device",
    "zigbee-zdo/end-device",
]
sleepy-end-device = [
    "end-device",
    "zigbee-aps/sleepy-end-device",
    "zigbee-bdb/sleepy-end-device",
]
application-link-key-installation = []
finding-binding = ["zigbee-bdb/finding-binding"]
finding-binding-target = ["zigbee-bdb/finding-binding-target"]
router = [
    "centralized-tclk",
    "distributed-security",
    "finding-binding",
    "groups",
    "zigbee-aps/router",
    "zigbee-bdb/router",
    "zigbee-nwk/router",
    "zigbee-zdo/router",
]
trust-center = ["router", "zigbee-aps/trust-center", "zigbee-bdb/trust-center"]
# One durably reserved outgoing APS frame counter for every APS-secured frame
# the coordinator sends (ZRHP decision 2). Kept in the Trust Center journal
# (record version 5); a version-4 journal migrates on the first start with
# start = max(every per-key limit, the NWK limit). Off by default: images
# without it are unchanged.
global-aps-counter = ["trust-center", "zigbee-aps/global-aps-counter"]
# Coordinator network co-processor capacity (ZRHP spec 8.2/8.9): 256 Trust
# Center devices and APS link keys, a 512-entry address map, 96 neighbors
# with 64 persisted children (1 024-byte child-journal slots), a 128-entry
# source-route cache, 16 indirect frames, a 64-entry ESP Frame Pending table,
# and Trust Center journal record version 6 (16-bit device count, at most 32
# removal intents) with the streamed multi-slot journal
# `trust_center_stream::TrustCenterStreamJournal`. Needs the global APS
# counter. Off by default: images without it are unchanged.
ncp-capacity = [
    "global-aps-counter",
    "zigbee-aps/ncp-capacity",
    "zigbee-bdb/ncp-capacity",
    "zigbee-mac/ncp-capacity",
    "zigbee-nwk/ncp-capacity",
]
# Network co-processor: APS data frames for application endpoints go to a
# bounded host queue (`host_passthrough`) instead of the ZCL dispatcher, with
# the last hop RSSI and the APS security/key source; neighbour departures,
# Trust Center join decisions and removals are recorded for the host; the ZDO
# endpoint registry accepts host endpoints. Off by default: images without it
# are unchanged.
host-passthrough = [
    "dep:critical-section",
    "zigbee-mac/rx-rssi",
    "zigbee-aps/host-passthrough",
    "zigbee-nwk/host-passthrough",
    "zigbee-zdo/host-passthrough",
]
ota = []
# Green Power Proxy Basic (GP 1.1) for routers: GPDF reception, Proxy Table,
# GP Notification / Commissioning Notification tunnelling with NWK aliasing.
# Requires `router`. Off by default: images built without it are unchanged.
green-power = [
    "router",
    "dep:zigbee-gp",
    "zigbee-mac/green-power",
    "zigbee-aps/green-power",
    "zigbee-nwk/green-power",
    "zigbee-zcl/green-power",
]
# Green Power TempMaster (bidirectional proxy, GP 1.1 A.3.9.1): queue a GP
# Response's GPDF in the gpTxQueue and send it into a bidirectional GPD's
# rxAfterTx window, gpTxOffset (20 ms) after the end of its GPDF. Needs a MAC
# with timed transmission (`zigbee-mac/timed-tx`); on a MAC without it the
# proxy stays unidirectional and rejects such Responses. Off by default.
green-power-bidirectional = [
    "green-power",
    "zigbee-gp/proxy-bidirectional",
    "zigbee-mac/timed-tx",
]
# Experimental Full Proxy support. Opts into full-unicast retries and
# IEEE-addressed GPD reception/forwarding in addition to bidirectional
# commissioning.
green-power-full-proxy = [
    "green-power-bidirectional",
    "zigbee-gp/proxy-full",
]
# Experimental GP Combo / Sink: the GP server on endpoint 242 (Sink Table,
# sink commissioning mode, GPD commissioning, GP Notification processing),
# GPDFs heard directly processed locally, and translated GPD commands
# delivered to one local application endpoint. Sink Table persistence shares
# the GP journal. Needs no timed TX: bidirectional commissioning of a GPD the
# combo hears directly also needs `green-power-bidirectional`; through other
# TempMasters it always works. Off by default: images built without it are
# unchanged.
green-power-sink = ["green-power", "zigbee-gp/sink"]
# ZRHP network co-processor integration of the GP combo (spec 7.11,
# `green_power::ncp`): one sink authority switchable at runtime between the
# runtime's sink (NCP_SINK) and the host's (HOST_SINK: GP server frames and
# the local proxy's output go to the host), sink frame reports with their
# security metadata, Sink Table import/quiet removal, and host-originated GP
# client commands looped back to the local proxy. Pair with `ncp-capacity`
# for the 16-entry Sink Table. Off by default: images without it are
# unchanged.
green-power-ncp = ["green-power-sink", "host-passthrough"]
# Deprecated item-by-item `save_state`/`restore_state` persistence. It does not
# persist the Trust Center link key, APS keys, bindings or groups; production
# devices use `SecurityStateStore`. Kept only for tests and mock examples.
legacy-nv = []
trace = ["zigbee-bdb/trace", "zigbee-aps/trace", "zigbee-nwk/trace"]
constrained-memory = [
    "zigbee-zcl/constrained-memory",
    "zigbee-zdo/constrained-memory",
]
compact-single-endpoint = [
    "zigbee-zcl/compact-single-endpoint",
    "zigbee-zdo/compact-single-endpoint",
]

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
# Runtime unit tests expose coordinator helpers under `cfg(test)`; compile the
# BDB formation implementation without enabling router behavior.
zigbee-bdb = { path = "../zigbee-bdb", default-features = false, features = ["formation"] }
zigbee-mac = { path = "../zigbee-mac", features = ["mock"] }
# NOTE: do not enable `zigbee-nwk/router` here. A dev-dependency feature is
# unified into this package's own build, so it silently gave every
# `zigbee-runtime` build the router routing/BTR/source-route tables even for
# sleepy sensors. The router-side host tests are gated on this crate's own
# `router` feature (`cargo test -p zigbee-runtime --features router`), which
# forwards to `zigbee-aps/router` and `zigbee-nwk/router`.

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("tc32"))'] }
