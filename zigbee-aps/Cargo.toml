[package]
name = "zigbee-aps"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Zigbee PRO R22 APS layer — binding, group, data service, key management"
repository = "https://github.com/zigbee-rs/zigbee-rs"

[dependencies]
heapless = "0.9"
zigbee-types = { version = "0.1.0", path = "../zigbee-types" }
zigbee-crypto = { version = "0.1.0", path = "../zigbee-crypto" }
zigbee-nwk = { version = "0.1.0", path = "../zigbee-nwk" }
zigbee-mac = { version = "0.1.0", path = "../zigbee-mac" }
log = "0.4"

[features]
sleepy-end-device = []
# R22 §2.2.8.4.5 APS fragmentation: windowed transmit and reassembly of ASDUs
# up to 256 octets. Routers enable it; end-device images (tight flash/RAM
# budgets) leave it off and drop fragmented frames as DEFRAG_UNSUPPORTED.
fragmentation = []
router = ["zigbee-nwk/router", "fragmentation"]
trust-center = ["router"]
trace = ["zigbee-nwk/trace"]
# Green Power alias transmission for GP Notification tunnelling. Off by default.
green-power = ["zigbee-nwk/green-power"]

[dev-dependencies]
zigbee-mac = { path = "../zigbee-mac", features = ["mock"] }
