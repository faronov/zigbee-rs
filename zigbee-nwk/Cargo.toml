[package]
name = "zigbee-nwk"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Zigbee PRO R22 NWK layer — network formation, join, routing, data service"

[dependencies]
heapless = "0.9"
zigbee-types = { version = "0.1.0", path = "../zigbee-types" }
zigbee-crypto = { version = "0.1.0", path = "../zigbee-crypto" }
zigbee-mac = { version = "0.1.0", path = "../zigbee-mac" }
log = "0.4"

[features]
default = []
router = []
trace = []
# Green Power alias transmission (GP 1.1 A.3.6.3.3). Off by default.
green-power = []
# Coordinator network co-processor table sizes (ZRHP spec 8.2/8.9):
# neighbor table 96 (64 children), address map 512, source-route cache 128,
# indirect queue 16 frames, NWK replay-floor table 128 and a NIB default of
# `max_children = 64`. Off by default: images without it are unchanged.
ncp-capacity = ["router"]
# Hold indirect data for a sleepy child until its next expected poll: the
# parent learns each child's poll interval from its Data Requests
# (`poll_estimate`). Off by default: images without it are unchanged.
adaptive-indirect = ["router"]
# Network co-processor: record neighbour Leave indications (with the rejoin
# bit) and aged-out children for the host (`host_events`). Off by default:
# images without it are unchanged.
host-passthrough = []

[dev-dependencies]
zigbee-mac = { version = "0.1.0", path = "../zigbee-mac", features = ["mock"] }
