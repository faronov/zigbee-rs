[package]
name = "bl702-boot"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "BL702 shell of the zigbee-rs MCUboot-image bootloader core"
repository = "https://github.com/faronov/zigbee-rs"
publish = false

# Standalone like bl702-hal; a product's bootloader binary consumes it.
[workspace]

[dependencies]
zrs-boot-core = { path = "../core", features = ["compact-sha256"] }

[features]
# Also accept Ed25519-signed images.
ed25519 = ["zrs-boot-core/ed25519"]

[dev-dependencies]
zrs-boot-core = { path = "../core", features = ["compact-sha256", "sim"] }

[target.'cfg(target_arch = "riscv32")'.dependencies]
bl702-hal = { path = "../../bl702-hal" }
