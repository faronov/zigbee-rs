[package]
name = "zrs-boot-cortex-m"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cortex-M shell of the zigbee-rs MCUboot-image bootloader core: entry check through the flash driver, optional VTOR, hand-over"
publish = false

[features]
# Not supported: the Ed25519 verifier does not fit the 16 KiB loader
# regions of the Cortex-M ports. Enabling it fails the build.
ed25519 = []
# Swap-move install with revert of an unconfirmed update.
swap-move = ["zrs-boot-core/swap-move"]

[dependencies]
zrs-boot-core = { version = "0.1.0", path = "../core", features = ["compact-sha256"] }

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = "0.7"

[dev-dependencies]
zrs-boot-core = { version = "0.1.0", path = "../core", features = ["compact-sha256", "sim"] }
