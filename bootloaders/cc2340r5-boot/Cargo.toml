[package]
name = "cc2340r5-boot"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "CC2340R5 shell of the zigbee-rs MCUboot-image bootloader core"
repository = "https://github.com/faronov/zigbee-rs"
publish = false

# Standalone like cc2340r5-hal; a product's bootloader binary consumes it.
[workspace]

[features]
# Not supported: the Ed25519 verifier does not fit the 16 KiB loader
# region. Enabling it fails the build with an explanation.
ed25519 = []
# Swap-move install keeping the previous image for revert of an
# unconfirmed update (needs two status sectors in the layout).
swap-move = ["zrs-boot-core/swap-move"]

[dependencies]
zrs-boot-core = { path = "../core", features = ["compact-sha256"] }

[target.'cfg(target_os = "none")'.dependencies]
cc2340r5-hal = { path = "../../cc2340r5-hal", default-features = false }
cortex-m = "0.7"
