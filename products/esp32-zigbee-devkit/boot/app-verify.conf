# App-side OTA trust for the ESP32-C6/H2 devkit firmware (feature
# `signed-ota`). The ESP-IDF second-stage bootloader stays: it boots the
# native image staged without the MCUboot envelope header, so this only
# authenticates what the application accepts over Zigbee OTA.
# See docs/book/src/advanced/bootloader.md, "App-side verification".
name = esp32-zigbee-devkit
# ESP32_DEVKIT_OTA_KEY_XY replaces the key file; ..._KEY2_XY/_KEY3_XY add
# rotation keys (128 hex digits or a file each).
env-prefix = ESP32_DEVKIT
key-file = ../../../bootloaders/keys/own-ec-p256.xy.hex
