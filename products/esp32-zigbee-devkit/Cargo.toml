[package]
name = "esp32-zigbee-devkit-product"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Product configuration (persistence, OTA, profile) for the ESP32-C6/H2 Zigbee sensor firmware"
repository = "https://github.com/faronov/zigbee-rs"
publish = false

[dependencies]
embedded-storage = "0.3"
embassy-time-queue-utils = { version = "0.1", features = ["generic-queue-8"] }
log = "0.4"
router-app = { path = "../../apps/router", default-features = false, optional = true }
sensor-sed-app = { path = "../../apps/sensor-sed", features = ["ota"], optional = true }
zigbee-aps = { path = "../../zigbee-aps" }
zigbee-bdb = { path = "../../zigbee-bdb" }
zigbee-mac = { path = "../../zigbee-mac" }
zigbee-runtime = { path = "../../zigbee-runtime" }
zigbee-zcl = { path = "../../zigbee-zcl" }
esp32-zigbee-devkit = { path = "../../boards/esp32-zigbee-devkit" }

# Only for naming the concrete flash error type that `esp32-zigbee-devkit`'s
# `RawFlash` returns (`embedded_storage::nor_flash::ErrorType::Error`); all
# flash access itself goes through the board crate.
[target.'cfg(target_os = "none")'.dependencies]
critical-section = "1.2"
embassy-time = "0.4"
embassy-futures = "0.1"
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000_000"] }
esp-hal = { version = "=1.0.0", features = ["unstable"] }
esp-storage = { version = "0.7", default-features = false, features = [
    "bytewise-read",
    "critical-section",
] }
# ESP32-H2 PMU light/deep sleep (own RAM-resident port of ESP-IDF v5.5.1).
esp32h2-sleep = { path = "../../esp32h2-sleep", optional = true }

[features]
default = []
# Sleepy sensor role: SED policy, wake controller and OTA client/boot
# confirmation (pulls in the SED lifecycle crate). The mains role images
# (always-on End Device, Router) build without it.
sed = ["dep:sensor-sed-app"]
# Mains role policies/profiles (always-on End Device, Router) and the
# router's child/APS journals.
roles = ["dep:router-app"]
light-sleep = []
# Persist ZCL Configure Reporting state in `zbnv` (sleepy sensor images).
reporting-persist = []
# Persist the sleepy sensor's anomaly record (fired keep-awake limits) in
# `zbnv`; written only when a limit fires.
anomaly-record = ["sed"]
esp32c6 = ["esp32-zigbee-devkit/esp32c6", "esp-hal/esp32c6", "zigbee-runtime/ota"]
esp32h2 = [
    "esp32-zigbee-devkit/esp32h2",
    "esp-hal/esp32h2",
    "zigbee-runtime/ota",
    "dep:esp32h2-sleep",
]
# ESP32-H2 only, experimental: compile in the TOP/CPU/modem power-down
# light sleep (`SleepMode::TopPowerDown`); the image selects it at runtime.
h2-top-pd = ["esp32h2", "light-sleep", "esp32h2-sleep/top-pd"]

[patch.crates-io]
esp-hal = { path = "../../vendor/esp-hal" }
esp-radio = { path = "../../vendor/esp-radio" }
