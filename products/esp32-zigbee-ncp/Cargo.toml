[package]
name = "esp32-zigbee-ncp-product"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "ESP32-H2 ZRHP network co-processor product: identity, flash layouts, NV journals, transport selection"
repository = "https://github.com/faronov/zigbee-rs"
publish = false

# The product owns the NCP's identity, both partition tables (2 MB and
# 4 MB, spec 8.9), the placement of every NV journal in `zbnv`, and which
# host transport the image uses. The board crate only describes the chip
# flash and the host UART wiring; the ZRHP stack lives in the shared crates.
[dependencies]
embedded-storage = "0.3"
log = "0.4"
# Platform services (host-testable): the devkit product's ESP OTA pieces
# (otadata rules, ESP image validation, SHA-256, `signed-ota` trusted keys),
# the MCUboot envelope check, the identity journal and the platform trait.
# The devkit product also provides the single-future executor and SYSTIMER
# embassy time driver (layout-independent platform glue; candidates for a
# shared ESP platform crate).
esp32-zigbee-devkit-product = { path = "../esp32-zigbee-devkit", features = ["signed-ota"] }
mcuboot-image = { path = "../../mcuboot-image" }
zigbee-runtime = { path = "../../zigbee-runtime", default-features = false, features = [
    "centralized-tclk",
    "trust-center",
    "global-aps-counter",
    "host-passthrough",
] }
ncp-coordinator-app = { path = "../../apps/ncp-coordinator" }

[dev-dependencies]
# Signs test envelopes (host tests of the FW_* signature policy).
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

[target.'cfg(target_os = "none")'.dependencies]
critical-section = "1.2"
# Same configuration as the board crates: the ROM flash routines run with
# interrupts masked (see boards/esp32-zigbee-devkit/Cargo.toml).
esp-storage = { version = "0.7", default-features = false, features = [
    "bytewise-read",
    "critical-section",
] }
esp-thread-br-h2 = { path = "../../boards/esp-thread-br-h2", optional = true }
# PTA (`pta`): the radio's external-coexistence hooks and per-scene
# priorities (local patch `ieee802154-extcoex`, vendor/esp-radio/LOCAL-PATCHES.md).
esp-radio = { version = "=0.17.0", default-features = false, features = [
    "ieee802154",
    "ieee802154-extcoex",
    "unstable",
], optional = true }
esp-serial-stream = { path = "../../esp-serial-stream" }
esp-hal = { version = "=1.0.0", features = ["unstable"] }
router-app = { path = "../../apps/router", default-features = false, features = ["centralized-tclk", "global-aps-counter"] }

[features]
default = []
esp32h2 = [
    "esp-storage/esp32h2",
    "esp32-zigbee-devkit-product/esp32h2",
    "esp-serial-stream/esp32h2",
    "esp-hal/esp32h2",
    "esp-radio?/esp32h2",
]
# ESP32-C6 variant (same 802.15.4 block; USB-Serial-JTAG transport). Lab
# bring-up target with the 4 MB layout.
esp32c6 = [
    "esp-storage/esp32c6",
    "esp32-zigbee-devkit-product/esp32c6",
    "esp-serial-stream/esp32c6",
    "esp-hal/esp32c6",
    "esp-radio?/esp32c6",
]
# Host transport, exactly one per image (spec 11.4).
transport-usj = []
transport-uart = []
# Build for the 2 MB partition table (default: 4 MB).
flash-2mb = []
# Board: Espressif Thread Border Router / Zigbee Gateway, H2 side (host
# UART0 at 460 800 without flow control by default).
thread-br-h2 = ["dep:esp-thread-br-h2"]
# Optional board mod: RTS/CTS on the reserved lines R19/R20.
rtscts-reserved-lines = ["thread-br-h2", "esp-thread-br-h2/rtscts-reserved-lines"]
# Board: Waveshare ESP32-H2-Zero (USB-Serial-JTAG only; identity string).
waveshare-h2-zero = []
# Development firmware policy (never in shipped images): FW_FINISH accepts
# unsigned (plain ESP) images, and FW_BEGIN flags bit0 allows downgrades.
dev-unsigned-fw = []
# PTA coexistence follower on the Thread BR board (`pta::Pta`, spec 11.5):
# off by default and disabled at boot; adds the radio's external-coexistence
# hooks to the image.
pta = ["thread-br-h2", "dep:esp-radio"]

[patch.crates-io]
esp-hal = { path = "../../vendor/esp-hal" }
esp-radio = { path = "../../vendor/esp-radio" }
