[package]
name = "tlsr8258-tb04-product"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Product flash layout and persistence policy for TLSR8258 TB-04 firmware"
repository = "https://github.com/faronov/zigbee-rs"
publish = false

[features]
default = ["router"]
router = [
    "dep:router-app",
    "router-app/router",
    "zigbee-runtime/router",
    "zigbee-runtime/compact-single-endpoint",
]
# Green Power Proxy Basic for the router: the GP Proxy Table journal at
# 0x6E000 (`storage::gp_proxy_table_store`).
green-power = ["router", "router-app/green-power", "zigbee-runtime/green-power"]
# Always-on (RX-on-when-idle) non-routing End Device. Pulls the shared
# router app without its parent/router feature, so no parent MAC, child
# table or routing code can link.
end-device = [
    "dep:router-app",
    "zigbee-runtime/compact-single-endpoint",
]
sensor = [
    "dep:sensor-sed-app",
    "dep:tlsr8258-sensor-app",
    "dep:zigbee-mac",
    "zigbee-runtime/compact-single-endpoint",
]
# LOW32K reset-on-wake for joined steady-state waits, with a 250 ms
# wake-stress slow poll (the default sensor polls every 5 s).
retention-proof = [
    "sensor",
    "tlsr8258-sensor-app/retention",
]
# Same image with a ten-second joined slow poll.
retention-proof-10s = ["retention-proof"]

[dependencies]
embedded-storage = "0.3"
router-app = { path = "../../apps/router", optional = true }
sensor-sed-app = { path = "../../apps/sensor-sed", optional = true }
tlsr8258-hal = { path = "../../tlsr8258-hal" }
tlsr8258-sensor-app = { path = "../../apps/tlsr8258-sensor", optional = true }
tlsr8258-tb04 = { path = "../../boards/tlsr8258-tb04" }
zigbee-aps = { path = "../../zigbee-aps" }
zigbee-mac = { path = "../../zigbee-mac", optional = true }
zigbee-runtime = { path = "../../zigbee-runtime", default-features = false }
zigbee-zcl = { path = "../../zigbee-zcl", default-features = false }

[dev-dependencies]
zigbee-mac = { path = "../../zigbee-mac", features = ["mock"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("tc32"))'] }
