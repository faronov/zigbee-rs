# App-side OTA trust for the TLSR8258 TB-04 firmware. The Telink boot ROM
# stays. No Telink OTA writer exists yet; this configures the
# `mcuboot_image::EnvelopeWriter` it will sit behind.
# See docs/book/src/advanced/bootloader.md, "App-side verification".
name = tlsr8258-tb04
env-prefix = TLSR8258_TB04
key-file = ../../../bootloaders/keys/own-ec-p256.xy.hex
