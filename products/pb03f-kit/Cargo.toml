[package]
name = "pb03f-kit-product"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Product identity, layout, persistence, and policy for the Ai-Thinker PB-03F-Kit Zigbee demo"
repository = "https://github.com/faronov/zigbee-rs"
publish = false

# Standalone like the other PHY62x2 product crates; excluded from the root
# workspace because the board crate is target-only.
[workspace]

[dependencies]
embedded-storage = "0.3"
sensor-sed-app = { path = "../../apps/sensor-sed", default-features = false }
zigbee-aps = { path = "../../zigbee-aps" }
zigbee-mac = { path = "../../zigbee-mac", default-features = false, features = ["phy6222"] }
zigbee-runtime = { path = "../../zigbee-runtime", default-features = false, features = ["compact-single-endpoint", "constrained-memory"] }
zigbee-types = { path = "../../zigbee-types" }
zigbee-zcl = { path = "../../zigbee-zcl", default-features = false }

[target.'cfg(target_os = "none")'.dependencies]
pb03f-kit = { path = "../../boards/pb03f-kit" }
