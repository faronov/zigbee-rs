[package]
name = "nrf52833-sensor-product"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Product configuration for the nRF52833-DK Zigbee sensor firmware"
repository = "https://github.com/faronov/zigbee-rs"
publish = false

[features]
# Adds a Pressure Measurement cluster to the profile for the BME280 variant.
# Keep in sync with the `sensor-bme280` feature in examples/nrf52833-sensor.
sensor-bme280 = []

[dependencies]
zigbee-aps = { path = "../../zigbee-aps" }
zigbee-runtime = { path = "../../zigbee-runtime", default-features = false }
zigbee-zcl = { path = "../../zigbee-zcl", default-features = false }

# `embassy-nrf` (and this product's `nrf52833-dk` board dependency, which
# also requires it) only build for the actual Cortex-M target: `nrf-pac`'s
# `rt` feature embeds a hardware vector table section that is not valid for
# a host Mach-O/ELF object. Gate both so `battery` and `profile` — the
# pure, hardware-independent logic — stay host-testable via `cargo test`,
# exactly as `products/nrf52840-sensor` does.
[target.'cfg(target_os = "none")'.dependencies]
nrf52833-dk = { path = "../../boards/nrf52833-dk" }
embassy-nrf = { version = "0.3", features = ["nrf52833"] }
embedded-storage = "0.3"
