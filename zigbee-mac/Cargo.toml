[package]
name = "zigbee-mac"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license = "MIT OR Apache-2.0"
description = "IEEE 802.15.4 MAC abstraction for zigbee-rs — trait + multi-platform backends"
repository = "https://github.com/zigbee-rs/zigbee-rs"

[dependencies]
heapless = "0.9"
zigbee-types = { version = "0.1.0", path = "../zigbee-types" }
zigbee-crypto = { version = "0.1.0", path = "../zigbee-crypto" }
tlsr8258-hal = { path = "../tlsr8258-hal", optional = true }
bl702-hal = { path = "../bl702-hal", optional = true }
efr32mg1-hal = { path = "../efr32mg1-hal", optional = true }

# ── ESP32-C6 backend ────────────────────────────────────────
esp-hal = { version = "1.0.0", features = ["rt", "unstable"], default-features = false, optional = true }
esp-radio = { version = "0.17.0", features = ["ieee802154", "unstable"], default-features = false, optional = true }
esp-alloc = { version = "0.9.0", optional = true }
esp-sync = { version = "0.1.0", optional = true }

# ── nRF backends ─────────────────────────────────────────────
# Each chip variant needs its own embassy-nrf instance with the
# correct chip feature flag. We use Cargo renamed deps so both
# can coexist in Cargo.toml (only one is activated at a time).
embassy-nrf52840 = { package = "embassy-nrf", version = "0.3", features = ["nrf52840"], optional = true }
embassy-nrf52833 = { package = "embassy-nrf", version = "0.3", features = ["nrf52833"], optional = true }

# ── BL702 backend ─────────────────────────────────────────────
# Provides an experimental direct-register Rust RadioPhy plus the legacy
# Bouffalo lmac154 FFI backend for comparison during hardware bring-up.
# No Rust HAL dependency is required by the radio implementation.

# ── Telink TLSR82xx HAL backend ───────────────────────────────
# Local-only: override via .cargo/config.toml [patch] or --manifest-path
# tlsr82xx-hal = { path = "../tlsr82xx-hal", optional = true, default-features = false, features = ["chip-8258"] }

# ── Shared Embassy async primitives (used by multiple backends)
embassy-sync = { version = "0.7", optional = true }
embassy-time = { version = "0.4", optional = true }
embassy-futures = { version = "0.1", optional = true }
rtt-target = { version = "0.6", optional = true }

# ── Logging ─────────────────────────────────────────────────
log = "0.4"

[features]
default = []
alloc = []
mock = []

# Platform backends
esp32c6 = [
    "alloc",
    "dep:esp-radio", "dep:esp-hal", "dep:esp-alloc", "dep:esp-sync",
    "esp-radio/esp32c6", "esp-hal/esp32c6", "esp-alloc/esp32c6", "esp-sync/esp32c6",
    "dep:embassy-sync", "dep:embassy-time", "dep:embassy-futures", "dep:rtt-target",
]
esp32h2 = [
    "alloc",
    "dep:esp-radio", "dep:esp-hal", "dep:esp-alloc", "dep:esp-sync",
    "esp-radio/esp32h2", "esp-hal/esp32h2", "esp-alloc/esp32h2", "esp-sync/esp32h2",
    "dep:embassy-sync", "dep:embassy-time", "dep:embassy-futures", "dep:rtt-target",
]
nrf52840 = [
    "hardware-aes-nrf",
    "dep:embassy-nrf52840",
    "dep:embassy-sync", "dep:embassy-time", "dep:embassy-futures", "dep:rtt-target",
]
nrf52833 = [
    "hardware-aes-nrf",
    "dep:embassy-nrf52833",
    "dep:embassy-sync", "dep:embassy-time", "dep:embassy-futures", "dep:rtt-target",
]

# Nordic ECB hardware AES-128 is mandatory for both nRF production backends.
# This marker feature is pulled in by each chip feature; it is not an
# independently selectable software/hardware switch.
hardware-aes-nrf = []

bl702 = [
    "dep:embassy-sync", "dep:embassy-time", "dep:embassy-futures", "dep:rtt-target",
]

cc2340 = [
    "dep:embassy-sync", "dep:embassy-time", "dep:embassy-futures", "dep:rtt-target",
]

tlsr8258 = [
    "dep:tlsr8258-hal",
]
# Backward-compatible alias for the former ambiguous feature name.
telink = ["tlsr8258"]

# TLSR8258 hardware AES-128 accelerator backend.
#
# Kept as an explicit low-level feature so non-product test compositions can
# still choose their provider. The production Telink sensor/router enable it
# unconditionally. The MAC takes ownership of the
# `tlsr8258_hal::aes::AesEngine` and overrides
# `ForwardAesProvider::forward_cipher` to hand CCM*/MMO a hardware-backed
# cipher, which lets dead-code elimination drop the RustCrypto software AES
# core from the image. The backend is silicon-proven through commissioning,
# sustained secured traffic, and reset/resume.
hardware-aes = [
    "tlsr8258",
    "zigbee-crypto/tlsr8258",
]

# TLSR8258 reset-on-wake restoration hooks. Kept separate from `tlsr8258`
# so the validated full-SRAM SUSPEND production images do not gain a second
# resume path until the dedicated proof is selected.
telink-retention-proof = [
    "tlsr8258",
    "tlsr8258-hal/retention-proof",
]

# BL702 SEC_ENG hardware AES-128 accelerator backend.
#
# Kept as a separate low-level feature because it selects different HAL and
# crypto backends from Telink. The production BL702 sensor enables it
# unconditionally. `Bl702RadioPhy` takes
# ownership of the `bl702_hal::aes::AesEngine` and overrides
# `ForwardAesProvider::forward_cipher` to hand CCM*/MMO a hardware-backed
# cipher, letting dead-code elimination drop the RustCrypto software AES core
# from the image. Startup KATs and full secured ZHA commissioning are
# silicon-proven; silent reset/resume remains pending.
hardware-aes-bl702 = [
    "bl702",
    "dep:bl702-hal",
    "zigbee-crypto/bl702",
]

# Telink with HAL crate — requires local tlsr82xx-hal (not available in CI)
# telink-hal = [
#     "tlsr8258",
#     "dep:tlsr82xx-hal",
# ]

phy6222 = [
    "dep:embassy-sync", "dep:embassy-time", "dep:embassy-futures", "dep:rtt-target",
]

efr32 = [
    "dep:embassy-sync", "dep:embassy-time", "dep:embassy-futures", "dep:rtt-target",
]
efr32-trace = []

# EFR32MG1 CRYPTO AES-128 backend for NWK/APS CCM* and AES-MMO.
hardware-aes-efr32mg1 = [
    "efr32",
    "dep:efr32mg1-hal",
    "zigbee-crypto/efr32mg1",
]

efr32mg21 = [
    "dep:embassy-sync", "dep:embassy-time", "dep:embassy-futures", "dep:rtt-target",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("tc32"))'] }
