[package]
name = "zigbee-zcl"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
heapless = "0.9"
zigbee-types = { version = "0.1.0", path = "../zigbee-types" }
log = "0.4"

[features]
default = ["float32", "float64"]
float32 = []
float64 = []
ota = []
constrained-memory = []
compact-single-endpoint = []
# Green Power cluster with the GP 1.1 attribute/command identifiers.
# Without it the pre-GP skeleton is kept so images that do not use Green
# Power stay byte-identical; it is removed once GP is enabled by default.
green-power = []
