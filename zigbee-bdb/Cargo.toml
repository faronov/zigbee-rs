[package]
name = "zigbee-bdb"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Zigbee PRO R22 BDB layer — Base Device Behavior commissioning (v3.0.1)"
repository = "https://github.com/zigbee-rs/zigbee-rs"

[dependencies]
heapless = "0.9"
zigbee-types = { version = "0.1.0", path = "../zigbee-types" }
zigbee-crypto = { version = "0.1.0", path = "../zigbee-crypto", optional = true }
zigbee-mac  = { version = "0.1.0", path = "../zigbee-mac" }
zigbee-nwk  = { version = "0.1.0", path = "../zigbee-nwk" }
zigbee-aps  = { version = "0.1.0", path = "../zigbee-aps" }
zigbee-zcl  = { version = "0.1.0", path = "../zigbee-zcl", default-features = false }
zigbee-zdo  = { version = "0.1.0", path = "../zigbee-zdo" }
log = "0.4"

[features]
default = [
    "float32",
    "float64",
    "router",
    "centralized-tclk",
    "distributed-security",
]
centralized-tclk = []
distributed-security = []
end-device = ["centralized-tclk"]
sleepy-end-device = ["end-device", "zigbee-aps/sleepy-end-device"]
# Keep formation independently selectable for host tests without enabling
# router behavior in an end-device production graph.
formation = []
finding-binding = ["finding-binding-target"]
finding-binding-target = []
float32 = ["zigbee-zcl/float32"]
float64 = ["zigbee-zcl/float64"]
router = ["centralized-tclk", "distributed-security", "formation"]
trust-center = ["router", "dep:zigbee-crypto", "zigbee-aps/trust-center"]
trace = ["zigbee-aps/trace", "zigbee-nwk/trace"]
touchlink = []

[dev-dependencies]
zigbee-mac = { version = "0.1.0", path = "../zigbee-mac", features = ["mock"] }
