[package]
name = "efr32s2-lab"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false
description = "Step-by-step EFR32 Series 2 bring-up binaries (clocks, VCOM, I2C, raw 802.15.4 radio)"

[[bin]]
name = "s2-blink"
path = "src/bin/blink.rs"

[[bin]]
name = "s2-i2c-scan"
path = "src/bin/i2c_scan.rs"

[[bin]]
name = "s2-radio"
path = "src/bin/radio.rs"

[features]
default = ["efr32mg22"]
efr32mg22 = ["efr32s2-hal/efr32mg22"]

[dependencies]
efr32s2-hal = { path = "../../efr32s2-hal", features = ["rt"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", features = ["device"] }
embedded-hal = "1.0"

[profile.dev]
opt-level = "s"
debug = true

[profile.release]
opt-level = "s"
codegen-units = 1
lto = true
debug = true
