[package]
name = "stm32wb5mm-dk-lab"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
autobins = false

# Standalone STM32WB5MM-DK peripheral diagnostics (not production firmware).
# Each binary proves one fitted part independently; see README.md.
#   cargo build --release --bin stm32wb5mm-dk-diag-rgb
[workspace]

[[bin]]
name = "stm32wb5mm-dk-diag-rgb"
path = "src/bin/diag_rgb.rs"

[[bin]]
name = "stm32wb5mm-dk-diag-lcd"
path = "src/bin/diag_lcd.rs"

[[bin]]
name = "stm32wb5mm-dk-diag-sensors"
path = "src/bin/diag_sensors.rs"

[[bin]]
name = "stm32wb5mm-dk-diag-touch"
path = "src/bin/diag_touch.rs"

[[bin]]
name = "stm32wb5mm-dk-diag-mic"
path = "src/bin/diag_mic.rs"

[dependencies]
libm = "0.2"
stm32wb-hal = { path = "../../stm32wb-hal", features = ["stm32wb55vg"] }
stm32wb5mm-dk = { path = "../../boards/stm32wb5mm-dk", features = ["rgb-led", "lcd", "sensors", "touch", "mic"] }

embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "7419ec0700f23058e90285a56c62ecd2c0a39b87", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "7419ec0700f23058e90285a56c62ecd2c0a39b87" }
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
embedded-hal = "1.0"
embedded-hal-bus = "0.3"
embedded-graphics = "0.8"

zigbee-sensor = { git = "https://github.com/faronov/zigbee-rs-drivers", rev = "d431b657366cc075bb2fee9afe01434992b7121e" }
zigbee-display = { git = "https://github.com/faronov/zigbee-rs-drivers", rev = "d431b657366cc075bb2fee9afe01434992b7121e" }
zigbee-tlc59731 = { git = "https://github.com/faronov/zigbee-rs-drivers", rev = "d431b657366cc075bb2fee9afe01434992b7121e" }
zigbee-stts22h = { git = "https://github.com/faronov/zigbee-rs-drivers", rev = "d431b657366cc075bb2fee9afe01434992b7121e" }
zigbee-lsm6dso = { git = "https://github.com/faronov/zigbee-rs-drivers", rev = "d431b657366cc075bb2fee9afe01434992b7121e" }
zigbee-vl53l0x = { git = "https://github.com/faronov/zigbee-rs-drivers", rev = "d431b657366cc075bb2fee9afe01434992b7121e" }
zigbee-pdm = { git = "https://github.com/faronov/zigbee-rs-drivers", rev = "d431b657366cc075bb2fee9afe01434992b7121e" }

[profile.release]
opt-level = "s"
debug = 2
lto = true
codegen-units = 1

# Local ST MAC layout and mailbox-acknowledgement fixes: see
# vendor/embassy-stm32-wpan/LOCAL-PATCHES.md.
[patch."https://github.com/embassy-rs/embassy"]
embassy-stm32-wpan = { path = "../../vendor/embassy-stm32-wpan" }

