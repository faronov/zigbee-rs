[package]
name = "stm32wb-fus-shim"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# SRAM-resident CPU1 helper that drives the STM32WB coprocessor FUS for a
# board without a debug probe (P-NUCLEO-WB55 USB dongle, MB1293C). It is
# loaded and started by the ROM USB DFU bootloader (hwlab stm32dfu plugin:
# memory-write + leave); see README.md. Not firmware: it never touches flash.
[workspace]

[dependencies]

[profile.release]
opt-level = "s"
debug = 2
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
