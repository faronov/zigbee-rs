[build]
target = "thumbv7em-none-eabi"

[target.thumbv7em-none-eabi]
rustflags = [
    "-L", "../../products/efr32mg1-tradfri/link",
    "-L", "../../efr32mg1-hal/link",
    "-C", "link-arg=-Tbootloader-app.x",
    "-C", "link-arg=--nmagic",
]

[unstable]
build-std = ["core", "alloc"]

[env]
DEFMT_LOG = "info"
