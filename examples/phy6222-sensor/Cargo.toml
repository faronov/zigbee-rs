[package]
name = "phy6222-sensor"
version = "0.1.0"
edition = "2024"

# One crate per board, one bin per Zigbee role. Exactly one role feature
# may be enabled per build (`src/roles.rs` enforces it for the new bins);
# the chip variant stays a separate feature:
#   cargo build --release                                            # sed, phy6222
#   cargo build --release --no-default-features --features production,phy6222,ed
#   cargo build --release --no-default-features --features production,phy6222,router
[[bin]]
name = "phy6222-sensor"
path = "src/main.rs"
required-features = ["sed"]

[[bin]]
name = "phy6222-ed"
path = "src/ed.rs"
required-features = ["ed"]

[[bin]]
name = "phy6222-router"
path = "src/router.rs"
required-features = ["router"]

[dependencies]
# The product provisions only centralized Trust Center commissioning and has
# no Groups server; keep the shared app's optional capabilities disabled.
sensor-sed-app = { path = "../../apps/sensor-sed", default-features = false }
zigbee-mac = { path = "../../zigbee-mac", default-features = false, features = ["phy6222"] }
zigbee-runtime = { path = "../../zigbee-runtime", default-features = false, features = ["compact-single-endpoint", "constrained-memory"] }
phy62x2-evk = { path = "../../boards/phy62x2-evk", default-features = false }
phy62x2-evk-product = { path = "../../products/phy62x2-evk", default-features = false }
router-app = { path = "../../apps/router", default-features = false, optional = true }
static_cell = { version = "2", optional = true }
zigbee-nwk = { path = "../../zigbee-nwk", optional = true }
zigbee-types = { path = "../../zigbee-types", optional = true }
zigbee-zcl = { path = "../../zigbee-zcl", default-features = false, optional = true }

# Embassy async runtime
# The `main` task future (~12 KiB: device, NWK/APS tables, profile) is
# allocated from the executor arena at startup; the 4 KiB default traps.
embassy-executor = { version = "0.7", default-features = false, features = ["arch-cortex-m", "executor-thread", "task-arena-size-16384"] }
embassy-time = { version = "0.5", default-features = false }

# ARM Cortex-M0 support
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", features = ["device"] }

# Compile out transitive logging in the production image.
log = { version = "0.4", default-features = false }

# Panic handler required by `no_std`. Release builds from this directory use
# the `immediate-abort` panic strategy (see `.cargo/config.toml`), so it is
# never reached there: every panic site traps into `HardFault` instead.
panic-halt = "1.0"

[features]
default = ["production", "phy6222", "sed"]
# Sleepy environmental sensor (the original image).
sed = []
# Always-on End Device: router-app AlwaysOnEndDeviceApp, end-device MAC.
ed = ["dep:router-app", "dep:static_cell", "dep:zigbee-nwk", "dep:zigbee-types", "dep:zigbee-zcl", "phy62x2-evk-product/roles"]
# Router size probe: parent MAC, ParentRouterApp, durable child and APS
# tables. Does NOT fit the XIP slot; the link is rejected (src/router.rs).
router = ["dep:router-app", "dep:static_cell", "dep:zigbee-nwk", "dep:zigbee-types", "dep:zigbee-zcl", "phy62x2-evk-product/roles", "router-app/router", "zigbee-runtime/router"]
production = ["log/release_max_level_off"]
phy6222 = ["phy62x2-evk/phy6222", "phy62x2-evk-product/phy6222"]
phy6252 = ["phy62x2-evk/phy6252", "phy62x2-evk-product/phy6252"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# `.cargo/config.toml` overrides this with `immediate-abort` for the XIP image.
panic = "abort"
