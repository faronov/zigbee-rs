[package]
name = "nrf52840-sensor-uf2"
version = "0.1.0"
edition = "2021"

[features]
default = ["board-promicro"]
# Board selection (pick exactly one):
board-promicro = [
    "dep:nrf52840-promicro",
    "nrf52840-sensor-product/deployment-promicro-uf2",
] # nice!nano-compatible board with S140 + UF2
board-mdk = [
    "dep:nrf52840-mdk-usb-dongle",
    "nrf52840-sensor-product/deployment-mdk-uf2",
] # Makerdiary MDK USB Dongle with Adafruit UF2
board-nrf-dongle = [
    "dep:nrf52840-pca10059",
    "nrf52840-sensor-product/deployment-pca10059-uf2",
] # Nordic PCA10059 with Adafruit UF2
board-nrf-dk = [
    "dep:nrf52840-dk",
    "nrf52840-sensor-product/deployment-dk",
] # Nordic nRF52840 DK, direct/J-Link map

[dependencies]
zigbee-types = { path = "../../zigbee-types" }
zigbee-mac = { path = "../../zigbee-mac", features = ["nrf52840"] }
zigbee-zcl = { path = "../../zigbee-zcl", default-features = false }
zigbee-runtime = { path = "../../zigbee-runtime", default-features = false }
nrf-sensor-app = { path = "../../apps/nrf-sensor" }
sensor-sed-app = { path = "../../apps/sensor-sed" }
nrf52840-sensor-product = { path = "../../products/nrf52840-sensor" }
nrf52840-promicro = { path = "../../boards/nrf52840-promicro", optional = true }
nrf52840-mdk-usb-dongle = { path = "../../boards/nrf52840-mdk-usb-dongle", optional = true }
nrf52840-pca10059 = { path = "../../boards/nrf52840-pca10059", optional = true }
nrf52840-dk = { path = "../../boards/nrf52840-dk", optional = true }

# nRF52840 Embassy HAL
embassy-nrf = { version = "0.3", features = ["nrf52840", "time-driver-rtc1", "gpiote"] }
embassy-executor = { version = "0.7", features = ["task-arena-size-32768", "arch-cortex-m", "executor-thread"] }
embassy-time = "0.4"
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
log = "0.4"

[profile.release]
opt-level = "s"
lto = true
debug = 2
codegen-units = 1
