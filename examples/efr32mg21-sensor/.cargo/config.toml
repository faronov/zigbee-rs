[build]
target = "thumbv8m.main-none-eabihf"

[target.thumbv8m.main-none-eabihf]
rustflags = [
    "-L", "../../products/efr32mg21-sensor/link",
    "-L", "../../boards/efr32mg21-devkit/link",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=--nmagic",
]

[unstable]
build-std = ["core", "alloc"]

[env]
DEFMT_LOG = "info"
