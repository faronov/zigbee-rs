[package]
name = "bl702-sensor"
version = "0.1.0"
edition = "2024"

# Always-on End Device (`--features ed --bin bl702-ed`).
[[bin]]
name = "bl702-ed"
path = "src/bin/ed.rs"
required-features = ["ed"]
test = false
bench = false

# Router (`--features router --bin bl702-router`): hardware auto-ACK with
# the M154 Frame Pending table (`zigbee_mac::bl702::parent_phy`), plus the
# Green Power Proxy Basic; `--features router-core` builds it without GP.
[[bin]]
name = "bl702-router"
path = "src/bin/router.rs"
required-features = ["router-core"]
test = false
bench = false

# LAB ONLY: self-re-arming loader power-cut soak (`src/bin/ota_soak.rs`).
# Build with `--features ota-soak --bin bl702-ota-soak`; never publish.
[[bin]]
name = "bl702-ota-soak"
path = "src/bin/ota_soak.rs"
required-features = ["ota-soak"]
test = false
bench = false

[features]
default = ["production"]
production = ["log/release_max_level_off"]
diagnostic-logging = []
# Mains roles of the role template; build one at a time (src/roles.rs
# rejects both together). The sensor SED (`bl702-sensor`) needs neither.
ed = ["dep:router-app", "dep:static_cell", "dep:portable-atomic", "dep:zigbee-nwk", "bl702-xt-zb1-product/roles"]
ota-soak = ["dep:bl702-xt-zb1-layout", "dep:embedded-storage", "dep:mcuboot-image"]
# LAB ONLY: the sensor never confirms an installed image (loader trial
# expiry check); `BL702_LAB_NO_CONFIRM=1 ./build-image.sh`. Never publish.
lab-no-confirm = ["bl702-xt-zb1-product/lab-no-confirm"]
# Router with the Green Power Proxy Basic (default-on for every router
# image); `router-core` is the router without it.
router = ["router-core", "green-power"]
router-core = ["dep:router-app", "dep:static_cell", "dep:portable-atomic", "dep:zigbee-nwk", "bl702-xt-zb1-product/roles", "router-app/router", "zigbee-runtime/router"]
# Green Power Proxy Basic with its durable Proxy Table at 0xF7000.
green-power = ["router-core", "router-app/green-power", "bl702-xt-zb1-product/green-power"]

[dependencies]
bl702-hal = { path = "../../bl702-hal" }
bl702-xt-zb1 = { path = "../../boards/bl702-xt-zb1" }
bl702-xt-zb1-product = { path = "../../products/bl702-xt-zb1" }
bl702-xt-zb1-layout = { path = "../../products/bl702-xt-zb1/layout", optional = true }
embedded-storage = { version = "0.3", optional = true }
mcuboot-image = { path = "../../mcuboot-image", optional = true }
router-app = { path = "../../apps/router", default-features = false, optional = true }
static_cell = { version = "2", optional = true }
# riscv32imc has no CAS: `static_cell` claims its cells through
# portable-atomic's critical section (riscv `critical-section-single-hart`).
portable-atomic = { version = "1", default-features = false, features = ["critical-section"], optional = true }
zigbee-nwk = { path = "../../zigbee-nwk", optional = true }
sensor-sed-app = { path = "../../apps/sensor-sed", features = ["ota"] }
zigbee-mac = { path = "../../zigbee-mac", features = ["bl702", "hardware-aes-bl702"] }
zigbee-zcl = { path = "../../zigbee-zcl", default-features = false }
zigbee-runtime = { path = "../../zigbee-runtime", default-features = false, features = ["constrained-memory"] }

# Embassy async runtime (executor + time driver)
embassy-executor = { version = "0.7", features = [
    "arch-riscv32",
    "executor-thread",
    "task-arena-size-16384",
] }
embassy-time = { version = "0.5" }
embassy-time-driver = "0.2"

# RISC-V support
riscv = { version = "0.15", features = ["critical-section-single-hart"] }
riscv-rt = "0.16"

# Logging
log = "0.4"

# Panic handler for embedded target
panic-halt = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
