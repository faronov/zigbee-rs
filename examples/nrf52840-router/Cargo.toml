[package]
name = "nrf52840-router"
version = "0.1.0"
edition = "2021"

[dependencies]
zigbee-types = { path = "../../zigbee-types" }
zigbee-mac = { path = "../../zigbee-mac", features = ["nrf52840"] }
zigbee-nwk = { path = "../../zigbee-nwk" }
zigbee-runtime = { path = "../../zigbee-runtime", default-features = false }
zigbee-zcl = { path = "../../zigbee-zcl", default-features = false }
router-app = { path = "../../apps/router" }
nrf52840-dk = { path = "../../boards/nrf52840-dk" }
nrf52840-router-product = { path = "../../products/nrf52840-router" }

# nRF52840 HAL + Embassy
embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread"] }
embassy-nrf = { version = "0.3", features = ["nrf52840", "time-driver-rtc1"] }
embassy-time = "0.4"

cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
log = "0.4"

[profile.release]
opt-level = "s"
debug = 2
lto = true
codegen-units = 1
