[package]
name = "mock-light"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mock-light"
path = "src/main.rs"

[features]
# Green Power Proxy Basic, on in every router composition. The host demo
# keeps its Proxy Table in RAM (`RamGpProxyStore`); firmware products use a
# flash journal.
default = ["green-power"]
green-power = ["router-app/green-power", "zigbee-runtime/green-power"]

[dependencies]
router-app = { path = "../../apps/router", features = ["router"] }
zigbee-aps = { path = "../../zigbee-aps" }
zigbee-mac = { path = "../../zigbee-mac", features = ["mock"] }
zigbee-runtime = { path = "../../zigbee-runtime", default-features = false, features = ["router"] }
zigbee-types = { path = "../../zigbee-types" }
zigbee-zcl = { path = "../../zigbee-zcl", default-features = false }
pollster = "0.4"
