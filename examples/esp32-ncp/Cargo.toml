[package]
name = "esp32-ncp"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# zigbee-rs ZRHP v1 network co-processor (coordinator + Trust Center) for
# the ESP32-H2, with an ESP32-C6 lab variant:
#   cargo build --release                                            # H2, USJ
#   cargo build --release --no-default-features --features esp32c6,transport-usj
#   cargo build --release --no-default-features --features esp32h2,transport-uart,thread-br-h2
[[bin]]
name = "esp32-ncp"
path = "src/main.rs"

# PTA lab image for the Thread BR board (never a product image):
#   cargo build --release --no-default-features --features esp32h2,transport-uart,pta-lab --bin pta_lab
[[bin]]
name = "pta_lab"
path = "src/bin/pta_lab.rs"
required-features = ["pta-lab"]

[dependencies]
esp32-zigbee-ncp-product = { path = "../../products/esp32-zigbee-ncp" }
# Executor and SYSTIMER embassy time driver (layout-independent glue).
esp32-zigbee-devkit-product = { path = "../../products/esp32-zigbee-devkit" }
ncp-coordinator-app = { path = "../../apps/ncp-coordinator" }
# GP combo (spec 7.11): Proxy Basic, the sink (`green-power-ncp`, 16-entry
# Sink Table) and the TempMaster (`green-power-bidirectional`: the H2/C6
# radio arms the reply and sends it gpTxOffset after the GPD's frame).
router-app = { path = "../../apps/router", default-features = false, features = ["centralized-tclk", "global-aps-counter", "ncp-capacity", "green-power-sink", "green-power-bidirectional"] }
# `ncp-capacity`: NCP table sizes (spec 8.9), incl. the 64-entry Frame
# Pending table of the ESP parent MAC.
zigbee-runtime = { path = "../../zigbee-runtime", default-features = false, features = [
    "centralized-tclk",
    "trust-center",
    "global-aps-counter",
    "host-passthrough",
    "ncp-capacity",
    "green-power-ncp",
    "green-power-bidirectional",
] }
zigbee-mac = { path = "../../zigbee-mac", features = ["esp-parent", "pan-coordinator", "energy-detect", "ncp-capacity"] }
zigbee-aps = { path = "../../zigbee-aps" }
zigbee-bdb = { path = "../../zigbee-bdb", default-features = false }
zigbee-types = { path = "../../zigbee-types" }
zigbee-zcl = { path = "../../zigbee-zcl", default-features = false }
esp-serial-stream = { path = "../../esp-serial-stream" }
esp-thread-br-h2 = { path = "../../boards/esp-thread-br-h2", optional = true }
# `pta_lab` console only (USB-Serial-JTAG of the H2).
esp-println = { version = "0.12", features = ["esp32h2"], optional = true }

esp-bootloader-esp-idf = { version = "0.4.0", default-features = false }
esp-hal = { version = "=1.0.0", features = ["unstable"] }
# The stalled automatic-ACK watchdog (`ieee802154-tx-ack-watchdog`) comes
# with zigbee-mac's ESP backend.
esp-radio = { version = "=0.17.0", features = ["ieee802154", "unstable"] }
esp-alloc = "0.9"
static_cell = "2"
log = "0.4"
embassy-time = "0.4"
portable-atomic = { version = "1", features = ["unsafe-assume-single-core"] }

[features]
default = ["esp32h2", "transport-usj"]
esp32h2 = [
    "esp32-zigbee-ncp-product/esp32h2",
    "esp32-zigbee-devkit-product/esp32h2",
    "zigbee-mac/esp32h2",
    "esp-bootloader-esp-idf/esp32h2",
    "esp-hal/esp32h2",
    "esp-radio/esp32h2",
    "esp-serial-stream/esp32h2",
]
esp32c6 = [
    "esp32-zigbee-ncp-product/esp32c6",
    "esp32-zigbee-devkit-product/esp32c6",
    "zigbee-mac/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-hal/esp32c6",
    "esp-radio/esp32c6",
    "esp-serial-stream/esp32c6",
]
transport-usj = ["esp32-zigbee-ncp-product/transport-usj"]
transport-uart = ["esp32-zigbee-ncp-product/transport-uart"]
thread-br-h2 = ["esp32-zigbee-ncp-product/thread-br-h2", "dep:esp-thread-br-h2"]
rtscts-reserved-lines = ["thread-br-h2", "esp32-zigbee-ncp-product/rtscts-reserved-lines"]
flash-2mb = ["esp32-zigbee-ncp-product/flash-2mb"]
# Development firmware policy (never in shipped images): FW_* accepts
# unsigned images and, with FW_BEGIN flags bit0, downgrades.
dev-unsigned-fw = ["esp32-zigbee-ncp-product/dev-unsigned-fw"]
# PTA coexistence follower (product `pta::Pta`; adds the radio's
# external-coexistence hooks). Not yet driven by `main.rs`.
pta = ["thread-br-h2", "esp32-zigbee-ncp-product/pta"]
# `pta_lab` binary (src/bin/pta_lab.rs).
pta-lab = ["pta", "dep:esp-println"]
# Lab: boot markers, panic/stage/transport records across resets and a
# boot watchdog on UART0 (src/lab.rs; never in shipped images).
boot-trace = []

[profile.release]
opt-level = "s"
lto = true

[patch.crates-io]
esp-hal = { path = "../../vendor/esp-hal" }
esp-radio = { path = "../../vendor/esp-radio" }
