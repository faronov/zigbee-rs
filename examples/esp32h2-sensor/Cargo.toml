[package]
name = "esp32h2-sensor"
version = "0.1.0"
edition = "2021"
autobins = false

# One crate per board, one bin per Zigbee role. Exactly one role feature
# may be enabled per build (`src/roles.rs` enforces it for the new bins), so
# dependency feature unification never links router code into an
# end-device image:
#   cargo build --release                                       # sed (default)
#   cargo build --release --no-default-features --features ed
#   cargo build --release --no-default-features --features router
[[bin]]
name = "esp32h2-sensor"
path = "src/main.rs"
required-features = ["sed"]

# Battery thermometer build profile (`thermometer.toml`), see
# `src/thermometer.rs`:
#   cargo build --release --bin esp32h2-thermometer --features thermometer,light-sleep,quiet
[[bin]]
name = "esp32h2-thermometer"
path = "src/thermometer.rs"
required-features = ["thermometer"]

# Sleep-floor lab (no Zigbee, `floor_lab.toml`, see `src/floor_lab.rs`):
#   cargo build --release --no-default-features --features floor-lab --bin esp32h2-floor-lab
[[bin]]
name = "esp32h2-floor-lab"
path = "src/floor_lab.rs"
required-features = ["floor-lab"]

[[bin]]
name = "esp32h2-ed"
path = "src/ed.rs"
required-features = ["ed"]

[[bin]]
name = "esp32h2-router"
path = "src/router.rs"
required-features = ["router"]

[dependencies]
zigbee-types = { path = "../../zigbee-types" }
zigbee-mac = { path = "../../zigbee-mac", features = ["esp32h2"] }
zigbee-zcl = { path = "../../zigbee-zcl" }
zigbee-runtime = { path = "../../zigbee-runtime", features = ["ota"] }
sensor-sed-app = { path = "../../apps/sensor-sed", features = ["ota"], optional = true }
router-app = { path = "../../apps/router", default-features = false, optional = true }
zigbee-nwk = { path = "../../zigbee-nwk", optional = true }
zigbee-aps = { path = "../../zigbee-aps", optional = true }
esp32-zigbee-devkit-product = { path = "../../products/esp32-zigbee-devkit", features = ["esp32h2"] }
# Own PMU sleep backend; the floor lab calls it directly (no product).
esp32h2-sleep = { path = "../../esp32h2-sleep" }
critical-section = "1.2"

# ESP32-H2 HAL and runtime
esp-bootloader-esp-idf = { version = "0.4.0", default-features = false, features = ["esp32h2"] }
esp-hal = { version = "=1.0.0", features = ["esp32h2", "unstable"] }
esp-radio = { version = "=0.17.0", features = ["esp32h2", "ieee802154", "unstable"] }
esp-backtrace = { version = "0.14", features = ["esp32h2", "panic-handler", "println"] }
esp-println = { version = "0.12", features = ["esp32h2"] }
esp-alloc = "0.9"
static_cell = "2"
heapless = { version = "0.9", optional = true }
log = "0.4"

# The product supplies the interrupt-driven clock and CPU-idle executor.
embassy-time = { version = "0.4" }

portable-atomic = { version = "1", features = ["unsafe-assume-single-core"] }

[profile.release]
opt-level = "s"
lto = true

[features]
default = ["sed"]
# Sleepy environmental sensor (the original image).
sed = ["dep:sensor-sed-app", "esp32-zigbee-devkit-product/sed"]
# Always-on End Device: router-app AlwaysOnEndDeviceApp, end-device MAC.
ed = ["dep:router-app", "dep:zigbee-nwk", "esp32-zigbee-devkit-product/roles"]
# Router: parent MAC (hardware auto-ACK with Frame Pending from the PHY's
# source table), ParentRouterApp, durable child and APS tables.
router = [
    "dep:router-app",
    "router-app/router",
    "zigbee-runtime/router",
    "zigbee-mac/esp-parent",
    "esp32-zigbee-devkit-product/roles",
]
# Retained light sleep for the sleepy sensor only.
light-sleep = ["esp32-zigbee-devkit-product/light-sleep"]
# Experimental TOP/CPU/modem power-down light sleep (`esp32h2-sleep`
# `top-pd`); `thermometer.toml` `sleep_mode = "top_pd"` (or floor_lab.toml
# `light_mode`) selects it. With "retained" the code is linked but unused.
top-pd = ["light-sleep", "esp32-zigbee-devkit-product/h2-top-pd"]
# Temperature-only sleepy thermometer (`esp32h2-thermometer` bin); its
# identity, reporting defaults and cadence come from `thermometer.toml`.
thermometer = ["sed", "dep:zigbee-aps", "reporting-persist", "anomaly-record"]
# Journal the keep-awake anomaly record in `zbnv` (only when a limit fires)
# and publish it as Diagnostics (0x0B05) attributes.
anomaly-record = ["dep:heapless", "esp32-zigbee-devkit-product/anomaly-record"]
# Keep coordinator Configure Reporting across resets (product `zbnv` journal).
reporting-persist = ["esp32-zigbee-devkit-product/reporting-persist"]
# Board/chip sleep-floor lab binary; no Zigbee stack, never a product image.
floor-lab = []
# Compile out all `log` output; the thermometer bin then links no console.
quiet = ["log/max_level_off", "log/release_max_level_off"]

[patch.crates-io]
esp-hal = { path = "../../vendor/esp-hal" }
esp-radio = { path = "../../vendor/esp-radio" }
