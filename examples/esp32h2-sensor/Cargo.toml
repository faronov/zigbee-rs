[package]
name = "esp32h2-sensor"
version = "0.1.0"
edition = "2021"

[dependencies]
zigbee-types = { path = "../../zigbee-types" }
zigbee-mac = { path = "../../zigbee-mac", features = ["esp32h2"] }
zigbee-zcl = { path = "../../zigbee-zcl" }
zigbee-runtime = { path = "../../zigbee-runtime", features = ["ota"] }
sensor-sed-app = { path = "../../apps/sensor-sed", features = ["ota"] }
esp32-zigbee-devkit-product = { path = "../../products/esp32-zigbee-devkit", features = ["esp32h2"] }

# ESP32-H2 HAL and runtime
esp-bootloader-esp-idf = { version = "0.4.0", default-features = false, features = ["esp32h2"] }
esp-hal = { version = "=1.0.0", features = ["esp32h2", "unstable"] }
esp-radio = { version = "=0.17.0", features = ["esp32h2", "ieee802154", "unstable"] }
esp-backtrace = { version = "0.14", features = ["esp32h2", "panic-handler", "println"] }
esp-println = { version = "0.12", features = ["esp32h2"] }
esp-alloc = "0.9"
static_cell = "2"
log = "0.4"

# The product supplies the interrupt-driven clock and CPU-idle executor.
embassy-time = { version = "0.4" }

portable-atomic = { version = "1", features = ["unsafe-assume-single-core"] }

[profile.release]
opt-level = "s"
lto = true

[features]
default = []
light-sleep = ["esp32-zigbee-devkit-product/light-sleep"]

[patch.crates-io]
esp-hal = { path = "../../vendor/esp-hal" }
esp-radio = { path = "../../vendor/esp-radio" }
