[package]
name = "telink-tlsr8258-router"
version = "0.1.0"
edition = "2024"

[features]
# The production router carries the Green Power Proxy Basic (default-on for
# every router image); `--no-default-features --features router-core`
# (`scripts/tlsr8258.sh build router-core`) builds it without GP.
default = ["router"]
router = ["router-core", "green-power"]
router-core = []
# Green Power Proxy Basic with its durable Proxy Table at 0x6E000.
green-power = [
    "router-core",
    "router-app/green-power",
    "zigbee-runtime/green-power",
    "tlsr8258-tb04-product/green-power",
]
# Lab-only images; production builds enable neither.
# Debugger-driven secured / Trust Center rejoin request cell.
lab-rejoin-trigger = ["router-app/rejoin-request"]
# Receive-queue overflow attribution ring in the TLSR8258 HAL.
lab-rx-trace = ["tlsr8258-hal/lab-rx-trace"]

[dependencies]
router-app = { path = "../../apps/router", features = ["router"] }
zigbee-types = { path = "../../zigbee-types" }
zigbee-mac = { path = "../../zigbee-mac", features = ["tlsr8258", "hardware-aes"] }
zigbee-nwk = { path = "../../zigbee-nwk" }
zigbee-aps = { path = "../../zigbee-aps" }
zigbee-zcl = { path = "../../zigbee-zcl", default-features = false }
zigbee-runtime = { path = "../../zigbee-runtime", default-features = false, features = ["router"] }
tlsr8258-hal = { path = "../../tlsr8258-hal" }
tlsr8258-rt = { path = "../../tlsr8258-rt" }
tlsr8258-tb04 = { path = "../../boards/tlsr8258-tb04" }
tlsr8258-tb04-product = { path = "../../products/tlsr8258-tb04" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
