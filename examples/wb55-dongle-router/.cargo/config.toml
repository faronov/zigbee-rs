[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
# Flash through HWLab: the ROM USB DFU bootloader (stm32dfu plugin).
rustflags = [
    "-L", "../../products/stm32wb-router/link",
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Ttl_mbox.x",
]
