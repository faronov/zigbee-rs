[package]
name = "esp32c6-sensor"
version = "0.1.0"
edition = "2021"
autobins = false

# One crate per board, one bin per Zigbee role. Exactly one role feature
# may be enabled per build (`src/roles.rs` enforces it for the new bins), so
# dependency feature unification never links router code into an
# end-device image:
#   cargo build --release                                       # sed (default)
#   cargo build --release --no-default-features --features ed
#   cargo build --release --no-default-features --features router       # with Green Power
#   cargo build --release --no-default-features --features router-core  # without it
[[bin]]
name = "esp32c6-sensor"
path = "src/main.rs"
required-features = ["sed"]

[[bin]]
name = "esp32c6-ed"
path = "src/ed.rs"
required-features = ["ed"]

[[bin]]
name = "esp32c6-router"
path = "src/router.rs"
required-features = ["router-core"]

[dependencies]
zigbee-types = { path = "../../zigbee-types" }
zigbee-mac = { path = "../../zigbee-mac", features = ["esp32c6"] }
zigbee-zcl = { path = "../../zigbee-zcl" }
zigbee-runtime = { path = "../../zigbee-runtime", features = ["ota"] }
sensor-sed-app = { path = "../../apps/sensor-sed", features = ["ota"], optional = true }
router-app = { path = "../../apps/router", default-features = false, optional = true }
zigbee-nwk = { path = "../../zigbee-nwk", optional = true }
esp32-zigbee-devkit-product = { path = "../../products/esp32-zigbee-devkit", features = ["esp32c6"] }

# ESP32-C6 HAL and runtime
esp-bootloader-esp-idf = { version = "0.4.0", default-features = false, features = ["esp32c6"] }
esp-hal = { version = "=1.0.0", features = ["esp32c6", "unstable"] }
esp-radio = { version = "=0.17.0", features = ["esp32c6", "ieee802154", "unstable"] }
esp-backtrace = { version = "0.14", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.12", features = ["esp32c6"] }
esp-alloc = "0.9"
static_cell = "2"
log = "0.4"

# The product supplies the interrupt-driven clock and CPU-idle executor.
embassy-time = { version = "0.4" }

# Portable atomics for single-core RISC-V
portable-atomic = { version = "1", features = ["unsafe-assume-single-core"] }

[profile.release]
opt-level = "s"
lto = true

[features]
default = ["sed"]
# Sleepy environmental sensor (the original image).
sed = ["dep:sensor-sed-app", "esp32-zigbee-devkit-product/sed"]
# Always-on End Device: router-app AlwaysOnEndDeviceApp, end-device MAC.
ed = ["dep:router-app", "dep:zigbee-nwk", "esp32-zigbee-devkit-product/roles"]
# Router: `router-core` plus the Green Power proxy (GP is on in every
# router image; `--features router-core` builds the router without it).
router = ["router-core", "green-power"]
# Router without Green Power: parent MAC (hardware auto-ACK with Frame
# Pending from the PHY's source table), ParentRouterApp, durable child and
# APS tables.
router-core = [
    "dep:router-app",
    "router-app/router",
    "zigbee-runtime/router",
    "zigbee-mac/esp-parent",
    "esp32-zigbee-devkit-product/roles",
    "status-led",
]
# WS2812 status LED on GPIO8 (RMT) for the mains roles: always on in the
# router, opt-in for the ED (`--features ed,status-led`). Sleepy images
# reject it.
status-led = ["esp32-zigbee-devkit-product/status-led"]
# Lab only, never in shipped images: red, green, blue for 3 s each when the
# LED starts, to check the colour byte order of the board.
status-led-selftest = ["status-led", "esp32-zigbee-devkit-product/status-led-selftest"]
# Green Power Proxy Basic on the router: tunnels GPDFs to the sink and
# journals the Proxy Table in `zbnv`. Part of `router`.
green-power = [
    "router-core",
    "router-app/green-power",
    "esp32-zigbee-devkit-product/green-power",
]
# Retained light sleep for the sleepy sensor only.
light-sleep = ["esp32-zigbee-devkit-product/light-sleep"]
# Accept only signed MCUboot envelopes over OTA (see the product's
# `signed_ota` module and `boot/app-verify.conf`).
signed-ota = ["esp32-zigbee-devkit-product/signed-ota"]

[patch.crates-io]
esp-hal = { path = "../../vendor/esp-hal" }
esp-radio = { path = "../../vendor/esp-radio" }
