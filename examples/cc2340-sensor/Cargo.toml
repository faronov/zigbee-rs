[package]
name = "cc2340-sensor"
version = "0.1.0"
edition = "2024"

[dependencies]
cc2340-sensor-product = { path = "../../products/cc2340-sensor" }
lp-em-cc2340r5 = { path = "../../boards/lp-em-cc2340r5" }
sensor-sed-app = { path = "../../apps/sensor-sed" }
zigbee-types = { path = "../../zigbee-types" }
zigbee-mac = { path = "../../zigbee-mac", features = ["cc2340"] }
zigbee-zcl = { path = "../../zigbee-zcl" }
zigbee-runtime = { path = "../../zigbee-runtime" }

# Embassy async runtime
embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread"] }
embassy-time = "0.5"

# ARM Cortex-M0+ support
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"

# Logging
log = "0.4"
rtt-target = "0.6"

# Panic handler for embedded target
panic-halt = "1.0"

[profile.release]
opt-level = "s"
lto = true
