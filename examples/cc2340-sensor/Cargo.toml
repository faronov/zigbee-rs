[package]
name = "cc2340-sensor"
version = "0.1.0"
edition = "2024"

# One crate per board, one bin per Zigbee role. Exactly one role feature
# may be enabled per build (`src/roles.rs` enforces it for the new bins):
#   cargo build --release                                       # sed (default)
#   cargo build --release --no-default-features --features ed
#   cargo build --release --no-default-features --features router
[[bin]]
name = "cc2340-sensor"
path = "src/main.rs"
required-features = ["sed"]

[[bin]]
name = "cc2340-ed"
path = "src/ed.rs"
required-features = ["ed"]

[[bin]]
name = "cc2340-router"
path = "src/router.rs"
required-features = ["router"]

[features]
default = ["sed"]
# Sleepy BATMON sensor (the original image).
sed = []
# Always-on End Device: router-app AlwaysOnEndDeviceApp, end-device MAC.
ed = ["dep:router-app", "dep:static_cell", "dep:zigbee-nwk", "cc2340-sensor-product/roles"]
# Router size probe: parent MAC, ParentRouterApp, durable child and APS
# tables. Does NOT fit the 36 KiB SRAM; the link is rejected (src/router.rs).
router = ["dep:router-app", "dep:static_cell", "dep:zigbee-nwk", "cc2340-sensor-product/roles", "router-app/router", "zigbee-runtime/router"]

[dependencies]
cc2340-sensor-product = { path = "../../products/cc2340-sensor" }
lp-em-cc2340r5 = { path = "../../boards/lp-em-cc2340r5" }
sensor-sed-app = { path = "../../apps/sensor-sed" }
zigbee-types = { path = "../../zigbee-types" }
zigbee-mac = { path = "../../zigbee-mac", features = ["cc2340"] }
zigbee-zcl = { path = "../../zigbee-zcl" }
zigbee-runtime = { path = "../../zigbee-runtime" }
zigbee-nwk = { path = "../../zigbee-nwk", optional = true }
router-app = { path = "../../apps/router", default-features = false, optional = true }
static_cell = { version = "2", optional = true }

# Pinned nightly gives each task compiler-sized static storage, not a 4 KiB arena.
embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread", "nightly"] }
embassy-time = "0.5"
embassy-futures = "0.1"

# ARM Cortex-M0+ support
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"

# Logging
log = "0.4"
rtt-target = "0.6"

# Panic handler for embedded target
panic-halt = "1.0"

[profile.release]
opt-level = "s"
lto = true
