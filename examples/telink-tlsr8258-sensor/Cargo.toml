[package]
name = "telink-tlsr8258-sensor"
version = "0.1.0"
edition = "2024"

[features]
default = []
# LOW32K reset-on-wake image (retention startup, retained composition). The
# 10-second selection changes only the joined slow-poll policy.
retention-proof = [
    "tlsr8258-rt/retention-proof",
    "tlsr8258-tb04-product/retention-proof",
]
retention-proof-10s = [
    "retention-proof",
    "tlsr8258-tb04-product/retention-proof-10s",
]

[dependencies]
sensor-sed-app = { path = "../../apps/sensor-sed" }
zigbee-types = { path = "../../zigbee-types" }
zigbee-mac = { path = "../../zigbee-mac", features = ["tlsr8258", "hardware-aes"] }
zigbee-zcl = { path = "../../zigbee-zcl", default-features = false }
zigbee-runtime = { path = "../../zigbee-runtime", default-features = false, features = ["constrained-memory"] }
tlsr8258-hal = { path = "../../tlsr8258-hal" }
tlsr8258-rt = { path = "../../tlsr8258-rt" }
tlsr8258-sensor-app = { path = "../../apps/tlsr8258-sensor" }
tlsr8258-tb04 = { path = "../../boards/tlsr8258-tb04" }
tlsr8258-tb04-product = { path = "../../products/tlsr8258-tb04", default-features = false, features = ["sensor"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
