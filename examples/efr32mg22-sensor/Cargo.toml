[package]
name = "efr32mg22-sensor"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

# One crate per board, one bin per Zigbee role. Exactly one role feature
# may be enabled per build (`src/roles.rs` enforces it for the new bins), so
# dependency feature unification never links router code into an
# end-device image:
#   cargo build --release                                       # sed (default)
#   cargo build --release --no-default-features --features ed
#   cargo build --release --no-default-features --features router
[[bin]]
name = "efr32mg22-sensor"
path = "src/main.rs"
required-features = ["sed"]

[[bin]]
name = "efr32mg22-ed"
path = "src/ed.rs"
required-features = ["ed"]

[[bin]]
name = "efr32mg22-router"
path = "src/router.rs"
required-features = ["router"]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", features = ["device"] }
efr32mg22-devkit = { path = "../../boards/efr32mg22-devkit" }
efr32mg22-sensor-product = { path = "../../products/efr32mg22-sensor" }
efr32s2-hal = { path = "../../efr32s2-hal", features = ["efr32mg22", "rt", "time-driver"] }
router-app = { path = "../../apps/router", default-features = false }
sensor-sed-app = { path = "../../apps/sensor-sed", optional = true }
zigbee-mac = { path = "../../zigbee-mac", features = ["efr32mg22"] }
zigbee-nwk = { path = "../../zigbee-nwk" }
zigbee-runtime = { path = "../../zigbee-runtime", default-features = false, features = ["constrained-memory"] }
zigbee-types = { path = "../../zigbee-types" }
zigbee-zcl = { path = "../../zigbee-zcl", default-features = false }

# Embassy. `tick-hz-32_768` matches the RTCC that drives the HAL time
# driver (`efr32s2-hal/time-driver`), which keeps counting in EM2.
# `embassy-time-driver` is `links = "embassy-time"`: zigbee-mac's
# embassy-time 0.4 and this crate's 0.5 share the same driver instance.
embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread", "nightly"] }
embassy-futures = "0.1"
embassy-time = "0.5"
embassy-time-driver = { version = "0.2", features = ["tick-hz-32_768"] }
log = "0.4"
static_cell = "2"

[build-dependencies]
zrs-boot-layout = { path = "../../bootloaders/layout" }

[features]
default = ["sed"]
# Sleepy environmental sensor (the original image).
sed = ["dep:sensor-sed-app", "efr32mg22-sensor-product/sed"]
# Always-on End Device: router-app AlwaysOnEndDeviceApp, end-device MAC.
ed = []
# Router: parent MAC (interrupt Imm-Ack, HAL-owned Frame Pending), ParentRouterApp,
# durable child and APS tables. Does NOT fit the 32 KiB SRAM of this part:
# the product linker script rejects the link (see src/router.rs).
router = ["router-app/router", "zigbee-runtime/router", "efr32s2-hal/isr-ack"]
# Keep the debug interface powered in EM2 (SWD attach while asleep).
# Off by default so EM2 current is representative.
em2-debug = []
# Lab: fill the stack with 0xCCCCCCCC at reset so the high-water mark can
# be read over SWD (first non-pattern word above `__ebss`).
stack-paint = ["cortex-m-rt/paint-stack"]
# Link into the primary slot of the zigbee-rs loader layout
# (products/efr32mg22-sensor/boot/devkit.layout) instead of the direct map;
# sign the result with tools/zrs_boot_ota.py for bootloaders/efr32s2-boot.
# With `sed` the sensor also receives Zigbee OTA images into the secondary
# slot (products/efr32mg22-sensor/src/ota.rs). Loader-linked images compile
# `log` to warnings: the slot's 236,288 B cannot hold the OTA client with
# info-level logs (measured 265,908 B, 233,596 B at warn); the sensor
# prints its version and loader channel as a raw VCOM marker line.
zrs-boot = ["efr32mg22-sensor-product/zrs-boot", "log/release_max_level_warn"]

[profile.dev]
opt-level = "s"
debug = true

[profile.release]
opt-level = "s"
codegen-units = 1
lto = true
debug = true
panic = "abort"
