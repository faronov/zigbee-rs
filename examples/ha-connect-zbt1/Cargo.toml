[package]
name = "ha-connect-zbt1-ed"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

# One crate per board, one bin per Zigbee role. Exactly one role feature
# may be enabled per build (`src/platform.rs` enforces it), so dependency
# feature unification never links router code into an end-device image:
#   cargo build --release                                       # ed (default)
#   cargo build --release --no-default-features --features router
#   cargo build --release --no-default-features --features sed
# `router` includes the Green Power proxy; `router-core` is the router
# without it. Loader-linked router (primary slot of boot/zbt1.layout,
# chained after the Gecko Bootloader; the layout reserves the GP window),
# in its own target dir:
#   cargo build --release --no-default-features --features router,zrs-boot \
#     --target-dir target/zrs-boot
[[bin]]
name = "ha-connect-zbt1-ed"
path = "src/main.rs"
required-features = ["ed"]

[[bin]]
name = "ha-connect-zbt1-router"
path = "src/router.rs"
required-features = ["router-core"]

[[bin]]
name = "ha-connect-zbt1-sed"
path = "src/sed.rs"
required-features = ["sed"]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", features = ["device"] }
efr32s2-hal = { path = "../../efr32s2-hal", features = ["efr32mg21", "rt", "time-driver"] }
ha-connect-zbt1 = { path = "../../boards/ha-connect-zbt1" }
ha-connect-zbt1-product = { path = "../../products/ha-connect-zbt1" }
router-app = { path = "../../apps/router", default-features = false }
sensor-sed-app = { path = "../../apps/sensor-sed", default-features = false, optional = true }
zigbee-mac = { path = "../../zigbee-mac", features = ["efr32mg21"] }
zigbee-nwk = { path = "../../zigbee-nwk" }
zigbee-runtime = { path = "../../zigbee-runtime", default-features = false }
zigbee-types = { path = "../../zigbee-types" }
zigbee-zcl = { path = "../../zigbee-zcl", default-features = false }

# Embassy. `tick-hz-32_768` matches the RTCC that drives the HAL time
# driver (`efr32s2-hal/time-driver`). `embassy-time-driver` is
# `links = "embassy-time"`: zigbee-mac's embassy-time 0.4 and this crate's
# 0.5 share the same driver instance.
embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread", "nightly"] }
embassy-time = "0.5"
embassy-time-driver = { version = "0.2", features = ["tick-hz-32_768"] }
log = "0.4"
static_cell = "2"

[build-dependencies]
zrs-boot-layout = { path = "../../bootloaders/layout" }

[features]
default = ["ed"]
# Always-on End Device (the original image).
ed = []
# Router: parent MAC (interrupt Imm-Ack, HAL-owned Frame Pending), ParentRouterApp,
# durable child and APS tables, plus the Green Power proxy (`green-power`).
router = ["router-core", "green-power"]
# The router without Green Power (also the loader-linked router's base).
router-core = ["router-app/router", "zigbee-runtime/router", "efr32s2-hal/isr-ack"]
# Green Power Proxy Basic: tunnels GPDFs to the sink and journals the Proxy
# Table at 0xF0000 (direct map and loader layout).
green-power = [
    "router-core",
    "router-app/green-power",
    "ha-connect-zbt1-product/green-power",
]
# Sleepy End Device: sensor-sed-app lifecycle, EM2 between slow polls.
sed = [
    "dep:sensor-sed-app",
    "ha-connect-zbt1-product/sed",
    "zigbee-runtime/sleepy-end-device",
]
# SED lab: keep the debug interface powered in EM2 (RTT/SWD while asleep).
em2-debug = []
# Router image for the zigbee-rs loader (products/ha-connect-zbt1/boot/
# zbt1.layout): linked into the primary slot, confirms its trial once back
# on the network. Upgrades are staged over SWD (no Zigbee OTA client).
# Router role only (src/platform.rs); combine with `router` (or
# `router-core` for the loader-linked router without Green Power).
zrs-boot = ["ha-connect-zbt1-product/zrs-boot"]
# TEST-ONLY trial-expiry bench image: never confirms, so the loader reports
# the expired trial and keeps booting it (overwrite mode).
trial-no-confirm = ["zrs-boot"]

[profile.dev]
opt-level = "s"
debug = true

[profile.release]
opt-level = "s"
codegen-units = 1
lto = true
debug = true
panic = "abort"
