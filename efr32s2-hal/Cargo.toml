[package]
name = "efr32s2-hal"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pure-Rust EFR32 Series 2 (EFR32MG21 / EFR32MG22 / EFR32MG24) peripheral and radio support"
repository = "https://github.com/faronov/zigbee-rs"
publish = false

[features]
# Exactly one chip must be selected.
efr32mg21 = []
efr32mg22 = []
# EFR32MG24 (xG24, Series 2 config 4). The die alone is not enough: select
# the PA variant of the part too (it sets the HFXO fixed-capacitor default,
# GSDK [PM-5131], and the radio's PA tables).
efr32mg24 = []
# EFR32MG24 parts with the 10 dBm medium-power PA (e.g. A410/B210/B310).
efr32mg24-pa10 = ["efr32mg24"]
# EFR32MG24 parts with the 20 dBm high-power PA (e.g. A420/B220).
efr32mg24-pa20 = ["efr32mg24"]
# The board's HFXO crystal is 39 MHz instead of the default 38.4 MHz
# (selected by the board crate; the radio tables and every cycle-based
# delay depend on it). Only EFR32MG24 boards use it so far.
hfxo-39mhz = []
# Provide `__INTERRUPTS` for cortex-m-rt's `device` feature.
rt = []
# Embassy time driver on the RTCC (32,768 Hz, runs in EM2). Defines the
# `RTCC` interrupt handler.
time-driver = ["dep:embassy-time-driver", "dep:embassy-time-queue-utils"]
# Interrupt-driven Imm-Ack for parent (router) images: the `FRC` RX-done
# interrupt acknowledges frames with a Frame Pending bit from a HAL
# source-match table and moves frames for this node out of the 1 KiB RX
# buffer into a 1 KiB queue for the stack (2 KiB total). Defines the `FRC`
# interrupt handler, so firmware builds need `rt` too (host tests do not).
# End-device images leave it off.
isr-ack = []
# Interrupt-driven USART0 host link (`usart::host`): receive and transmit
# rings serviced by the `USART0_RX` / `USART0_TX` handlers, for network
# co-processor images. Defines both handlers, so firmware builds need `rt`.
usart0-host = []

[dependencies]
cortex-m = "0.7"
embedded-hal = "1.0"
embedded-storage = "0.3"
embassy-time-driver = { version = "0.2", optional = true }
embassy-time-queue-utils = { version = "0.1", optional = true }
