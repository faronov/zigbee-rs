  # ── Deploy Book + Web Flasher to GitHub Pages ────────────────
  # Builds the mdBook documentation and bundles it with the
  # ESP web flasher and latest firmware binaries.
  deploy-site:
    name: Deploy Site
    needs: [check, test, clippy, fmt, build-esp32c6, build-esp32h2, build-bl702]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install mdBook
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: mdbook@0.5.4

      - name: Build book
        run: mdbook build docs/book

      - name: Download ESP32-C6 firmware
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: esp32c6-sensor-firmware
          path: docs/flasher/firmware

      - name: Download ESP32-H2 firmware
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: esp32h2-sensor-firmware
          path: docs/flasher/firmware

      - name: Generate firmware manifest
        run: |
          cat > docs/flasher/manifest.json << 'EOF'
          {
            "name": "Zigbee-RS Sensor Firmware",
            "version": "${{ github.sha }}",
            "builds": [
              {
                "chipFamily": "ESP32-C6",
                "parts": [{ "path": "./firmware/esp32c6-sensor.bin", "offset": 0 }]
              },
              {
                "chipFamily": "ESP32-H2",
                "parts": [{ "path": "./firmware/esp32h2-sensor.bin", "offset": 0 }]
              }
            ]
          }
          EOF

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r docs/book/book/* _site/
          cp -r docs/flasher _site/flasher

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
