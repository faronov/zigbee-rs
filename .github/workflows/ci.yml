            "$ELF" "${ELF}.app.bin"
          espflash save-image --skip-update-check --chip esp32h2 \
            --merge --skip-padding --flash-size 4mb \
            --partition-table "$CSV" --target-app-partition ota_0 \
            "$ELF" "${ELF}.bin"
          python3 products/esp32-zigbee-devkit/partitions/check-app-image-size.py \
            --chip esp32h2 --slot ota_0 --merged "${ELF}.bin" "${ELF}.app.bin"
          export ESP_OTA_TEST_IMAGE="$PWD/${ELF}.app.bin"
          export ESP_OTA_H2_IMAGE="$ESP_OTA_TEST_IMAGE"
          export ESP_OTA_PREFLIGHT_CORPUS="$RUNNER_TEMP/esp32h2-ota-corpus"
          python3 products/esp32-zigbee-devkit/partitions/test_esp_app_image.py \
            --write-corpus "$ESP_OTA_PREFLIGHT_CORPUS" --chip esp32h2
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          cargo test --locked --manifest-path products/esp32-zigbee-devkit/Cargo.toml \
            --target "$HOST_TARGET" --target-dir "$RUNNER_TEMP/esp32h2-ota-host" \
            --no-default-features --features esp32h2 -- --include-ignored
          ./tools/firmware-size-report.sh \
            esp32h2-sensor "${ELF}.app.bin" "${ELF}.size.json"
      - name: Upload ESP32-H2 firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: esp32h2-sensor-firmware
          path: |
            examples/esp32h2-sensor/target/riscv32imac-unknown-none-elf/release/esp32h2-sensor.bin
            examples/esp32h2-sensor/target/riscv32imac-unknown-none-elf/release/esp32h2-sensor.app.bin
            examples/esp32h2-sensor/target/riscv32imac-unknown-none-elf/release/esp32h2-sensor.size.json
          if-no-files-found: error

  build-esp-light-sleep:
    name: Build ${{ matrix.chip }} retained light sleep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: esp32c6
          - chip: esp32h2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.ESP_PHY_RUST_TOOLCHAIN }}
          targets: riscv32imac-unknown-none-elf
          components: rust-src, llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/${{ matrix.chip }}-sensor
          key: ${{ matrix.chip }}-light-sleep-${{ env.ESP_PHY_RUST_TOOLCHAIN }}-${{ hashFiles('vendor/**', 'examples/esp32*/Cargo.lock') }}
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: espflash@${{ env.ESPFLASH_VERSION }}
      - name: Link retained-sleep firmware
        working-directory: examples/${{ matrix.chip }}-sensor
        run: cargo build --release --locked --features light-sleep -Z build-std=core,alloc
      - name: Validate actual application and OTA corpus and report size
        env:
          CHIP: ${{ matrix.chip }}
        run: |
          ELF="examples/$CHIP-sensor/target/riscv32imac-unknown-none-elf/release/$CHIP-sensor"
          CSV=products/esp32-zigbee-devkit/partitions/esp32-4mb-ota.csv
          espflash save-image --skip-update-check --chip "$CHIP" \
            --partition-table "$CSV" --target-app-partition ota_0 "$ELF" "${ELF}.app.bin"
          espflash save-image --skip-update-check --chip "$CHIP" --merge --skip-padding \
            --flash-size 4mb --partition-table "$CSV" --target-app-partition ota_0 "$ELF" "${ELF}.bin"
          python3 products/esp32-zigbee-devkit/partitions/check-app-image-size.py \
            --chip "$CHIP" --slot ota_0 --merged "${ELF}.bin" "${ELF}.app.bin"
          export ESP_OTA_TEST_IMAGE="$PWD/${ELF}.app.bin"
          export ESP_OTA_PREFLIGHT_CORPUS="$RUNNER_TEMP/$CHIP-light-sleep-corpus"
          if [[ "$CHIP" == esp32c6 ]]; then
            export ESP_OTA_C6_IMAGE="$ESP_OTA_TEST_IMAGE"
          else
            export ESP_OTA_H2_IMAGE="$ESP_OTA_TEST_IMAGE"
          fi
          python3 products/esp32-zigbee-devkit/partitions/test_esp_app_image.py \
            --write-corpus "$ESP_OTA_PREFLIGHT_CORPUS" --chip "$CHIP"
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          cargo test --locked --manifest-path products/esp32-zigbee-devkit/Cargo.toml \
            --target "$HOST_TARGET" --target-dir "$RUNNER_TEMP/$CHIP-light-sleep-host" \
            --no-default-features --features "$CHIP,light-sleep" -- --include-ignored
          ./tools/firmware-size-report.sh "$CHIP-light-sleep" "${ELF}.app.bin" "${ELF}.size.json"

  build-bl702:
    name: Build BL702 sensor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: riscv32imc-unknown-none-elf
          components: rust-src, llvm-tools, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            bl702-hal
            boards/bl702-xt-zb1
            bootloaders/bl702-boot
            products/bl702-xt-zb1
            products/bl702-xt-zb1/layout
            products/bl702-xt-zb1/bootloader
            examples/bl702-sensor
          key: riscv32imc-bl702-${{ env.RUST_TOOLCHAIN }}-boot-image-${{ hashFiles('bl702-hal/Cargo.lock', 'boards/bl702-xt-zb1/Cargo.lock', 'bootloaders/bl702-boot/Cargo.lock', 'products/bl702-xt-zb1/Cargo.lock', 'products/bl702-xt-zb1/layout/Cargo.lock', 'products/bl702-xt-zb1/bootloader/Cargo.lock', 'examples/bl702-sensor/Cargo.lock', 'products/bl702-xt-zb1/link/**', 'products/bl702-xt-zb1/bootloader/memory.x') }}
      - name: Test and lint BL702 platform crates
        run: |
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          cargo test --locked --manifest-path bl702-hal/Cargo.toml --target "$HOST_TARGET"
          cargo test --locked --manifest-path boards/bl702-xt-zb1/Cargo.toml --target "$HOST_TARGET"
          cargo test --locked --manifest-path bootloaders/bl702-boot/Cargo.toml --target "$HOST_TARGET"
          cargo test --locked --manifest-path products/bl702-xt-zb1/layout/Cargo.toml --target "$HOST_TARGET"
          cargo test --locked --manifest-path products/bl702-xt-zb1/Cargo.toml --target "$HOST_TARGET"
          cargo clippy --locked --manifest-path bl702-hal/Cargo.toml --target "$HOST_TARGET" -- -D warnings
          cargo clippy --locked --manifest-path boards/bl702-xt-zb1/Cargo.toml --target "$HOST_TARGET" -- -D warnings
          cargo clippy --locked --manifest-path bootloaders/bl702-boot/Cargo.toml --target "$HOST_TARGET" --all-targets -- -D warnings
          cargo clippy --locked --manifest-path products/bl702-xt-zb1/layout/Cargo.toml --target "$HOST_TARGET" --all-targets -- -D warnings
          cargo clippy --locked --manifest-path products/bl702-xt-zb1/Cargo.toml --target "$HOST_TARGET" --all-targets -- -D warnings
          cargo clippy --locked --manifest-path bl702-hal/Cargo.toml --target riscv32imc-unknown-none-elf -- -D warnings
          cargo clippy --locked --manifest-path boards/bl702-xt-zb1/Cargo.toml --target riscv32imc-unknown-none-elf -- -D warnings
          cargo clippy --locked --manifest-path bootloaders/bl702-boot/Cargo.toml --target riscv32imc-unknown-none-elf -- -D warnings
          cargo clippy --locked --manifest-path products/bl702-xt-zb1/Cargo.toml --target riscv32imc-unknown-none-elf -- -D warnings
      - name: Clippy BL702 bootloader
        working-directory: products/bl702-xt-zb1/bootloader
        run: cargo clippy --release --locked -- -D warnings
      - name: Build BL702 sensor (release)
        working-directory: examples/bl702-sensor
        run: cargo build --release --locked
      - name: Clippy BL702 production composition
        working-directory: examples/bl702-sensor
        run: cargo clippy --release --locked --target riscv32imc-unknown-none-elf -- -D warnings
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.9
      - name: Install pinned Bouffalo image tool
        run: |
          # Every distribution in the tool's closure is pinned by version and
          # SHA-256. The two source-only packages are built with the
          # separately hash-pinned setuptools rather than an unpinned
          # isolated build environment.
          python3 -m pip install --disable-pip-version-check --require-hashes \
            --no-deps -r tools/bl702-image-tool/build-requirements.txt
          python3 -m pip install --disable-pip-version-check --require-hashes \
            --no-deps --no-build-isolation -r tools/bl702-image-tool/requirements.txt
          python3 -m pip check
      - name: Install imgtool
        run: |
          python3 -m venv "$RUNNER_TEMP/imgtool"
          "$RUNNER_TEMP/imgtool/bin/pip" install --quiet "imgtool==${IMGTOOL_VERSION}"
          echo "$RUNNER_TEMP/imgtool/bin" >> "$GITHUB_PATH"
      # The product's signing key is never available to CI. The loader and
      # the application are built with a key generated for this run only,
      # so CI output is test-signed and must not be installed on a board
      # whose loader trusts the release key.
      - name: Generate ephemeral OTA signing key
        run: |
          imgtool keygen -t ecdsa-p256 -k "$RUNNER_TEMP/ci-bl702-ota.pem"
          echo "BL702_OTA_KEY=$RUNNER_TEMP/ci-bl702-ota.pem" >> "$GITHUB_ENV"
      - name: Create firmware artifacts
        working-directory: examples/bl702-sensor
        run: ./build-image.sh
      - name: Check BL702 firmware purity
        run: |
          ELF=examples/bl702-sensor/target/riscv32imc-unknown-none-elf/release/bl702-sensor
          LOADER=products/bl702-xt-zb1/bootloader/target/riscv32imc-unknown-none-elf/release/bl702-xt-zb1-boot
          OTA_DIR=examples/bl702-sensor/target/riscv32imc-unknown-none-elf/release/ota
          RAW=${ELF}.bin
          OBJDUMP=$(find "$(rustc --print sysroot)" -name llvm-objdump -print -quit)
          NM=$(find "$(rustc --print sysroot)" -name llvm-nm -print -quit)
          RAW_BYTES=$(stat -c '%s' "$RAW")
          # products/bl702-xt-zb1/layout: APP_MAX_LEN, the primary slot less
          # the MCUboot header and the trailer sector.
          if (( RAW_BYTES > 0x75C00 )); then
            echo "BL702 application is ${RAW_BYTES} B; the primary slot holds 0x75C00 B" >&2
            exit 1
          fi
          ./tools/firmware-size-report.sh bl702-sensor "$RAW" ${ELF}.size.json
          # Signature, identity, version and slot fit of the OTA file.
          python3 tools/bl702_ota.py check "$OTA_DIR"/*.zigbee
          SYMS="$("$NM" --demangle "$ELF")"
          if grep -Eq 'aes::soft|SoftwareAes128' <<<"$SYMS"; then
            echo "BL702 production image still links the software AES core" >&2
            exit 1
          fi
          if ! grep -Eq 'HardwareAes128|bl702_hal::aes' <<<"$SYMS"; then
            echo "BL702 production image is missing the SEC_ENG AES backend" >&2
            exit 1
          fi
          if "$OBJDUMP" -d "$ELF" | grep -Eq '[[:space:]](amo[a-z.]*|lr\.[wd]|sc\.[wd])[[:space:]]'; then
            echo "BL702 image contains unsupported RV32A instructions" >&2
            exit 1
          fi
          if "$NM" "$ELF" | grep -Eq '(lmac154_|AON_Power_On_XTAL|GLB_Set_System_CLK|RF_SetZigbee)'; then
            echo "BL702 image contains a vendor radio symbol" >&2
            exit 1
          fi
          if "$NM" --demangle "$ELF" | grep -q 'core::slice::sort'; then
            echo "BL702 image contains generic slice sorting" >&2
            exit 1
          fi
          # The sensor must compile out the parent/router maintenance subgraph.
          PARENT_SYMS='parent_beacon_response|handle_parent_command|handle_child_rejoin_request|queue_pending_child_update|process_pending_routing|send_link_status'
          if "$NM" --demangle "$ELF" | grep -Eq "($PARENT_SYMS)"; then
            echo "BL702 sensor links parent/router maintenance symbols:" >&2
            "$NM" --demangle "$ELF" | grep -E "($PARENT_SYMS)" >&2
            exit 1
          fi
          START_RUST=$("$NM" "$ELF" | awk '$3 == "_start_rust" { print $1 }')
          if [[ -z "$START_RUST" ]] ||
             (( 16#$START_RUST < 0x2300E100 || 16#$START_RUST >= 0x23083D00 )); then
            echo "BL702 _start_rust is outside the primary slot: ${START_RUST:-missing}" >&2
            exit 1
          fi
          # The loader branches to the primary slot's vector table: the
          # application must start there, and the loader at the XIP base.
          APP_START=$("$NM" "$ELF" | awk '$3 == "_start" { print $1 }')
          if [[ "$APP_START" != "2300e100" ]]; then
            echo "BL702 application _start is ${APP_START:-missing}, not 0x2300E100" >&2
            exit 1
          fi
          LOADER_START=$("$NM" "$LOADER" | awk '$3 == "_start" { print $1 }')
          if [[ "$LOADER_START" != "23000000" ]]; then
            echo "BL702 loader _start is ${LOADER_START:-missing}, not 0x23000000" >&2
            exit 1
          fi
          if "$OBJDUMP" -d "$LOADER" | grep -Eq '[[:space:]](amo[a-z.]*|lr\.[wd]|sc\.[wd])[[:space:]]'; then
            echo "BL702 loader contains unsupported RV32A instructions" >&2
            exit 1
          fi
      - name: Upload BL702 sensor
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Test-signed with the ephemeral key: not for boards whose loader
          # trusts the release key.
          name: bl702-sensor-firmware
          path: |
            examples/bl702-sensor/target/riscv32imc-unknown-none-elf/release/bl702-sensor
            examples/bl702-sensor/target/riscv32imc-unknown-none-elf/release/bl702-sensor.bin
            examples/bl702-sensor/target/riscv32imc-unknown-none-elf/release/bl702-sensor.size.json
            examples/bl702-sensor/target/riscv32imc-unknown-none-elf/release/ota/
            products/bl702-xt-zb1/bootloader/target/riscv32imc-unknown-none-elf/release/bl702-xt-zb1-boot
          if-no-files-found: error


  # ── CC2340 (TI, ARM Cortex-M0+) ────────────────────────────
  build-cc2340:
    name: Build CC2340 sensor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: thumbv6m-none-eabi
          components: rust-src, llvm-tools, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/cc2340-sensor
          cache-targets: false
          key: thumbv6m-cc2340-${{ env.RUST_TOOLCHAIN }}-fallback-sdk-${{ env.CC2340_SDK_COMMIT }}-${{ hashFiles('examples/cc2340-sensor/Cargo.lock', 'examples/cc2340-sensor/memory.x') }}
      - name: Build CC2340R5 HAL boot profile and loader core
        # Bootloaders use the HAL without the Embassy runtime.
        run: |
          cargo build --release --locked --target thumbv6m-none-eabi \
            --manifest-path cc2340r5-hal/Cargo.toml --no-default-features
          cargo clippy --locked --target thumbv6m-none-eabi \
            --manifest-path cc2340r5-hal/Cargo.toml --no-default-features -- -D warnings
          cargo build --release --locked --target thumbv6m-none-eabi \
            --manifest-path bootloaders/cc2340r5-boot/Cargo.toml
          cargo clippy --locked --target thumbv6m-none-eabi \
            --manifest-path bootloaders/cc2340r5-boot/Cargo.toml -- -D warnings
      - name: Build CC2340 explicit fallback mode
        working-directory: examples/cc2340-sensor
        run: |
          env -u CC2340_SDK_DIR cargo build --release --locked --target-dir target/fallback
          ELF=target/fallback/thumbv6m-none-eabi/release/cc2340-sensor
          if ! grep -aFq 'radio firmware unavailable' "$ELF"; then
            echo "CC2340 fallback image is missing its unavailable-radio marker" >&2
            exit 1
          fi
          if grep -aFq 'TI SimpleLink Low Power F3 SDK cc23x0r5/rf_patches' "$ELF"; then
            echo "CC2340 fallback image unexpectedly contains the SDK radio marker" >&2
            exit 1
          fi
      - name: Check out pinned TI radio sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: TexasInstruments/simplelink-lowpower-f3-sdk
          ref: ${{ env.CC2340_SDK_COMMIT }}
          path: .ci/simplelink-lowpower-f3-sdk
          fetch-depth: 1
          sparse-checkout: |
            source/ti/devices/cc23x0r5
            source/ti/devices/radioconfig
      - name: Build CC2340 pinned-SDK mode
        working-directory: examples/cc2340-sensor
        env:
          CC2340_SDK_DIR: ${{ github.workspace }}/.ci/simplelink-lowpower-f3-sdk
        run: cargo build --release --locked --target-dir target/sdk
      - name: Check CC2340 SDK, layout, AES, and role gates
        run: |
          ELF=examples/cc2340-sensor/target/sdk/thumbv6m-none-eabi/release/cc2340-sensor
          NM=$(find "$(rustc --print sysroot)" -name llvm-nm -print -quit)
          if ! grep -aFq 'TI SimpleLink Low Power F3 SDK cc23x0r5/rf_patches' "$ELF"; then
            echo "CC2340 SDK image is missing the pinned radio-firmware marker" >&2
            exit 1
          fi
          LAYOUT="$("$NM" -n "$ELF")"
          if ! grep -q '^0007e000 A _security_partition_start$' <<<"$LAYOUT" ||
             ! grep -q '^00080000 A _security_partition_end$' <<<"$LAYOUT"; then
            echo "CC2340 linker symbols do not preserve 0x0007E000..0x00080000" >&2
            exit 1
          fi
          SYMS="$("$NM" --demangle "$ELF")"
          if ! grep -Eq 'SoftwareAes128|aes::soft' <<<"$SYMS"; then
            echo "CC2340 image is missing its currently supported software AES backend" >&2
            exit 1
          fi
          PARENT_SYMS='parent_beacon_response|handle_parent_command|handle_child_rejoin_request|queue_pending_child_update|process_pending_routing|send_link_status'
          if grep -Eq "($PARENT_SYMS)" <<<"$SYMS"; then
            echo "CC2340 sensor links parent/router maintenance symbols:" >&2
            grep -E "($PARENT_SYMS)" <<<"$SYMS" >&2
            exit 1
          fi
      - name: Create CC2340 firmware artifacts
        run: |
          ELF=examples/cc2340-sensor/target/sdk/thumbv6m-none-eabi/release/cc2340-sensor
          OBJCOPY=$(find "$(rustc --print sysroot)" -name llvm-objcopy -print -quit)
          "$OBJCOPY" -O binary "$ELF" "${ELF}.bin"
          "$OBJCOPY" -O ihex   "$ELF" "${ELF}.hex"
          PHYSICAL_BYTES=$(stat -c '%s' "${ELF}.bin")
          if (( PHYSICAL_BYTES > 0x7E000 )); then
            echo "CC2340 application is ${PHYSICAL_BYTES} B; protected security storage starts at 0x7E000" >&2
            exit 1
          fi
          ./tools/firmware-size-report.sh \
            cc2340-sensor "${ELF}.bin" "${ELF}.size.json"
      - name: Upload CC2340 firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cc2340-sensor-firmware
          path: |
            examples/cc2340-sensor/target/sdk/thumbv6m-none-eabi/release/cc2340-sensor.bin
            examples/cc2340-sensor/target/sdk/thumbv6m-none-eabi/release/cc2340-sensor.hex
            examples/cc2340-sensor/target/sdk/thumbv6m-none-eabi/release/cc2340-sensor.size.json
          if-no-files-found: error

  # ── Telink TLSR8258 (tc32) ───────────────────────────────────
  # Built by .github/workflows/build-tc32.yml using the public
  # modern-tc32/rust toolchain. Stock nightly cannot compile this target.

  build-phy6222:
    name: Build PHY6222/PHY6252 sensor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # 2026-08-06 started emitting unresolved __aeabi_u{read,write}{4,8}
      # helpers for packed Cortex-M0 accesses.
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.ESP_PHY_RUST_TOOLCHAIN }}
          targets: thumbv6m-none-eabi
          components: rust-src, llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/phy6222-sensor
          cache-targets: false
          key: thumbv6m-phy6222-${{ env.ESP_PHY_RUST_TOOLCHAIN }}-xip-187104-${{ hashFiles('examples/phy6222-sensor/Cargo.lock', 'products/phy62x2-evk/link/**') }}
      - name: Build PHY6222 sensor (release)
        working-directory: examples/phy6222-sensor
        run: cargo build --release --locked
      - name: Check PHY6222 layout, AES backend, and role split
        run: |
          ELF=examples/phy6222-sensor/target/thumbv6m-none-eabi/release/phy6222-sensor
          NM=$(find "$(rustc --print sysroot)" -name llvm-nm -print -quit)
          sh examples/phy6222-sensor/check-layout.sh "$ELF"
          SYMS="$("$NM" --demangle "$ELF")"
          if ! grep -Eq 'SoftwareAes128|aes::soft' <<<"$SYMS"; then
            echo "PHY6222 image is missing its currently supported software AES backend" >&2
            exit 1
          fi
          PARENT_SYMS='parent_beacon_response|handle_parent_command|handle_child_rejoin_request|queue_pending_child_update|process_pending_routing|send_link_status'
          if grep -Eq "($PARENT_SYMS)" <<<"$SYMS"; then
            echo "PHY6222 sensor links parent/router maintenance symbols:" >&2
            grep -E "($PARENT_SYMS)" <<<"$SYMS" >&2
            exit 1
          fi
      - name: Create firmware artifacts
        run: |
          ELF=examples/phy6222-sensor/target/thumbv6m-none-eabi/release/phy6222-sensor
          OBJCOPY=$(find "$(rustc --print sysroot)" -name llvm-objcopy -print -quit)
          "$OBJCOPY" -O ihex "$ELF" "${ELF}.hex"
          cargo run --quiet --locked -p phy62x2-image -- "${ELF}.hex" "${ELF}.phy6.bin"
          # The PHY6 image is written at flash 0x10000 and must end below the
          # 0x3E000 security partition (PHY6252 layout, shared by PHY6222).
          SIZE=$(wc -c < "${ELF}.phy6.bin")
          if [ $((0x10000 + SIZE)) -gt $((0x3E000)) ]; then
            echo "PHY6 image (${SIZE} B at 0x10000) overlaps the 0x3E000 security partition" >&2
            exit 1
          fi
      - name: Upload PHY6222 firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phy6222-sensor-firmware
          path: |
            examples/phy6222-sensor/target/thumbv6m-none-eabi/release/phy6222-sensor
            examples/phy6222-sensor/target/thumbv6m-none-eabi/release/phy6222-sensor.hex
            examples/phy6222-sensor/target/thumbv6m-none-eabi/release/phy6222-sensor.phy6.bin
          if-no-files-found: error
      # PHY6252 shares the 187,104 B XIP slot (the PHY6 image ends below its
      # 0x3E000 security partition) and the same mandatory layout gate.
      - name: Build PHY6252 sensor and check its physical XIP limit
        working-directory: examples/phy6222-sensor
        run: |
          cargo build --release --locked --no-default-features --features phy6252 \
            --target-dir target/phy6252
          sh check-layout.sh target/phy6252/thumbv6m-none-eabi/release/phy6222-sensor

  # ── Ai-Thinker PB-03F-Kit (PHY6252, ROM-boot image) ──────────
  build-pb03f:
    name: Build PB-03F-Kit (PHY6252)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.ESP_PHY_RUST_TOOLCHAIN }}
          targets: thumbv6m-none-eabi
          components: rust-src, llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/pb03f-kit
          cache-targets: false
          key: thumbv6m-pb03f-${{ env.ESP_PHY_RUST_TOOLCHAIN }}-${{ hashFiles('examples/pb03f-kit/Cargo.lock', 'products/pb03f-kit/link/**') }}
      - name: Build PB-03F-Kit binaries (release)
        working-directory: examples/pb03f-kit
        run: cargo build --release --locked
      # products/pb03f-kit/link/memory.x: XIP slot 0x10100..0x40fff
      # (200,448 B). The radio lab has no flash-write path and is not
      # subject to the SRAM flash-operation checks.
      - name: Check PB-03F-Kit layout
        run: |
          for BIN in pb03f-zigbee pb03f-lab; do
            XIP_SLOT_BYTES=200448 sh examples/phy6222-sensor/check-layout.sh \
              "examples/pb03f-kit/target/thumbv6m-none-eabi/release/$BIN"
          done
      - name: Create ROM-boot images
        run: |
          OBJCOPY=$(find "$(rustc --print sysroot)" -name llvm-objcopy -print -quit)
          for BIN in pb03f-zigbee pb03f-lab pb03f-radio-lab; do
            ELF=examples/pb03f-kit/target/thumbv6m-none-eabi/release/$BIN
            "$OBJCOPY" -O ihex "$ELF" "${ELF}.hex"
            cargo run --quiet --locked -p phy62x2-image -- --rom-boot \
              "${ELF}.hex" "${ELF}.table.bin" "${ELF}.app.bin"
          done
      - name: Upload PB-03F-Kit firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pb03f-kit-firmware
          path: |
            examples/pb03f-kit/target/thumbv6m-none-eabi/release/pb03f-*.hex
            examples/pb03f-kit/target/thumbv6m-none-eabi/release/pb03f-*.table.bin
            examples/pb03f-kit/target/thumbv6m-none-eabi/release/pb03f-*.app.bin
          if-no-files-found: error

  # ── EFR32MG1P (Silicon Labs, ARM Cortex-M4F) ─────────────────
  build-efr32mg1:
    name: Build EFR32MG1 sensor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: thumbv7em-none-eabi
          components: rust-src, llvm-tools, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/efr32mg1-sensor
          key: thumbv7em-efr32mg1-${{ env.RUST_TOOLCHAIN }}-tradfri-sed-${{ hashFiles('examples/efr32mg1-sensor/Cargo.lock', 'products/efr32mg1-tradfri/link/**', 'efr32mg1-hal/link/**') }}
      - name: Build EFR32MG1 sensor (release)
        working-directory: examples/efr32mg1-sensor
        run: cargo build --release --locked
      - name: Clippy EFR32MG1 production composition
        working-directory: examples/efr32mg1-sensor
        run: cargo clippy --release --locked --target thumbv7em-none-eabi -- -D warnings
      - name: Create firmware artifacts
        run: |
          ELF=examples/efr32mg1-sensor/target/thumbv7em-none-eabi/release/efr32mg1-sensor
          OBJCOPY=$(find "$(rustc --print sysroot)" -name llvm-objcopy -print -quit)
          NM=$(find "$(rustc --print sysroot)" -name llvm-nm -print -quit)
          "$OBJCOPY" -O binary "$ELF" "${ELF}.bin"
          "$OBJCOPY" -O ihex   "$ELF" "${ELF}.hex"
          ./tools/firmware-size-report.sh efr32mg1-sensor ${ELF}.bin ${ELF}.size.json
          python3 examples/efr32mg1-sensor/tools/verify-layout.py "$ELF"
          NM="$NM" examples/efr32mg1-sensor/check-layout.sh "$ELF"
          SYMS="$("$NM" --demangle "$ELF")"
          if grep -q 'core::slice::sort' <<<"$SYMS"; then
            echo "EFR32MG1 image contains generic slice sorting" >&2
            exit 1
          fi
          if grep -Eq 'aes::soft|SoftwareAes128' <<<"$SYMS"; then
            echo "EFR32MG1 production image still links the software AES core" >&2
            exit 1
          fi
          if ! grep -Eq 'HardwareAes128|efr32mg1_hal::crypto' <<<"$SYMS"; then
            echo "EFR32MG1 production image is missing the CRYPTO AES backend" >&2
            exit 1
          fi
          # The sensor must compile out the parent/router maintenance subgraph.
          PARENT_SYMS='parent_beacon_response|handle_parent_command|handle_child_rejoin_request|queue_pending_child_update|process_pending_routing|send_link_status'
          if "$NM" --demangle "$ELF" | grep -Eq "($PARENT_SYMS)"; then
            echo "EFR32MG1 sensor links parent/router maintenance symbols:" >&2
            "$NM" --demangle "$ELF" | grep -E "($PARENT_SYMS)" >&2
            exit 1
          fi
      - name: Upload EFR32MG1 firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: efr32mg1-sensor-firmware
          path: |
            examples/efr32mg1-sensor/target/thumbv7em-none-eabi/release/efr32mg1-sensor.bin
            examples/efr32mg1-sensor/target/thumbv7em-none-eabi/release/efr32mg1-sensor.hex
            examples/efr32mg1-sensor/target/thumbv7em-none-eabi/release/efr32mg1-sensor.size.json
          if-no-files-found: error

  build-efr32mg21:
    name: Build EFR32MG21 sensor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: thumbv8m.main-none-eabihf
          components: rust-src, llvm-tools, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/efr32mg21-sensor
          key: thumbv8m-efr32mg21-${{ env.RUST_TOOLCHAIN }}-sed-${{ hashFiles('examples/efr32mg21-sensor/Cargo.lock', 'products/efr32mg21-sensor/link/**', 'efr32mg21-hal/link/**') }}
      - name: Build EFR32MG21 sensor (release)
        working-directory: examples/efr32mg21-sensor
        run: cargo build --release --locked
      - name: Clippy EFR32MG21 production composition
        working-directory: examples/efr32mg21-sensor
        run: cargo clippy --release --locked --target thumbv8m.main-none-eabihf -- -D warnings
      - name: Create firmware artifacts
        run: |
          ELF=examples/efr32mg21-sensor/target/thumbv8m.main-none-eabihf/release/efr32mg21-sensor
          OBJCOPY=$(find "$(rustc --print sysroot)" -name llvm-objcopy -print -quit)
          NM=$(find "$(rustc --print sysroot)" -name llvm-nm -print -quit)
          "$OBJCOPY" -O binary "$ELF" "${ELF}.bin"
          "$OBJCOPY" -O ihex   "$ELF" "${ELF}.hex"
          ./tools/firmware-size-report.sh efr32mg21-sensor ${ELF}.bin ${ELF}.size.json
          python3 examples/efr32mg21-sensor/tools/verify-layout.py "$ELF"
          SYMS="$("$NM" --demangle "$ELF")"
          if ! grep -Eq 'SoftwareAes128|aes::soft' <<<"$SYMS"; then
            echo "EFR32MG21 image is missing its currently supported software AES backend" >&2
            exit 1
          fi
          # The sensor must compile out the parent/router maintenance subgraph.
          PARENT_SYMS='parent_beacon_response|handle_parent_command|handle_child_rejoin_request|queue_pending_child_update|process_pending_routing|send_link_status'
          if grep -Eq "($PARENT_SYMS)" <<<"$SYMS"; then
            echo "EFR32MG21 sensor links parent/router maintenance symbols:" >&2
            grep -E "($PARENT_SYMS)" <<<"$SYMS" >&2
            exit 1
          fi
      - name: Upload EFR32MG21 firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: efr32mg21-sensor-firmware
          path: |
            examples/efr32mg21-sensor/target/thumbv8m.main-none-eabihf/release/efr32mg21-sensor.bin
            examples/efr32mg21-sensor/target/thumbv8m.main-none-eabihf/release/efr32mg21-sensor.hex
            examples/efr32mg21-sensor/target/thumbv8m.main-none-eabihf/release/efr32mg21-sensor.size.json
          if-no-files-found: error

  # ── Deploy Book + Web Flasher to GitHub Pages ────────────────
  # Documentation may publish after core checks pass. Firmware is included
  # only when every original firmware dependency passes; otherwise install is disabled.
  deploy-site:
    name: Deploy Site
    needs: [check, test, clippy, fmt, doc, build-esp32c6, build-esp32h2, build-bl702]
    runs-on: ubuntu-latest
    if: >-
      ${{
        !cancelled() && github.event_name == 'push' &&
        (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') &&
        needs.check.result == 'success' && needs.test.result == 'success' &&
        needs.clippy.result == 'success' && needs.fmt.result == 'success' &&
        needs.doc.result == 'success'
      }}
    permissions:
      contents: read
      pages: write
      id-token: write
    # Only one Pages deploy at a time; never cancel one already running.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install mdBook
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: mdbook@0.5.4

      - name: Build book
        run: mdbook build docs/book

      - name: Download ESP32-C6 firmware
        if: needs.build-esp32c6.result == 'success' && needs.build-esp32h2.result == 'success' && needs.build-bl702.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: esp32c6-sensor-firmware
          path: ${{ runner.temp }}/pages-firmware

      - name: Download ESP32-H2 firmware
        if: needs.build-esp32c6.result == 'success' && needs.build-esp32h2.result == 'success' && needs.build-bl702.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: esp32h2-sensor-firmware
          path: ${{ runner.temp }}/pages-firmware

      - name: Assemble site
        env:
          C6_RESULT: ${{ needs.build-esp32c6.result }}
          H2_RESULT: ${{ needs.build-esp32h2.result }}
          BL702_RESULT: ${{ needs.build-bl702.result }}
        run: |
          python3 tools/prepare-pages.py \
            --book docs/book/book --flasher docs/flasher/index.html \
            --firmware "$RUNNER_TEMP/pages-firmware" --output _site \
            --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --esp32c6-result "$C6_RESULT" --esp32h2-result "$H2_RESULT" \
            --bl702-result "$BL702_RESULT"

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
