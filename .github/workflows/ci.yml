name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Allow deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo check -p zigbee-mac --features mock

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # The router relay tests are gated on `zigbee-runtime/router`, which is
      # off in the workspace build so sensors do not link the routing tables.
      - run: cargo test -p zigbee-runtime --features router
      - run: cargo test -p zigbee-zdo --features router
      - run: cargo test -p zigbee-runtime --no-default-features
      - run: cargo test -p zigbee-zcl --no-default-features
      - run: cargo test -p zigbee-zcl --no-default-features --features float32
      - run: cargo test -p zigbee-zcl --no-default-features --features float64

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo clippy -p zigbee-runtime --features router --all-targets -- -D warnings
      - run: cargo clippy -p zigbee-zdo --features router --all-targets -- -D warnings
      - run: cargo clippy -p zigbee-runtime --no-default-features --all-targets -- -D warnings
      - run: cargo clippy -p zigbee-zcl --no-default-features --all-targets -- -D warnings
      - run: cargo clippy -p zigbee-zcl --no-default-features --features float32 --all-targets -- -D warnings
      - run: cargo clippy -p zigbee-zcl --no-default-features --features float64 --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path bl702-hal/Cargo.toml -- --check
          cargo fmt --manifest-path boards/bl702-xt-zb1/Cargo.toml -- --check
          cargo fmt --manifest-path products/bl702-xt-zb1/Cargo.toml -- --check
          cargo fmt --manifest-path examples/bl702-sensor/Cargo.toml -- --check

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  # ── Cross-compile hardware examples ──────────────────────────
  # These are standalone crates (not workspace members) targeting
  # embedded platforms. We build them to catch regressions in the
  # platform-specific MAC backends.

  build-nrf52840:
    name: Build nRF52840 sensor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/nrf52840-sensor
      - name: Build nRF52840 sensor (release)
        working-directory: examples/nrf52840-sensor
        run: cargo build --release
      - name: Create firmware artifacts
        run: |
          ELF=examples/nrf52840-sensor/target/thumbv7em-none-eabihf/release/nrf52840-sensor
          OBJCOPY=$(find $(rustc --print sysroot) -name llvm-objcopy | head -1)
          NM=$(find $(rustc --print sysroot) -name llvm-nm | head -1)
          $OBJCOPY -O binary $ELF ${ELF}.bin
          $OBJCOPY -O ihex   $ELF ${ELF}.hex
          ./tools/firmware-size-report.sh nrf52840-sensor ${ELF}.bin 225280 ${ELF}.size.json
          if "$NM" --demangle "$ELF" | grep -q 'core::slice::sort'; then
            echo "nRF52840 image contains generic slice sorting" >&2
            exit 1
          fi
          # A non-router sensor must compile out the parent/router maintenance
          # subgraph (permit-join, routing, MAC parent-command servicing, child
          # rejoin/Update-Device and Parent Announce). Representative symbols
          # verified present in the router image and absent from the sensor.
          PARENT_SYMS='parent_beacon_response|handle_parent_command|handle_child_rejoin_request|queue_pending_child_update|process_pending_routing|send_link_status'
          if "$NM" --demangle "$ELF" | grep -Eq "($PARENT_SYMS)"; then
            echo "nRF52840 sensor links parent/router maintenance symbols:" >&2
            "$NM" --demangle "$ELF" | grep -E "($PARENT_SYMS)" >&2
            exit 1
          fi
          # Role-state split: the R22 End Device Timeout *client* lifecycle
          # belongs to the end-device role, so its `#[inline(never)]` helpers
          # must be retained in the sensor image (and are compiled out of the
          # relay/router — verified in the router job below).
          ED_CLIENT_SYMS='resume_end_device_timeout|service_end_device_timeout|apply_end_device_timeout_change|send_ed_timeout_request_tracked'
          for sym in resume_end_device_timeout service_end_device_timeout apply_end_device_timeout_change send_ed_timeout_request_tracked; do
            if ! "$NM" --demangle "$ELF" | grep -q "$sym"; then
              echo "nRF52840 sensor is missing End Device Timeout CLIENT symbol: $sym" >&2
              exit 1
            fi
          done
      - name: Upload nRF52840 firmware
        uses: actions/upload-artifact@v4
        with:
          name: nrf52840-sensor-firmware
          path: |
            examples/nrf52840-sensor/target/thumbv7em-none-eabihf/release/nrf52840-sensor.bin
            examples/nrf52840-sensor/target/thumbv7em-none-eabihf/release/nrf52840-sensor.hex
            examples/nrf52840-sensor/target/thumbv7em-none-eabihf/release/nrf52840-sensor.size.json

  build-nrf52840-router:
    name: Build nRF52840 router
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/nrf52840-router
      - name: Build nRF52840 router (release)
        working-directory: examples/nrf52840-router
        run: cargo build --release
      - name: Create firmware artifacts
        run: |
          ELF=examples/nrf52840-router/target/thumbv7em-none-eabihf/release/nrf52840-router
          OBJCOPY=$(find $(rustc --print sysroot) -name llvm-objcopy | head -1)
          NM=$(find $(rustc --print sysroot) -name llvm-nm | head -1)
          $OBJCOPY -O binary $ELF ${ELF}.bin
          $OBJCOPY -O ihex   $ELF ${ELF}.hex
          # Role-state split: the nRF backend builds the forwarding-only
          # `RelayRouter` role via `build_relay()`. A relay routes but is not an
          # end device, so it must carry none of the R22 End Device Timeout
          # *client* lifecycle — those `#[inline(never)]` helpers must be
          # compiled out entirely (they are retained in the sensor image).
          ED_CLIENT_SYMS='resume_end_device_timeout|service_end_device_timeout|apply_end_device_timeout_change|send_ed_timeout_request_tracked'
          if "$NM" --demangle "$ELF" | grep -Eq "($ED_CLIENT_SYMS)"; then
            echo "nRF52840 relay links End Device Timeout CLIENT lifecycle symbols:" >&2
            "$NM" --demangle "$ELF" | grep -E "($ED_CLIENT_SYMS)" >&2
            exit 1
          fi
      - name: Upload nRF52840 router firmware
        uses: actions/upload-artifact@v4
        with:
          name: nrf52840-router-firmware
          path: |
            examples/nrf52840-router/target/thumbv7em-none-eabihf/release/nrf52840-router.bin
            examples/nrf52840-router/target/thumbv7em-none-eabihf/release/nrf52840-router.hex

  build-nrf52833:
    name: Build nRF52833 sensor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/nrf52833-sensor
      - name: Build nRF52833 sensor (release)
        working-directory: examples/nrf52833-sensor
        run: cargo build --release
      - name: Create firmware artifacts
        run: |
          ELF=examples/nrf52833-sensor/target/thumbv7em-none-eabihf/release/nrf52833-sensor
          OBJCOPY=$(find $(rustc --print sysroot) -name llvm-objcopy | head -1)
          $OBJCOPY -O binary $ELF ${ELF}.bin
          $OBJCOPY -O ihex   $ELF ${ELF}.hex
      - name: Upload nRF52833 firmware
        uses: actions/upload-artifact@v4
        with:
          name: nrf52833-sensor-firmware
          path: |
            examples/nrf52833-sensor/target/thumbv7em-none-eabihf/release/nrf52833-sensor.bin
            examples/nrf52833-sensor/target/thumbv7em-none-eabihf/release/nrf52833-sensor.hex

  build-nrf52840-uf2:
    name: Build nRF52840 sensor (UF2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/nrf52840-sensor-uf2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install UF2 converter
        run: pip install --quiet intelhex
      - name: Build nRF52840 UF2 sensor (release)
        working-directory: examples/nrf52840-sensor-uf2
        run: cargo build --release
      - name: Create firmware artifacts (.bin, .hex, .uf2)
        run: |
          ELF=examples/nrf52840-sensor-uf2/target/thumbv7em-none-eabihf/release/nrf52840-sensor-uf2
          OBJCOPY=$(find $(rustc --print sysroot) -name llvm-objcopy | head -1)
          $OBJCOPY -O binary $ELF ${ELF}.bin
          $OBJCOPY -O ihex   $ELF ${ELF}.hex

          echo "=== Firmware sizes ==="
          ls -la ${ELF}.bin ${ELF}.hex

          # Download uf2conv.py from Microsoft's UF2 repo
          curl -sL https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py -o uf2conv.py
          curl -sL https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2families.json -o uf2families.json
          # Convert .hex → .uf2 (hex already contains base address info)
          python uf2conv.py -c -f 0xADA52840 ${ELF}.hex -o ${ELF}.uf2
      - name: Upload nRF52840 UF2 firmware
        uses: actions/upload-artifact@v4
        with:
          name: nrf52840-sensor-uf2-firmware
          path: |
            examples/nrf52840-sensor-uf2/target/thumbv7em-none-eabihf/release/nrf52840-sensor-uf2.bin
            examples/nrf52840-sensor-uf2/target/thumbv7em-none-eabihf/release/nrf52840-sensor-uf2.hex
            examples/nrf52840-sensor-uf2/target/thumbv7em-none-eabihf/release/nrf52840-sensor-uf2.uf2

  build-esp32c6:
    name: Build ESP32-C6 sensor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: riscv32imac-unknown-none-elf
          components: rust-src, llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/esp32c6-sensor
      - name: Build ESP32-C6 sensor (release)
        working-directory: examples/esp32c6-sensor
        run: cargo build --release -Z build-std=core,alloc
      - name: Create firmware artifacts
        run: |
          ELF=examples/esp32c6-sensor/target/riscv32imac-unknown-none-elf/release/esp32c6-sensor
          OBJCOPY=$(find $(rustc --print sysroot) -name llvm-objcopy | head -1)
          $OBJCOPY -O binary $ELF ${ELF}.bin
      - name: Upload ESP32-C6 firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-sensor-firmware
          path: |
            examples/esp32c6-sensor/target/riscv32imac-unknown-none-elf/release/esp32c6-sensor.bin

  build-esp32h2:
    name: Build ESP32-H2 sensor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: riscv32imac-unknown-none-elf
          components: rust-src, llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/esp32h2-sensor
      - name: Build ESP32-H2 sensor (release)
        working-directory: examples/esp32h2-sensor
        run: cargo build --release -Z build-std=core,alloc
      - name: Create firmware artifacts
        run: |
          ELF=examples/esp32h2-sensor/target/riscv32imac-unknown-none-elf/release/esp32h2-sensor
          OBJCOPY=$(find $(rustc --print sysroot) -name llvm-objcopy | head -1)
          $OBJCOPY -O binary $ELF ${ELF}.bin
      - name: Upload ESP32-H2 firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32h2-sensor-firmware
          path: |
            examples/esp32h2-sensor/target/riscv32imac-unknown-none-elf/release/esp32h2-sensor.bin

  build-bl702:
    name: Build BL702 sensor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: riscv32imc-unknown-none-elf
          components: rust-src, llvm-tools, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            bl702-hal
            boards/bl702-xt-zb1
            products/bl702-xt-zb1
            examples/bl702-sensor
      - name: Test and lint BL702 platform crates
        run: |
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          cargo test --manifest-path bl702-hal/Cargo.toml --target "$HOST_TARGET"
          cargo test --manifest-path boards/bl702-xt-zb1/Cargo.toml --target "$HOST_TARGET"
          cargo test --manifest-path products/bl702-xt-zb1/Cargo.toml --target "$HOST_TARGET"
          cargo clippy --manifest-path bl702-hal/Cargo.toml --target "$HOST_TARGET" -- -D warnings
          cargo clippy --manifest-path boards/bl702-xt-zb1/Cargo.toml --target "$HOST_TARGET" -- -D warnings
          cargo clippy --manifest-path products/bl702-xt-zb1/Cargo.toml --target "$HOST_TARGET" -- -D warnings
          cargo clippy --manifest-path bl702-hal/Cargo.toml --target riscv32imc-unknown-none-elf -- -D warnings
          cargo clippy --manifest-path boards/bl702-xt-zb1/Cargo.toml --target riscv32imc-unknown-none-elf -- -D warnings
          cargo clippy --manifest-path products/bl702-xt-zb1/Cargo.toml --target riscv32imc-unknown-none-elf -- -D warnings
      - name: Build BL702 sensor (release)
        working-directory: examples/bl702-sensor
        run: cargo build --release
      - name: Install Bouffalo image tool
        run: python3 -m pip install --disable-pip-version-check bflb-mcu-tool==1.10.0
      - name: Create firmware artifacts
        working-directory: examples/bl702-sensor
        run: ./build-image.sh
      - name: Check BL702 firmware purity
        run: |
          ELF=examples/bl702-sensor/target/riscv32imc-unknown-none-elf/release/bl702-sensor
          RAW=${ELF}.bin
          OBJDUMP=$(find "$(rustc --print sysroot)" -name llvm-objdump -print -quit)
          NM=$(find "$(rustc --print sysroot)" -name llvm-nm -print -quit)
          ./tools/firmware-size-report.sh bl702-sensor "$RAW" 196608 ${ELF}.size.json
          if "$OBJDUMP" -d "$ELF" | grep -Eq '[[:space:]](amo[a-z.]*|lr\.[wd]|sc\.[wd])[[:space:]]'; then
            echo "BL702 image contains unsupported RV32A instructions" >&2
            exit 1
          fi
          if "$NM" "$ELF" | grep -Eq '(lmac154_|AON_Power_On_XTAL|GLB_Set_System_CLK|RF_SetZigbee)'; then
            echo "BL702 image contains a vendor radio symbol" >&2
            exit 1
          fi
          if "$NM" --demangle "$ELF" | grep -q 'core::slice::sort'; then
            echo "BL702 image contains generic slice sorting" >&2
            exit 1
          fi
          # The sensor must compile out the parent/router maintenance subgraph.
          PARENT_SYMS='parent_beacon_response|handle_parent_command|handle_child_rejoin_request|queue_pending_child_update|process_pending_routing|send_link_status'
          if "$NM" --demangle "$ELF" | grep -Eq "($PARENT_SYMS)"; then
            echo "BL702 sensor links parent/router maintenance symbols:" >&2
            "$NM" --demangle "$ELF" | grep -E "($PARENT_SYMS)" >&2
            exit 1
          fi
          START_RUST=$("$NM" "$ELF" | awk '$3 == "_start_rust" { print $1 }')
          if [[ -z "$START_RUST" ]] ||
             (( 16#$START_RUST < 0x23000000 || 16#$START_RUST >= 0x23080000 )); then
            echo "BL702 _start_rust is outside XIP flash: ${START_RUST:-missing}" >&2
            exit 1
          fi
      - name: Upload BL702 sensor
        uses: actions/upload-artifact@v4
        with:
          name: bl702-sensor-firmware
          path: |
            examples/bl702-sensor/target/riscv32imc-unknown-none-elf/release/bl702-sensor
            examples/bl702-sensor/target/riscv32imc-unknown-none-elf/release/bl702-sensor.bin
            examples/bl702-sensor/target/riscv32imc-unknown-none-elf/release/bl702-sensor.flash.bin
            examples/bl702-sensor/target/riscv32imc-unknown-none-elf/release/bl702-sensor.size.json

  # ── CC2340 (TI, ARM Cortex-M0+) ────────────────────────────
  build-cc2340:
    name: Build CC2340 sensor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv6m-none-eabi
          components: rust-src, llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/cc2340-sensor
      - name: Checkout pinned TI radio sources
        run: |
          SDK_DIR="$RUNNER_TEMP/simplelink-lowpower-f3-sdk"
          git init "$SDK_DIR"
          git -C "$SDK_DIR" remote add origin https://github.com/TexasInstruments/simplelink-lowpower-f3-sdk.git
          git -C "$SDK_DIR" sparse-checkout init --cone
          git -C "$SDK_DIR" sparse-checkout set source/ti/devices/cc23x0r5 source/ti/devices/radioconfig
          git -C "$SDK_DIR" fetch --depth=1 --filter=blob:none origin 68ca021502383f367d0bf2a5517fdd0dcb0ef909
          git -C "$SDK_DIR" checkout --detach FETCH_HEAD
      - name: Build CC2340 sensor (release)
        working-directory: examples/cc2340-sensor
        env:
          CC2340_SDK_DIR: ${{ runner.temp }}/simplelink-lowpower-f3-sdk
        run: cargo build --release
      - name: Create firmware artifacts
        run: |
          ELF=examples/cc2340-sensor/target/thumbv6m-none-eabi/release/cc2340-sensor
          OBJCOPY=$(find $(rustc --print sysroot) -name llvm-objcopy | head -1)
          $OBJCOPY -O binary $ELF ${ELF}.bin
          $OBJCOPY -O ihex   $ELF ${ELF}.hex
      - name: Upload CC2340 firmware
        uses: actions/upload-artifact@v4
        with:
          name: cc2340-sensor-firmware
          path: |
            examples/cc2340-sensor/target/thumbv6m-none-eabi/release/cc2340-sensor.bin
            examples/cc2340-sensor/target/thumbv6m-none-eabi/release/cc2340-sensor.hex

  # ── Telink TLSR8258 (tc32) ───────────────────────────────────
  # Built by .github/workflows/build-tc32.yml using the public
  # modern-tc32/rust toolchain. Stock nightly cannot compile this target.

  build-phy6222:
    name: Build PHY6222 sensor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv6m-none-eabi
          components: rust-src, llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/phy6222-sensor
      - name: Build PHY6222 sensor (release)
        working-directory: examples/phy6222-sensor
        run: cargo build --release
      - name: Create firmware artifacts
        run: |
          ELF=examples/phy6222-sensor/target/thumbv6m-none-eabi/release/phy6222-sensor
          OBJCOPY=$(find $(rustc --print sysroot) -name llvm-objcopy | head -1)
          $OBJCOPY -O ihex   $ELF ${ELF}.hex
          sh examples/phy6222-sensor/check-layout.sh $ELF
          cargo run --quiet -p phy62x2-image -- ${ELF}.hex ${ELF}.phy6.bin
      - name: Upload PHY6222 firmware
        uses: actions/upload-artifact@v4
        with:
          name: phy6222-sensor-firmware
          path: |
            examples/phy6222-sensor/target/thumbv6m-none-eabi/release/phy6222-sensor
            examples/phy6222-sensor/target/thumbv6m-none-eabi/release/phy6222-sensor.hex
            examples/phy6222-sensor/target/thumbv6m-none-eabi/release/phy6222-sensor.phy6.bin

  # ── EFR32MG1P (Silicon Labs, ARM Cortex-M4F) ─────────────────
  build-efr32mg1:
    name: Build EFR32MG1 sensor
    runs-on: ubuntu-latest
    continue-on-error: true  # needs GSDK + arm-none-eabi-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv7em-none-eabi
          components: rust-src, llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/efr32mg1-sensor
      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi
      - name: Build EFR32MG1 sensor (release)
        working-directory: examples/efr32mg1-sensor
        run: cargo build --release
      - name: Create firmware artifacts
        run: |
          ELF=examples/efr32mg1-sensor/target/thumbv7em-none-eabi/release/efr32mg1-sensor
          OBJCOPY=$(find $(rustc --print sysroot) -name llvm-objcopy | head -1)
          NM=$(find $(rustc --print sysroot) -name llvm-nm | head -1)
          $OBJCOPY -O binary $ELF ${ELF}.bin
          $OBJCOPY -O ihex   $ELF ${ELF}.hex
          ./tools/firmware-size-report.sh efr32mg1-sensor ${ELF}.bin 163840 ${ELF}.size.json
          if "$NM" --demangle "$ELF" | grep -q 'core::slice::sort'; then
            echo "EFR32MG1 image contains generic slice sorting" >&2
            exit 1
          fi
          # The sensor must compile out the parent/router maintenance subgraph.
          PARENT_SYMS='parent_beacon_response|handle_parent_command|handle_child_rejoin_request|queue_pending_child_update|process_pending_routing|send_link_status'
          if "$NM" --demangle "$ELF" | grep -Eq "($PARENT_SYMS)"; then
            echo "EFR32MG1 sensor links parent/router maintenance symbols:" >&2
            "$NM" --demangle "$ELF" | grep -E "($PARENT_SYMS)" >&2
            exit 1
          fi
      - name: Upload EFR32MG1 firmware
        uses: actions/upload-artifact@v4
        with:
          name: efr32mg1-sensor-firmware
          path: |
            examples/efr32mg1-sensor/target/thumbv7em-none-eabi/release/efr32mg1-sensor.bin
            examples/efr32mg1-sensor/target/thumbv7em-none-eabi/release/efr32mg1-sensor.hex
            examples/efr32mg1-sensor/target/thumbv7em-none-eabi/release/efr32mg1-sensor.size.json

  build-efr32mg21:
    name: Build EFR32MG21 sensor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv8m.main-none-eabihf
          components: rust-src, llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/efr32mg21-sensor
      - name: Build EFR32MG21 sensor (release)
        working-directory: examples/efr32mg21-sensor
        run: cargo build --release
      - name: Create firmware artifacts
        run: |
          ELF=examples/efr32mg21-sensor/target/thumbv8m.main-none-eabihf/release/efr32mg21-sensor
          OBJCOPY=$(find $(rustc --print sysroot) -name llvm-objcopy | head -1)
          $OBJCOPY -O binary $ELF ${ELF}.bin
          $OBJCOPY -O ihex   $ELF ${ELF}.hex
      - name: Upload EFR32MG21 firmware
        uses: actions/upload-artifact@v4
        with:
          name: efr32mg21-sensor-firmware
          path: |
            examples/efr32mg21-sensor/target/thumbv8m.main-none-eabihf/release/efr32mg21-sensor.bin
            examples/efr32mg21-sensor/target/thumbv8m.main-none-eabihf/release/efr32mg21-sensor.hex

  # ── Deploy Book + Web Flasher to GitHub Pages ────────────────
  # Builds the mdBook documentation and bundles it with the
  # ESP web flasher and latest firmware binaries.
  deploy-site:
    name: Deploy Site
    needs: [check, test, clippy, fmt, build-esp32c6, build-esp32h2, build-bl702]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Build book
        run: mdbook build docs/book

      - name: Download ESP32-C6 firmware
        uses: actions/download-artifact@v4
        with:
          name: esp32c6-sensor-firmware
          path: docs/flasher/firmware

      - name: Download ESP32-H2 firmware
        uses: actions/download-artifact@v4
        with:
          name: esp32h2-sensor-firmware
          path: docs/flasher/firmware

      - name: Generate firmware manifest
        run: |
          cat > docs/flasher/manifest.json << 'EOF'
          {
            "name": "Zigbee-RS Sensor Firmware",
            "version": "${{ github.sha }}",
            "builds": [
              {
                "chipFamily": "ESP32-C6",
                "parts": [{ "path": "./firmware/esp32c6-sensor.bin", "offset": 0 }]
              },
              {
                "chipFamily": "ESP32-H2",
                "parts": [{ "path": "./firmware/esp32h2-sensor.bin", "offset": 0 }]
              }
            ]
          }
          EOF

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r docs/book/book/* _site/
          cp -r docs/flasher _site/flasher

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
