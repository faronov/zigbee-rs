name: CI

on:
  push:
    branches: [main, master, experiment/zephyr-app-model, experiment/r22-bdb-complete]
  pull_request:
  workflow_dispatch:

# Least privilege by default; only deploy-site receives Pages/OIDC tokens.
permissions:
  contents: read

# Supersede stale runs for the same PR/branch, but give every main/master
# push its own group so each commit is fully checked. Pages deployment is
# serialized separately on the deploy-site job.
concurrency:
  group: ci-${{ github.workflow }}-${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN: nightly-2026-03-23
  ESP_PHY_RUST_TOOLCHAIN: nightly-2026-08-01
  ESPFLASH_VERSION: 4.5.0
  CC2340_SDK_COMMIT: 68ca021502383f367d0bf2a5517fdd0dcb0ef909
  UF2_COMMIT: 90e9741f217f5a40c98ba74d663e408041037578
  IMGTOOL_VERSION: 2.4.0

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-unknown-linux-gnu-workspace-${{ env.RUST_TOOLCHAIN }}-all-targets-${{ hashFiles('Cargo.lock') }}
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check -p zigbee-mac --features mock --locked

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test ESP application image preflight
        run: python3 -m unittest discover -s products/esp32-zigbee-devkit/partitions -p 'test_esp_app_image.py' -v
      - name: Test fail-closed Pages firmware publication
        run: python3 -m unittest discover -s tools -p 'test_prepare_pages.py' -v
      - name: Test firmware size reporting
        run: python3 -m unittest discover -s tools -p 'test_firmware_size_report.py' -v
      - name: Test BL702 OTA release tooling
        run: python3 -m unittest discover -s tools -p 'test_bl702_ota.py' -v
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-unknown-linux-gnu-workspace-${{ env.RUST_TOOLCHAIN }}-tests-${{ hashFiles('Cargo.lock') }}
      - name: Test retained ESP HAL clock and timer helpers
        run: |
          rustc --edition 2024 --test vendor/esp-hal/tests/retained_sleep_host.rs \
            -o "$RUNNER_TEMP/esp-hal-sleep-tests"
          "$RUNNER_TEMP/esp-hal-sleep-tests"
      - run: cargo test --workspace --locked
      # Keep sensor feature graphs isolated from workspace feature unification.
      - run: cargo test -p sensor-sed-app --locked
      - run: cargo test -p sensor-sed-app --no-default-features --locked
      - run: cargo test -p sensor-sed-app --features ota --locked
      # The router relay tests are gated on `zigbee-runtime/router`, which is
      # off in the workspace build so sensors do not link the routing tables.
      - run: cargo test -p zigbee-aps --all-features --locked
      - run: cargo test -p zigbee-bdb --all-features --locked
      - run: cargo test -p router-app --all-features --locked
      - run: cargo test -p zigbee-runtime --all-features --locked
      - run: cargo test -p zigbee-tests --all-features --locked
      - run: cargo test -p zigbee-zdo --features router --locked
      - run: cargo test -p zigbee-runtime --no-default-features --locked
      # Do not combine these with --workspace/--all-features: unification hid
      # missing mandatory TCLK features in both production frontends.
      - run: cargo test -p router-app --no-default-features --test production_graph --locked
      - run: cargo test -p zigbee --no-default-features --test production_graph --locked
      - run: cargo test -p zigbee-zcl --no-default-features --locked
      - run: cargo test -p zigbee-zcl --no-default-features --features float32 --locked
      - run: cargo test -p zigbee-zcl --no-default-features --features float64 --locked
      # nRF product crates are excluded from the root workspace (they pull in
      # `embassy-nrf`), but their battery-curve and profile logic is
      # host-testable because the hardware dependencies are
      # `cfg(target_os = "none")`-gated.
      - run: cargo test --manifest-path products/nrf52840-sensor/Cargo.toml --locked
      - run: cargo test --manifest-path products/nrf52840-sensor/Cargo.toml --features sensor-bme280 --locked
      - run: cargo test --manifest-path products/nrf52833-sensor/Cargo.toml --locked
      - run: cargo test --manifest-path products/nrf52833-sensor/Cargo.toml --features sensor-bme280 --locked

  standalone-host:
    name: Host ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: LP-EM-CC2340R5 board
            manifest: boards/lp-em-cc2340r5/Cargo.toml
            workspace: boards/lp-em-cc2340r5
            features: ""
          - name: CC2340 sensor product
            manifest: products/cc2340-sensor/Cargo.toml
            workspace: products/cc2340-sensor
            features: ""
          - name: CC2340R5 HAL
            manifest: cc2340r5-hal/Cargo.toml
            workspace: cc2340r5-hal
            features: ""
          # Workspace member; its optional firmware-writer and compact
          # SHA-256 paths are not covered by the plain workspace test run.
          - name: CC2340R5 loader core
            manifest: bootloaders/cc2340r5-boot/Cargo.toml
            workspace: bootloaders/cc2340r5-boot
            features: ""
          - name: MCUboot image firmware writer
            manifest: mcuboot-image/Cargo.toml
            workspace: .
            features: firmware-writer,compact-sha256
          - name: ESP32-C6 sensor product
            manifest: products/esp32-zigbee-devkit/Cargo.toml
            workspace: products/esp32-zigbee-devkit
            features: esp32c6
          - name: ESP32-H2 sensor product
            manifest: products/esp32-zigbee-devkit/Cargo.toml
            workspace: products/esp32-zigbee-devkit
            features: esp32h2
          - name: ESP32-C6 light-sleep product
            manifest: products/esp32-zigbee-devkit/Cargo.toml
            workspace: products/esp32-zigbee-devkit
            features: esp32c6,light-sleep
          - name: ESP32-H2 light-sleep product
            manifest: products/esp32-zigbee-devkit/Cargo.toml
            workspace: products/esp32-zigbee-devkit
            features: esp32h2,light-sleep
          - name: nRF52840 always-on End Device product
            manifest: products/nrf52840-router/Cargo.toml
            workspace: products/nrf52840-router
            features: ""
          - name: EFR32MG21 board
            manifest: boards/efr32mg21-devkit/Cargo.toml
            workspace: boards/efr32mg21-devkit
            features: ""
          - name: EFR32MG21 sensor product
            manifest: products/efr32mg21-sensor/Cargo.toml
            workspace: products/efr32mg21-sensor
            features: ""
          - name: PHY6222 sensor product
            manifest: products/phy62x2-evk/Cargo.toml
            workspace: products/phy62x2-evk
            features: ""
          - name: PHY6252 sensor product
            manifest: products/phy62x2-evk/Cargo.toml
            workspace: products/phy62x2-evk
            features: phy6252
          - name: PB-03F-Kit product
            manifest: products/pb03f-kit/Cargo.toml
            workspace: products/pb03f-kit
            features: ""
          # The EFR32MG1 HAL currently has host clippy findings
          # (manual is_multiple_of, Result<_, ()>); test it until they are
          # fixed, then drop `clippy: false`.
          - name: EFR32MG1 HAL
            manifest: efr32mg1-hal/Cargo.toml
            workspace: efr32mg1-hal
            features: ""
            clippy: false
          - name: EFR32MG1 TRADFRI board
            manifest: boards/efr32mg1-tradfri/Cargo.toml
            workspace: boards/efr32mg1-tradfri
            features: ""
          - name: EFR32MG1 TRADFRI product
            manifest: products/efr32mg1-tradfri/Cargo.toml
            workspace: products/efr32mg1-tradfri
            features: ""
          - name: EFR32MG21 HAL
            manifest: efr32mg21-hal/Cargo.toml
            workspace: efr32mg21-hal
            features: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.workspace }}
          cache-targets: false
          # Variant names are unique; raw feature lists contain cache-invalid commas.
          key: x86_64-unknown-linux-gnu-host-${{ matrix.name }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '*-hal/Cargo.lock', 'boards/**/Cargo.lock', 'products/**/Cargo.lock', '*-hal/Cargo.toml', 'boards/**/Cargo.toml', 'products/**/Cargo.toml') }}
      - name: Test and lint standalone crate
        env:
          MANIFEST: ${{ matrix.manifest }}
          FEATURES: ${{ matrix.features }}
          CLIPPY: ${{ matrix.clippy }}
        run: |
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          # Every standalone crate commits its Cargo.lock; never re-resolve.
          ARGS=(--manifest-path "$MANIFEST" --target "$HOST_TARGET" --locked)
          if [[ -n "$FEATURES" ]]; then
            ARGS+=(--no-default-features --features "$FEATURES")
          fi
          cargo test "${ARGS[@]}"
          if [[ "$CLIPPY" != false ]]; then
            cargo clippy "${ARGS[@]}" --all-targets -- -D warnings
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-unknown-linux-gnu-workspace-${{ env.RUST_TOOLCHAIN }}-clippy-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo clippy -p sensor-sed-app --all-targets --locked -- -D warnings
      - run: cargo clippy -p sensor-sed-app --all-targets --no-default-features --locked -- -D warnings
      - run: cargo clippy -p zigbee-aps --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy -p zigbee-bdb --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy -p router-app --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy -p router-app --no-default-features --locked -- -D warnings
      - run: cargo clippy -p sensor-sed-app --all-targets --features ota --locked -- -D warnings
      - run: cargo clippy -p zigbee-runtime --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy -p zigbee-zdo --features router --locked -- -D warnings
      - run: cargo clippy -p zigbee-runtime --no-default-features --locked -- -D warnings
      - run: cargo clippy -p zigbee-zcl --no-default-features --locked -- -D warnings
      - run: cargo clippy -p zigbee-zcl --no-default-features --features float32 --locked -- -D warnings
      - run: cargo clippy -p zigbee-zcl --no-default-features --features float64 --locked -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path bl702-hal/Cargo.toml -- --check
          cargo fmt --manifest-path boards/bl702-xt-zb1/Cargo.toml -- --check
          cargo fmt --manifest-path products/bl702-xt-zb1/Cargo.toml -- --check
          cargo fmt --manifest-path products/bl702-xt-zb1/layout/Cargo.toml -- --check
          cargo fmt --manifest-path products/bl702-xt-zb1/bootloader/Cargo.toml -- --check
          cargo fmt --manifest-path bootloaders/bl702-boot/Cargo.toml -- --check
          cargo fmt --manifest-path examples/bl702-sensor/Cargo.toml -- --check
          cargo fmt --manifest-path apps/nrf-sensor/Cargo.toml -- --check
          cargo fmt --manifest-path boards/nrf52840-dk/Cargo.toml -- --check
          cargo fmt --manifest-path boards/nrf52833-dk/Cargo.toml -- --check
          cargo fmt --manifest-path products/nrf52840-sensor/Cargo.toml -- --check
          cargo fmt --manifest-path products/nrf52833-sensor/Cargo.toml -- --check
          cargo fmt --manifest-path boards/lp-em-cc2340r5/Cargo.toml -- --check
          cargo fmt --manifest-path products/cc2340-sensor/Cargo.toml -- --check
          cargo fmt --manifest-path cc2340r5-hal/Cargo.toml -- --check
          cargo fmt --manifest-path bootloaders/cc2340r5-boot/Cargo.toml -- --check
          cargo fmt --manifest-path products/nrf52840-router/Cargo.toml -- --check
          cargo fmt --manifest-path boards/nrf52840-mdk-usb-dongle/Cargo.toml -- --check
          cargo fmt --manifest-path boards/nrf52840-pca10059/Cargo.toml -- --check
          cargo fmt --manifest-path boards/nrf52840-promicro/Cargo.toml -- --check
          cargo fmt --manifest-path boards/efr32mg21-devkit/Cargo.toml -- --check
          cargo fmt --manifest-path products/efr32mg21-sensor/Cargo.toml -- --check
          cargo fmt --manifest-path products/phy62x2-evk/Cargo.toml -- --check
          cargo fmt --manifest-path examples/nrf52840-router/Cargo.toml -- --check
          cargo fmt --manifest-path examples/nrf52840-sensor-uf2/Cargo.toml -- --check
          cargo fmt --manifest-path examples/esp32c6-sensor/Cargo.toml -- --check
          cargo fmt --manifest-path examples/esp32h2-sensor/Cargo.toml -- --check
          cargo fmt --manifest-path examples/cc2340-sensor/Cargo.toml -- --check
          cargo fmt --manifest-path examples/phy6222-sensor/Cargo.toml -- --check
          cargo fmt --manifest-path examples/efr32mg1-sensor/Cargo.toml -- --check
          cargo fmt --manifest-path examples/efr32mg21-sensor/Cargo.toml -- --check
          cargo fmt --manifest-path efr32mg1-hal/Cargo.toml -- --check
          cargo fmt --manifest-path efr32mg21-hal/Cargo.toml -- --check
          cargo fmt --manifest-path phy6222-hal/Cargo.toml -- --check
          cargo fmt --manifest-path boards/efr32mg1-tradfri/Cargo.toml -- --check
          cargo fmt --manifest-path products/efr32mg1-tradfri/Cargo.toml -- --check
          cargo fmt --manifest-path boards/esp32-zigbee-devkit/Cargo.toml -- --check
          cargo fmt --manifest-path products/esp32-zigbee-devkit/Cargo.toml -- --check
          cargo fmt --manifest-path boards/phy62x2-evk/Cargo.toml -- --check
          cargo fmt --manifest-path boards/pb03f-kit/Cargo.toml -- --check
          cargo fmt --manifest-path products/pb03f-kit/Cargo.toml -- --check
          cargo fmt --manifest-path examples/pb03f-kit/Cargo.toml -- --check

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-unknown-linux-gnu-workspace-${{ env.RUST_TOOLCHAIN }}-doc-${{ hashFiles('Cargo.lock') }}
      - run: cargo doc --workspace --no-deps --locked

  # ── Cross-compile hardware examples ──────────────────────────
  # These are standalone crates (not workspace members) targeting
  # embedded platforms. We build them to catch regressions in the
  # platform-specific MAC backends.
  #
  # Keep all nRF images on the same measured compiler. Floating nightly
  # 2026-08-14 changed Cortex-M code generation by about 6 KiB without a
  # source change; fixed compilers keep size measurements comparable.

  build-nrf52840:
    name: Build nRF52840 sensor (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            features: ""
            artifact: nrf52840-sensor-firmware
          - variant: bme280
            features: sensor-bme280
            artifact: nrf52840-sensor-bme280-firmware
          - variant: sht31
            features: sensor-sht31
            artifact: nrf52840-sensor-sht31-firmware
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: thumbv7em-none-eabihf
          components: llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/nrf52840-sensor
          key: thumbv7em-nrf52840-sensor-${{ env.RUST_TOOLCHAIN }}-${{ matrix.variant }}-${{ hashFiles('examples/nrf52840-sensor/Cargo.lock', 'products/nrf52840-sensor/link/**') }}
      - name: Build nRF52840 sensor (release)
        working-directory: examples/nrf52840-sensor
        run: |
          if [[ -n "${{ matrix.features }}" ]]; then
            cargo build --release --locked --features "${{ matrix.features }}"
          else
            cargo build --release --locked
          fi
      - name: Create firmware artifacts
        run: |
          ELF=examples/nrf52840-sensor/target/thumbv7em-none-eabihf/release/nrf52840-sensor
          OBJCOPY=$(find "$(rustc --print sysroot)" -name llvm-objcopy -print -quit)
          NM=$(find "$(rustc --print sysroot)" -name llvm-nm -print -quit)
          "$OBJCOPY" -O binary "$ELF" "${ELF}.bin"
          "$OBJCOPY" -O ihex   "$ELF" "${ELF}.hex"
          ./tools/firmware-size-report.sh \
            nrf52840-sensor-${{ matrix.variant }} ${ELF}.bin \
            ${ELF}.size.json
          IMAGE_BYTES=$(wc -c < "${ELF}.bin" | tr -d '[:space:]')
          if [ "$IMAGE_BYTES" -gt 1040384 ]; then
            echo "nRF52840 image ($IMAGE_BYTES B) overruns application flash ending at 0x000FE000" >&2
            exit 1
          fi
          LAYOUT="$("$NM" -n "$ELF")"
          if ! grep -q '^000fe000 A _security_partition_start$' <<<"$LAYOUT" ||
             ! grep -q '^00100000 A _security_partition_end$' <<<"$LAYOUT"; then
            echo "nRF52840 sensor linker symbols do not preserve 0x000FE000..0x00100000" >&2
            exit 1
          fi
          SYMS="$("$NM" --demangle "$ELF")"
          if grep -q 'core::slice::sort' <<<"$SYMS"; then
            echo "nRF52840 image contains generic slice sorting" >&2
            exit 1
          fi
          if grep -Eq 'aes::soft|SoftwareAes128' <<<"$SYMS"; then
            echo "nRF52840 production image still links software AES" >&2
            exit 1
          fi
          if ! grep -Eq 'NrfHardwareAes128|NrfEcbEngine|nrf_aes::NrfAesDriver' <<<"$SYMS"; then
            echo "nRF52840 production image is missing the Nordic ECB AES backend" >&2
            exit 1
          fi
          # A non-router sensor must compile out the parent/router maintenance
          # subgraph (permit-join, routing, MAC parent-command servicing, child
          # rejoin/Update-Device and Parent Announce). Representative symbols
          # verified present in the router image and absent from the sensor.
          PARENT_SYMS='parent_beacon_response|handle_parent_command|handle_child_rejoin_request|queue_pending_child_update|process_pending_routing|send_link_status'
          if "$NM" --demangle "$ELF" | grep -Eq "($PARENT_SYMS)"; then
            echo "nRF52840 sensor links parent/router maintenance symbols:" >&2
            "$NM" --demangle "$ELF" | grep -E "($PARENT_SYMS)" >&2
            exit 1
          fi
          # Role-state split: the R22 End Device Timeout *client* lifecycle
          # belongs to the end-device role, so its `#[inline(never)]` helpers
          # must be retained in the sensor image (and are compiled out of the
          # relay/router — verified in the router job below).
          for sym in resume_end_device_timeout service_end_device_timeout apply_end_device_timeout_change send_ed_timeout_request_tracked; do
            if ! "$NM" --demangle "$ELF" | grep -q "$sym"; then
              echo "nRF52840 sensor is missing End Device Timeout CLIENT symbol: $sym" >&2
              exit 1
            fi
          done
      - name: Upload nRF52840 firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            examples/nrf52840-sensor/target/thumbv7em-none-eabihf/release/nrf52840-sensor.bin
            examples/nrf52840-sensor/target/thumbv7em-none-eabihf/release/nrf52840-sensor.hex
            examples/nrf52840-sensor/target/thumbv7em-none-eabihf/release/nrf52840-sensor.size.json
          if-no-files-found: error

  build-nrf52840-always-on-end-device:
    name: Build nRF52840 always-on End Device
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: thumbv7em-none-eabihf
          components: llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/nrf52840-router
          key: thumbv7em-nrf52840-router-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('examples/nrf52840-router/Cargo.lock', 'products/nrf52840-router/link/**') }}
      - name: Build nRF52840 always-on End Device (release)
        working-directory: examples/nrf52840-router
        run: cargo build --release --locked
      - name: Create firmware artifacts
        run: |
          ELF=examples/nrf52840-router/target/thumbv7em-none-eabihf/release/nrf52840-router
          OBJCOPY=$(find "$(rustc --print sysroot)" -name llvm-objcopy -print -quit)
          NM=$(find "$(rustc --print sysroot)" -name llvm-nm -print -quit)
          "$OBJCOPY" -O binary "$ELF" "${ELF}.bin"
          "$OBJCOPY" -O ihex   "$ELF" "${ELF}.hex"
          ./tools/firmware-size-report.sh nrf52840-always-on-end-device ${ELF}.bin ${ELF}.size.json
          IMAGE_BYTES=$(wc -c < "${ELF}.bin" | tr -d '[:space:]')
          if [ "$IMAGE_BYTES" -gt 1040384 ]; then
            echo "nRF52840 always-on End Device ($IMAGE_BYTES B) overruns application flash ending at 0x000FE000" >&2
            exit 1
          fi
          SYMS="$("$NM" --demangle "$ELF")"
          if grep -Eq 'aes::soft|SoftwareAes128' <<<"$SYMS"; then
            echo "nRF52840 always-on End Device image still links software AES" >&2
            exit 1
          fi
          if ! grep -Eq 'NrfHardwareAes128|NrfEcbEngine|nrf_aes::NrfAesDriver' <<<"$SYMS"; then
            echo "nRF52840 always-on End Device image is missing the Nordic ECB AES backend" >&2
            exit 1
          fi
          if ! grep -Eq 'advance_commissioning_with_security_store|advance_tclk_exchange|step_tclk_exchange' <<<"$SYMS"; then
            echo "nRF52840 always-on End Device is missing centralized TCLK commissioning" >&2
            exit 1
          fi
          # AlwaysOnEndDeviceApp must enter only the typed steering startup/tick
          # path. Coordinator formation and persisted-PAN restart are separate
          # futures selected only by CoordinatorApp.
          COORDINATOR_STARTUP_SYMS='network_formation|start_fresh_coordinator|start_or_resume_coordinator|persist_formed_coordinator|resume_coordinator_network'
          if grep -Eq "($COORDINATOR_STARTUP_SYMS)" <<<"$SYMS"; then
            echo "nRF52840 always-on End Device links coordinator startup symbols:" >&2
            grep -E "($COORDINATOR_STARTUP_SYMS)" <<<"$SYMS" >&2
            exit 1
          fi
          # The product linker owns the final two 4 KiB flash pages. Assert
          # both exported boundaries in addition to memory.x's link-time
          # ASSERTs, so an accidental fallback to the old full-flash layout
          # cannot pass artifact generation.
          LAYOUT="$("$NM" -n "$ELF")"
          if ! grep -q '^000fe000 A _security_partition_start$' <<<"$LAYOUT"; then
            echo "nRF52840 always-on End Device security journal does not start at 0x000FE000" >&2
            exit 1
          fi
          if ! grep -q '^00100000 A _security_partition_end$' <<<"$LAYOUT"; then
            echo "nRF52840 always-on End Device security journal does not end at 0x00100000" >&2
            exit 1
          fi
          # The end-device NrfSoftMac has no ParentMacDriver. The image must therefore be a
          # non-routing, receiver-on End Device — never a RelayRouter.
          if ! grep -Eq 'zigbee_runtime::role::EndDevice.*router_app::children::NoChildren.*router_app::app::AlwaysOnEndDeviceArchetype' <<<"$SYMS"; then
            echo "nRF52840 image is missing AlwaysOnEndDeviceApp composition symbols" >&2
            exit 1
          fi
          if grep -q 'zigbee_runtime::role::RelayRouter' <<<"$SYMS"; then
            echo "nRF52840 End Device still links RelayRouter" >&2
            exit 1
          fi
          if ! grep -q 'nrf52840_router_product::storage::target::SecurityFlash' <<<"$SYMS"; then
            echo "nRF52840 always-on End Device is missing its product security journal" >&2
            exit 1
          fi
          ROUTER_OR_PARENT_SYMS='parent_beacon_response|handle_parent_command|handle_child_rejoin_request|queue_pending_child_update|process_pending_routing|send_link_status'
          if grep -Eq "($ROUTER_OR_PARENT_SYMS)" <<<"$SYMS"; then
            echo "nRF52840 End Device links router or parent symbols:" >&2
            grep -E "($ROUTER_OR_PARENT_SYMS)" <<<"$SYMS" >&2
            exit 1
          fi
          if cargo tree --locked --manifest-path examples/nrf52840-router/Cargo.toml \
              -e features -i zigbee-runtime | grep -q 'zigbee-runtime feature "router"'; then
            echo "nRF52840 End Device dependency graph enables zigbee-runtime/router" >&2
            exit 1
          fi
          if ! cargo tree --locked --manifest-path examples/nrf52840-router/Cargo.toml \
              -e features -i zigbee-runtime | grep -q 'zigbee-runtime feature "centralized-tclk"'; then
            echo "nRF52840 always-on End Device is missing centralized TCLK commissioning" >&2
            exit 1
          fi
          # Receiver-on-when-idle does not make an End Device a router. The
          # R22 End Device Timeout client lifecycle remains required.
          for sym in resume_end_device_timeout service_end_device_timeout apply_end_device_timeout_change send_ed_timeout_request_tracked; do
            if ! "$NM" --demangle "$ELF" | grep -q "$sym"; then
              echo "nRF52840 End Device is missing End Device Timeout CLIENT symbol: $sym" >&2
              exit 1
            fi
          done
      - name: Upload nRF52840 always-on End Device firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nrf52840-always-on-end-device-firmware
          path: |
            examples/nrf52840-router/target/thumbv7em-none-eabihf/release/nrf52840-router.bin
            examples/nrf52840-router/target/thumbv7em-none-eabihf/release/nrf52840-router.hex
            examples/nrf52840-router/target/thumbv7em-none-eabihf/release/nrf52840-router.size.json
          if-no-files-found: error

  build-nrf52833:
    name: Build nRF52833 sensor (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            features: ""
            artifact: nrf52833-sensor-firmware
          - variant: bme280
            features: sensor-bme280
            artifact: nrf52833-sensor-bme280-firmware
          - variant: sht31
            features: sensor-sht31
            artifact: nrf52833-sensor-sht31-firmware
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: thumbv7em-none-eabihf
          components: llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/nrf52833-sensor
          key: thumbv7em-nrf52833-sensor-${{ env.RUST_TOOLCHAIN }}-${{ matrix.variant }}-${{ hashFiles('examples/nrf52833-sensor/Cargo.lock', 'products/nrf52833-sensor/link/**') }}
      - name: Build nRF52833 sensor (release)
        working-directory: examples/nrf52833-sensor
        run: |
          if [[ -n "${{ matrix.features }}" ]]; then
            cargo build --release --locked --features "${{ matrix.features }}"
          else
            cargo build --release --locked
          fi
      - name: Create firmware artifacts
        run: |
          ELF=examples/nrf52833-sensor/target/thumbv7em-none-eabihf/release/nrf52833-sensor
          OBJCOPY=$(find "$(rustc --print sysroot)" -name llvm-objcopy -print -quit)
          NM=$(find "$(rustc --print sysroot)" -name llvm-nm -print -quit)
          "$OBJCOPY" -O binary "$ELF" "${ELF}.bin"
          "$OBJCOPY" -O ihex   "$ELF" "${ELF}.hex"
          ./tools/firmware-size-report.sh \
            nrf52833-sensor-${{ matrix.variant }} ${ELF}.bin \
            ${ELF}.size.json
          # The application must never reach the protected security journal
          # at 0x0007E000. memory.x asserts the region boundary at link
          # time; this asserts the produced image against it as well.
          IMAGE_BYTES=$(wc -c < "${ELF}.bin" | tr -d '[:space:]')
          if [ "$IMAGE_BYTES" -gt 516096 ]; then
            echo "nRF52833 image ($IMAGE_BYTES B) overruns the 504 KiB application flash region" >&2
            exit 1
          fi
          LAYOUT="$("$NM" -n "$ELF")"
          if ! grep -q '^0007e000 A _security_partition_start$' <<<"$LAYOUT" ||
             ! grep -q '^00080000 A _security_partition_end$' <<<"$LAYOUT"; then
            echo "nRF52833 linker symbols do not preserve 0x0007E000..0x00080000" >&2
            exit 1
          fi
          SYMS="$("$NM" --demangle "$ELF")"
          if grep -q 'core::slice::sort' <<<"$SYMS"; then
            echo "nRF52833 image contains generic slice sorting" >&2
            exit 1
          fi
          if grep -Eq 'aes::soft|SoftwareAes128' <<<"$SYMS"; then
            echo "nRF52833 production image still links software AES" >&2
            exit 1
          fi
          if ! grep -Eq 'NrfHardwareAes128|NrfEcbEngine|nrf_aes::NrfAesDriver' <<<"$SYMS"; then
            echo "nRF52833 production image is missing the Nordic ECB AES backend" >&2
            exit 1
          fi
          # Same role-split gates as the nRF52840 sensor: this is a sleepy
          # end device, so the parent/router maintenance subgraph must be
          # compiled out and the R22 End Device Timeout *client* lifecycle
          # must be retained.
          PARENT_SYMS='parent_beacon_response|handle_parent_command|handle_child_rejoin_request|queue_pending_child_update|process_pending_routing|send_link_status'
          if grep -Eq "($PARENT_SYMS)" <<<"$SYMS"; then
            echo "nRF52833 sensor links parent/router maintenance symbols:" >&2
            grep -E "($PARENT_SYMS)" <<<"$SYMS" >&2
            exit 1
          fi
          for sym in resume_end_device_timeout service_end_device_timeout apply_end_device_timeout_change send_ed_timeout_request_tracked; do
            if ! grep -q "$sym" <<<"$SYMS"; then
              echo "nRF52833 sensor is missing End Device Timeout CLIENT symbol: $sym" >&2
              exit 1
            fi
          done
      - name: Upload nRF52833 firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            examples/nrf52833-sensor/target/thumbv7em-none-eabihf/release/nrf52833-sensor.bin
            examples/nrf52833-sensor/target/thumbv7em-none-eabihf/release/nrf52833-sensor.hex
            examples/nrf52833-sensor/target/thumbv7em-none-eabihf/release/nrf52833-sensor.size.json
          if-no-files-found: error

  build-nrf52840-uf2:
    name: Build nRF52840 sensor UF2 (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: promicro
            feature: board-promicro
            artifact: nrf52840-sensor-uf2-firmware
            app_start: "00026000"
            app_end: "000ee000"
            security_start: "000ee000"
            security_end: "000f0000"
            bootloader_start: "000f4000"
            boot_state_start: "000fe000"
          - board: mdk
            feature: board-mdk
            artifact: nrf52840-sensor-uf2-mdk-firmware
            app_start: "00001000"
            app_end: "000f2000"
            security_start: "000f2000"
            security_end: "000f4000"
            bootloader_start: "000f4000"
            boot_state_start: "000fe000"
          - board: pca10059
            feature: board-nrf-dongle
            artifact: nrf52840-sensor-uf2-pca10059-firmware
            app_start: "00001000"
            app_end: "000f2000"
            security_start: "000f2000"
            security_end: "000f4000"
            bootloader_start: "000f4000"
            boot_state_start: "000fe000"
          - board: dk
            feature: board-nrf-dk
            artifact: nrf52840-sensor-uf2-dk-firmware
            app_start: "00000000"
            app_end: "000fe000"
            security_start: "000fe000"
            security_end: "00100000"
            bootloader_start: "00100000"
            boot_state_start: "00100000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: thumbv7em-none-eabihf
          components: llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/nrf52840-sensor-uf2
          key: thumbv7em-nrf52840-uf2-${{ env.RUST_TOOLCHAIN }}-${{ matrix.board }}-${{ hashFiles('examples/nrf52840-sensor-uf2/Cargo.lock', 'products/nrf52840-sensor/link/uf2-*.x') }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.11"
      - name: Install UF2 converter
        run: python -m pip install --disable-pip-version-check --no-deps intelhex==2.3.0
      - name: Build nRF52840 UF2 sensor (release)
        working-directory: examples/nrf52840-sensor-uf2
        run: cargo build --release --locked --no-default-features --features "${{ matrix.feature }}"
      - name: Create firmware artifacts (.bin, .hex, .uf2)
        run: |
          ELF=examples/nrf52840-sensor-uf2/target/thumbv7em-none-eabihf/release/nrf52840-sensor-uf2
          OBJCOPY=$(find "$(rustc --print sysroot)" -name llvm-objcopy -print -quit)
          NM=$(find "$(rustc --print sysroot)" -name llvm-nm -print -quit)
          "$OBJCOPY" -O binary "$ELF" "${ELF}.bin"
          "$OBJCOPY" -O ihex   "$ELF" "${ELF}.hex"
          ./tools/firmware-size-report.sh \
            nrf52840-sensor-uf2-${{ matrix.board }} ${ELF}.bin \
            ${ELF}.size.json
          SYMS="$("$NM" --demangle "$ELF")"
          if grep -q 'core::slice::sort' <<<"$SYMS"; then
            echo "nRF52840 UF2 image contains generic slice sorting" >&2
            exit 1
          fi
          if grep -Eq 'aes::soft|SoftwareAes128' <<<"$SYMS"; then
            echo "nRF52840 UF2 production image still links software AES" >&2
            exit 1
          fi
          if ! grep -Eq 'NrfHardwareAes128|NrfEcbEngine|nrf_aes::NrfAesDriver' <<<"$SYMS"; then
            echo "nRF52840 UF2 image is missing the Nordic ECB AES backend" >&2
            exit 1
          fi
          PARENT_SYMS='parent_beacon_response|handle_parent_command|handle_child_rejoin_request|queue_pending_child_update|process_pending_routing|send_link_status'
          if grep -Eq "($PARENT_SYMS)" <<<"$SYMS"; then
            echo "nRF52840 UF2 sensor links parent/router maintenance symbols:" >&2
            grep -E "($PARENT_SYMS)" <<<"$SYMS" >&2
            exit 1
          fi
          for sym in resume_end_device_timeout service_end_device_timeout apply_end_device_timeout_change send_ed_timeout_request_tracked; do
            if ! grep -q "$sym" <<<"$SYMS"; then
              echo "nRF52840 UF2 sensor is missing End Device Timeout CLIENT symbol: $sym" >&2
              exit 1
            fi
          done

          LAYOUT="$("$NM" -n "$ELF")"
          expect_symbol() {
            actual=$(awk -v name="$1" '$3 == name { print $1; exit }' <<<"$LAYOUT")
            if [[ "$actual" != "$2" ]]; then
              echo "$1 is ${actual:-missing}, expected $2 for ${{ matrix.board }}" >&2
              exit 1
            fi
          }
          expect_symbol _application_start "${{ matrix.app_start }}"
          expect_symbol _application_end "${{ matrix.app_end }}"
          expect_symbol _security_partition_start "${{ matrix.security_start }}"
          expect_symbol _security_partition_end "${{ matrix.security_end }}"
          expect_symbol _bootloader_start "${{ matrix.bootloader_start }}"
          expect_symbol _boot_state_start "${{ matrix.boot_state_start }}"
          IMAGE_BYTES=$(wc -c < "${ELF}.bin" | tr -d '[:space:]')
          APP_START=$((16#${{ matrix.app_start }}))
          SECURITY_START=$((16#${{ matrix.security_start }}))
          if (( APP_START + IMAGE_BYTES > SECURITY_START )); then
            printf 'nRF52840 UF2 %s image [0x%X..0x%X) reaches security at 0x%X\n' \
              '${{ matrix.board }}' "$APP_START" "$((APP_START + IMAGE_BYTES))" \
              "$SECURITY_START" >&2
            exit 1
          fi

          echo "=== Firmware sizes ==="
          ls -la ${ELF}.bin ${ELF}.hex

          # Fetch the converter from one immutable Microsoft UF2 revision.
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/microsoft/uf2/${UF2_COMMIT}/utils/uf2conv.py" \
            -o /tmp/uf2conv.py
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/microsoft/uf2/${UF2_COMMIT}/utils/uf2families.json" \
            -o /tmp/uf2families.json
          # Convert .hex → .uf2 (hex already contains base address info)
          python /tmp/uf2conv.py -c -f 0xADA52840 ${ELF}.hex -o ${ELF}.uf2
      - name: Upload nRF52840 UF2 firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            examples/nrf52840-sensor-uf2/target/thumbv7em-none-eabihf/release/nrf52840-sensor-uf2.bin
            examples/nrf52840-sensor-uf2/target/thumbv7em-none-eabihf/release/nrf52840-sensor-uf2.hex
            examples/nrf52840-sensor-uf2/target/thumbv7em-none-eabihf/release/nrf52840-sensor-uf2.uf2
            examples/nrf52840-sensor-uf2/target/thumbv7em-none-eabihf/release/nrf52840-sensor-uf2.size.json
          if-no-files-found: error

  # esp-hal 1.0.0's MMIO const references are rejected by the stricter CTFE
  # provenance checks in nightly-2026-08-02. Pin only the ESP builds to the
  # last passing nightly until the upstream HAL release catches up.
  build-esp32c6:
    name: Build ESP32-C6 sensor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.ESP_PHY_RUST_TOOLCHAIN }}
          targets: riscv32imac-unknown-none-elf
          components: rust-src, llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/esp32c6-sensor
          key: riscv32imac-esp32c6-${{ env.ESP_PHY_RUST_TOOLCHAIN }}-ota-${{ hashFiles('examples/esp32c6-sensor/Cargo.lock', 'products/esp32-zigbee-devkit/partitions/**') }}
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: espflash@${{ env.ESPFLASH_VERSION }}
      - name: Build ESP32-C6 sensor (release)
        working-directory: examples/esp32c6-sensor
        run: cargo build --release --locked -Z build-std=core,alloc
      - name: Check ESP32-C6 hardware AES and role split
        run: |
          ELF=examples/esp32c6-sensor/target/riscv32imac-unknown-none-elf/release/esp32c6-sensor
          NM=$(find "$(rustc --print sysroot)" -name llvm-nm -print -quit)
          SYMS="$("$NM" --demangle "$ELF")"
          if grep -Eq 'aes::soft|SoftwareAes128' <<<"$SYMS"; then
            echo "ESP32-C6 production image still links the software AES core" >&2
            exit 1
          fi
          if ! grep -Eq 'EspHardwareAes128|EspAesEngine' <<<"$SYMS"; then
            echo "ESP32-C6 production image is missing the hardware AES backend" >&2
            exit 1
          fi
          PARENT_SYMS='parent_beacon_response|handle_parent_command|handle_child_rejoin_request|queue_pending_child_update|process_pending_routing|send_link_status'
          if grep -Eq "($PARENT_SYMS)" <<<"$SYMS"; then
            echo "ESP32-C6 sensor links parent/router maintenance symbols:" >&2
            grep -E "($PARENT_SYMS)" <<<"$SYMS" >&2
            exit 1
          fi
      - name: Create firmware artifacts
        run: |
          ELF=examples/esp32c6-sensor/target/riscv32imac-unknown-none-elf/release/esp32c6-sensor
          CSV=products/esp32-zigbee-devkit/partitions/esp32-4mb-ota.csv
          espflash save-image --skip-update-check --chip esp32c6 \
            --partition-table "$CSV" --target-app-partition ota_0 \
            "$ELF" "${ELF}.app.bin"
          espflash save-image --skip-update-check --chip esp32c6 \
            --merge --skip-padding --flash-size 4mb \
            --partition-table "$CSV" --target-app-partition ota_0 \
            "$ELF" "${ELF}.bin"
          python3 products/esp32-zigbee-devkit/partitions/check-app-image-size.py \
            --chip esp32c6 --slot ota_0 --merged "${ELF}.bin" "${ELF}.app.bin"
          export ESP_OTA_TEST_IMAGE="$PWD/${ELF}.app.bin"
          export ESP_OTA_C6_IMAGE="$ESP_OTA_TEST_IMAGE"
          export ESP_OTA_PREFLIGHT_CORPUS="$RUNNER_TEMP/esp32c6-ota-corpus"
          python3 products/esp32-zigbee-devkit/partitions/test_esp_app_image.py \
            --write-corpus "$ESP_OTA_PREFLIGHT_CORPUS" --chip esp32c6
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          cargo test --locked --manifest-path products/esp32-zigbee-devkit/Cargo.toml \
            --target "$HOST_TARGET" --target-dir "$RUNNER_TEMP/esp32c6-ota-host" \
            --no-default-features --features esp32c6 -- --include-ignored
          ./tools/firmware-size-report.sh \
            esp32c6-sensor "${ELF}.app.bin" "${ELF}.size.json"
      - name: Upload ESP32-C6 firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: esp32c6-sensor-firmware
          path: |
            examples/esp32c6-sensor/target/riscv32imac-unknown-none-elf/release/esp32c6-sensor.bin
            examples/esp32c6-sensor/target/riscv32imac-unknown-none-elf/release/esp32c6-sensor.app.bin
            examples/esp32c6-sensor/target/riscv32imac-unknown-none-elf/release/esp32c6-sensor.size.json
          if-no-files-found: error

