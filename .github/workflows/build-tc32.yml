name: Build TLSR8258 (tc32)

on:
  push:
    branches: [master, main, develop]
    paths:
      - "examples/telink-tlsr8258-sensor/**"
      - "examples/telink-tlsr8258-router/**"
      - "tools/telink-tlsr8258-lab/**"
      - "scripts/tlsr8258.sh"
      - "tools/tlsr8258-firmware.sh"
      - "tools/firmware-size-report.sh"
      - "examples/telink-tlsr8258-radio/**"
      - "tlsr8258-hal/**"
      - "boards/tlsr8258-tb04/**"
      - "products/tlsr8258-tb04/**"
      - "tlsr8258-rt/**"
      - "zigbee-*/**"
      - ".github/workflows/build-tc32.yml"
  pull_request:
    branches: [master, main, develop]
    paths:
      - "examples/telink-tlsr8258-sensor/**"
      - "examples/telink-tlsr8258-router/**"
      - "tools/telink-tlsr8258-lab/**"
      - "scripts/tlsr8258.sh"
      - "tools/tlsr8258-firmware.sh"
      - "tools/firmware-size-report.sh"
      - "examples/telink-tlsr8258-radio/**"
      - "tlsr8258-hal/**"
      - "boards/tlsr8258-tb04/**"
      - "products/tlsr8258-tb04/**"
      - "tlsr8258-rt/**"
      - "zigbee-*/**"
      - ".github/workflows/build-tc32.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tc32-${{ github.ref }}
  cancel-in-progress: true

env:
  TC32_TOOLCHAIN_URL: https://github.com/modern-tc32/rust/releases/download/tc32-stage2-tc32-45/tc32-rust-toolchain-linux-amd64.tar.gz
  TC32_TOOLCHAIN_DIR: ${{ github.workspace }}/.toolchains/tc32-stage2-tc32-45

jobs:
  build:
    name: Production and lab firmware
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install tc32-45 toolchain
        run: |
          mkdir -p "$TC32_TOOLCHAIN_DIR"
          curl -fL --retry 3 "$TC32_TOOLCHAIN_URL" -o /tmp/tc32.tar.gz
          tar -xzf /tmp/tc32.tar.gz --strip-components=1 -C "$TC32_TOOLCHAIN_DIR"
          "$TC32_TOOLCHAIN_DIR/bin/rustc" --version --verbose

      - name: Cache tc32 build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            examples/telink-tlsr8258-sensor/target
            examples/telink-tlsr8258-router/target
            tlsr8258-hal/target
            boards/tlsr8258-tb04/target
            products/tlsr8258-tb04/target
            tools/telink-tlsr8258-lab/target
            examples/telink-tlsr8258-radio/target
          key: tc32-45-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/memory*.x') }}

      - name: Build production sensor and router
        run: |
          mkdir -p target/tlsr8258-artifacts
          ./scripts/tlsr8258.sh build sensor
          cp examples/telink-tlsr8258-sensor/target/tc32-unknown-none-elf/release/telink-tlsr8258-sensor.bin \
            target/tlsr8258-artifacts/telink-tlsr8258-sensor.bin
          ./scripts/tlsr8258.sh build router
          cp examples/telink-tlsr8258-router/target/tc32-unknown-none-elf/release/telink-tlsr8258-router.bin \
            target/tlsr8258-artifacts/telink-tlsr8258-router.bin
          ./tools/firmware-size-report.sh telink-tlsr8258-sensor \
            target/tlsr8258-artifacts/telink-tlsr8258-sensor.bin 286720 \
            target/tlsr8258-artifacts/telink-tlsr8258-sensor.size.json
          ./tools/firmware-size-report.sh telink-tlsr8258-router \
            target/tlsr8258-artifacts/telink-tlsr8258-router.bin 344064 \
            target/tlsr8258-artifacts/telink-tlsr8258-router.size.json
          NM="$TC32_TOOLCHAIN_DIR/llvm/bin/llvm-nm"
          SENSOR_ELF=examples/telink-tlsr8258-sensor/target/tc32-unknown-none-elf/release/telink-tlsr8258-sensor
          ROUTER_ELF=examples/telink-tlsr8258-router/target/tc32-unknown-none-elf/release/telink-tlsr8258-router
          for elf in "$SENSOR_ELF" "$ROUTER_ELF"; do
            syms="$("$NM" --demangle "$elf")"
            if grep -q 'core::slice::sort' <<<"$syms"; then
              echo "$elf contains generic slice sorting" >&2
              exit 1
            fi
            if grep -Eq 'aes::soft|SoftwareAes128' <<<"$syms"; then
              echo "$elf still links the software AES core" >&2
              exit 1
            fi
            if ! grep -q 'HardwareAes128' <<<"$syms"; then
              echo "$elf is missing the TLSR8258 hardware AES backend" >&2
              exit 1
            fi
            if ! grep -q 'install_aes_engine' <<<"$syms"; then
              echo "$elf never installs the TLSR8258 AES engine" >&2
              exit 1
            fi
          done
          SENSOR_SYMS="$("$NM" --demangle "$SENSOR_ELF")"
          ROUTER_SYMS="$("$NM" --demangle "$ROUTER_ELF")"
          # Role split: the sleepy sensor must compile out the parent/router
          # maintenance subgraph (permit-join, routing, MAC parent-command
          # servicing, child rejoin/Update-Device, Parent Announce), while the
          # router still links it. These names are verified present in the
          # router image and absent from the sensor image.
          PARENT_SYMS='parent_beacon_response|handle_parent_command|handle_child_rejoin_request|queue_pending_child_update|process_pending_routing|send_link_status'
          if grep -Eq "($PARENT_SYMS)" <<<"$SENSOR_SYMS"; then
            echo "TLSR8258 sensor links parent/router maintenance symbols:" >&2
            grep -E "($PARENT_SYMS)" <<<"$SENSOR_SYMS" >&2
            exit 1
          fi
          if ! grep -Eq 'handle_parent_command|queue_pending_child_update' <<<"$ROUTER_SYMS"; then
            echo "TLSR8258 router is missing expected parent maintenance symbols" >&2
            exit 1
          fi
          # Role-state split: the R22 End Device Timeout *client* lifecycle
          # (begin/resume/service/apply/tracked-request) belongs to the
          # end-device role alone. Its `#[inline(never)]` helpers must be
          # retained in the sleepy sensor and compiled out of the router (a
          # parent runs the separate server-side ED Timeout path, never the
          # client). These are client-only runtime symbols, not the generic
          # server helpers.
          ED_CLIENT_SYMS='resume_end_device_timeout|service_end_device_timeout|apply_end_device_timeout_change|send_ed_timeout_request_tracked'
          if grep -Eq "($ED_CLIENT_SYMS)" <<<"$ROUTER_SYMS"; then
            echo "TLSR8258 router links End Device Timeout CLIENT lifecycle symbols:" >&2
            grep -E "($ED_CLIENT_SYMS)" <<<"$ROUTER_SYMS" >&2
            exit 1
          fi
          for sym in resume_end_device_timeout service_end_device_timeout apply_end_device_timeout_change send_ed_timeout_request_tracked; do
            if ! grep -q "$sym" <<<"$SENSOR_SYMS"; then
              echo "TLSR8258 sensor is missing End Device Timeout CLIENT symbol: $sym" >&2
              exit 1
            fi
          done

      - name: Build hardware lab matrix
        run: |
          for mode in diag-beacon diag-assoc diag-smoke diag-pm lab-sensor; do
            ./scripts/tlsr8258.sh build "$mode"
            cp tools/telink-tlsr8258-lab/target/tc32-unknown-none-elf/release/telink-tlsr8258-lab.bin \
              "target/tlsr8258-artifacts/telink-tlsr8258-${mode}.bin"
          done

      - name: Build standalone radio harness
        working-directory: examples/telink-tlsr8258-radio
        run: |
          ./scripts/tlsr8258.sh build
          cp target/tc32-unknown-none-elf/release/telink-tlsr8258-radio.bin \
            ../../target/tlsr8258-artifacts/telink-tlsr8258-radio.bin

      - name: Run host HAL and radio tests
        run: |
          HOST_TARGET="$(rustc +stable -vV | sed -n 's/^host: //p')"
          cargo +stable test --manifest-path tlsr8258-hal/Cargo.toml \
            --release --target "$HOST_TARGET"
          cargo +stable test --manifest-path boards/tlsr8258-tb04/Cargo.toml \
            --release --target "$HOST_TARGET"
          cargo +stable test --manifest-path products/tlsr8258-tb04/Cargo.toml \
            --release --target "$HOST_TARGET"
          cargo +stable test --manifest-path examples/telink-tlsr8258-radio/Cargo.toml \
            --release --target "$HOST_TARGET"

      - name: Upload TLSR8258 binaries
        uses: actions/upload-artifact@v4
        with:
          name: telink-tlsr8258-tc32-45-${{ github.sha }}
          path: |
            target/tlsr8258-artifacts/*.bin
            target/tlsr8258-artifacts/*.json
          if-no-files-found: error
          retention-days: 30

  quality:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path tlsr8258-hal/Cargo.toml -- --check
          cargo fmt --manifest-path boards/tlsr8258-tb04/Cargo.toml -- --check
          cargo fmt --manifest-path products/tlsr8258-tb04/Cargo.toml -- --check
          cargo fmt --manifest-path examples/telink-tlsr8258-sensor/Cargo.toml -- --check
          cargo fmt --manifest-path examples/telink-tlsr8258-router/Cargo.toml -- --check
          cargo fmt --manifest-path tools/telink-tlsr8258-lab/Cargo.toml -- --check
          cargo fmt --manifest-path examples/telink-tlsr8258-radio/Cargo.toml -- --check
