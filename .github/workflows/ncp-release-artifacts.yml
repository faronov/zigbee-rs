name: NCP release artifacts

# Flashable ZRHP NCP images of any ref as a CI artifact (not a release; tagged
# releases come from ncp-release.yml and are what the web flasher serves):
# the boards of tools/ncp-release/boards.json (ESP32-H2 and ESP32-C6 DevKits
# over their native USB-Serial-JTAG port, the Espressif Thread Border Router
# board's H2 on UART 921 600 RTS/CTS).
#
# Each image directory holds:
#   *-merged.bin           full 4 MB flash image: `esptool --chip <chip> write-flash 0x0 <file>` (wipes the Zigbee state)
#   *-bootloader.bin       second-stage bootloader            @ 0x0
#   *-partition-table.bin  partition table (esp32h2-ncp-4mb)  @ 0x8000
#   *-otadata-blank.bin    blank otadata (boot ota_0)         @ 0x9000
#   *-app.bin              NCP application (ota_0)            @ 0x10000
#   board.json, FLASHING.txt, SHA256SUMS
# The bootloader is espflash's bundled ESP-IDF bootloader (no A/B rollback; FW_* rollback needs
# products/esp32-zigbee-ncp/bootloader, built with ESP-IDF v5.5.1).

on:
    push:
        branches: [ncp-release-artifacts]
    workflow_dispatch:
        inputs:
            ref:
                description: "zigbee-rs ref to build (default: this branch)"
                required: false

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    ESP_PHY_RUST_TOOLCHAIN: nightly-2026-08-01
    ESPFLASH_VERSION: 4.5.0

jobs:
    matrix:
        runs-on: ubuntu-latest
        outputs:
            boards: ${{ steps.boards.outputs.boards }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.ref }}
            - id: boards
              run: echo "boards=$(python3 tools/ncp-release/esp_release.py boards)" >>"$GITHUB_OUTPUT"

    build:
        name: ${{ matrix.name }}
        needs: matrix
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.matrix.outputs.boards) }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.ref }}
            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ env.ESP_PHY_RUST_TOOLCHAIN }}
                  targets: riscv32imac-unknown-none-elf
                  components: rust-src
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: examples/esp32-ncp
                  key: ncp-${{ matrix.name }}
            - uses: taiki-e/install-action@v2
              with:
                  tool: espflash@${{ env.ESPFLASH_VERSION }}
            - name: Build
              working-directory: examples/esp32-ncp
              run: cargo build --release --locked --bin esp32-ncp -Z build-std=core,alloc --no-default-features --features "${{ matrix.features }}"
            - name: Assemble images
              run: |
                  set -euo pipefail
                  NAME="zrhp-ncp-${{ matrix.name }}"
                  OUT="$GITHUB_WORKSPACE/out/$NAME"
                  python3 tools/ncp-release/esp_release.py assemble --board "${{ matrix.name }}" \
                    --elf examples/esp32-ncp/target/riscv32imac-unknown-none-elf/release/esp32-ncp \
                    --stem "$NAME" --out "$OUT"
                  cat >"$OUT/FLASHING.txt" <<EOF
                  $NAME: ${{ matrix.title }}
                  zigbee-rs $(git rev-parse --short HEAD) ($(git log -1 --format=%cs)), features: ${{ matrix.features }}
                  Not a release: tagged releases and the web flasher are at https://faronov.github.io/zigbee-rs/flasher/

                  Full flash (factory-new NCP; erases any Zigbee network stored on the chip):
                    esptool --chip ${{ matrix.chip }} --port <PORT> write-flash 0x0 $NAME-merged.bin

                  Update keeping the network (same partition table; the blank otadata makes the new ota_0 app boot):
                    esptool --chip ${{ matrix.chip }} --port <PORT> write-flash 0x0 $NAME-bootloader.bin 0x8000 $NAME-partition-table.bin 0x9000 $NAME-otadata-blank.bin 0x10000 $NAME-app.bin

                  (esptool v4: write_flash instead of write-flash.) See docs/zrhp-z2m-testing.md in faronov/zigbee-herdsman (branch zrhp).
                  EOF
                  sed -i 's/^                  //' "$OUT/FLASHING.txt"
                  (cd "$OUT" && sha256sum ./*.bin >SHA256SUMS)
                  ls -l "$OUT"
            - uses: actions/upload-artifact@v4
              with:
                  name: zrhp-ncp-${{ matrix.name }}
                  path: out/
                  if-no-files-found: error

    bundle:
        name: All images in one artifact
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  pattern: zrhp-ncp-*
                  merge-multiple: true
                  path: zrhp-ncp-images
            - run: ls -lR zrhp-ncp-images
            - uses: actions/upload-artifact@v4
              with:
                  name: zrhp-ncp-images
                  path: zrhp-ncp-images/
