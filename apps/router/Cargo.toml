[package]
name = "router-app"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Platform-independent always-on End Device, router, and coordinator lifecycle"
repository = "https://github.com/faronov/zigbee-rs"
publish = false

[features]
default = ["centralized-tclk", "distributed-security", "groups"]
application-link-key-installation = ["zigbee-runtime/application-link-key-installation"]
centralized-tclk = ["zigbee-runtime/centralized-tclk"]
distributed-security = ["zigbee-runtime/distributed-security"]
groups = ["zigbee-runtime/groups"]
router = ["zigbee-runtime/router", "application-link-key-installation"]
trust-center = ["router", "zigbee-runtime/trust-center"]
# One reserved outgoing APS counter for every APS-secured frame (ZRHP NCP).
global-aps-counter = ["trust-center", "zigbee-runtime/global-aps-counter"]
# Coordinator network co-processor table capacities (ZRHP spec 8.9; see
# zigbee-runtime `ncp-capacity`). Off by default: images without it are
# unchanged.
ncp-capacity = ["global-aps-counter", "zigbee-runtime/ncp-capacity"]
# Compact NCP tables (zigbee-runtime `ncp-capacity-compact`).
ncp-capacity-compact = ["ncp-capacity", "zigbee-runtime/ncp-capacity-compact"]
# Maintenance rejoin requests through `RouterObserver::take_rejoin_request`.
# Off by default so products that never request one carry no request path.
rejoin-request = []
# Green Power Proxy Basic: runs the runtime GP proxy on joined routers and
# persists its Proxy Table through the store given to
# `set_green_power_store`. Off by default: images without it are unchanged.
green-power = ["router", "zigbee-runtime/green-power"]
# GP TempMaster (bidirectional proxy). Needs a MAC with `timed-tx`.
green-power-bidirectional = ["green-power", "zigbee-runtime/green-power-bidirectional"]
# Experimental Full Proxy capabilities; product images must opt in explicitly.
green-power-full-proxy = ["green-power-bidirectional", "zigbee-runtime/green-power-full-proxy"]
# Experimental GP Combo / Sink (GP server); the Sink Table shares the store
# given to `set_green_power_store`. Product images must opt in explicitly.
green-power-sink = ["green-power", "zigbee-runtime/green-power-sink"]
# GP Pairing Configuration and the Translation Table on the combo's sink;
# translations and paired endpoints share the GP journal. Product images
# must opt in explicitly.
green-power-translation-table = [
    "green-power-sink",
    "zigbee-runtime/green-power-translation-table",
]

[dependencies]
zigbee-aps = { path = "../../zigbee-aps" }
zigbee-mac = { path = "../../zigbee-mac" }
zigbee-nwk = { path = "../../zigbee-nwk" }
# Every steering frontend, including the routing-free always-on ED, must
# finish centralized commissioning. This is mandatory even with defaults off.
zigbee-runtime = { path = "../../zigbee-runtime", default-features = false, features = ["centralized-tclk"] }

[dev-dependencies]
zigbee-mac = { path = "../../zigbee-mac", features = ["mock"] }
zigbee-types = { path = "../../zigbee-types" }
zigbee-zcl = { path = "../../zigbee-zcl", default-features = false }
zigbee-gp = { path = "../../zigbee-gp", features = ["proxy"] }

# The lifecycle suite exercises the routing and coordinator frontends, which
# exist only with the `router` feature. Keep `cargo test -p router-app` with
# default features compiling by skipping it there instead of failing.
[[test]]
name = "lifecycle"
required-features = ["router"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("tc32"))'] }
