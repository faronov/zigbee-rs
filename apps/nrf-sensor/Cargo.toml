[package]
name = "nrf-sensor-app"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared Zigbee sleepy-end-device sensor application for Nordic nRF52 products"
repository = "https://github.com/faronov/zigbee-rs"
publish = false

# NOTE: `embassy-nrf` and `zigbee-mac` are deliberately declared *without* a
# chip feature. This crate is never built standalone — it is always a path
# dependency of an nRF firmware composition root (`examples/nrf52840-sensor`,
# `examples/nrf52833-sensor`), and Cargo's additive feature unification
# supplies the single chip feature that root selected (`nrf52840` /
# `nrf52833`). Naming a chip here would make the crate usable by exactly one
# product, which is the opposite of its purpose.
[dependencies]
zigbee-mac = { path = "../../zigbee-mac" }
zigbee-runtime = { path = "../../zigbee-runtime", default-features = false }

embassy-nrf = { version = "0.3" }
embassy-time = "0.4"
embassy-futures = "0.1"
cortex-m = { version = "0.7", features = ["inline-asm"] }
defmt = "1.0"
