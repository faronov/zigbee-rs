[package]
name = "zigbee-crypto"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Low-stack cryptographic primitives shared by the zigbee-rs protocol layers"
repository = "https://github.com/zigbee-rs/zigbee-rs"

[dependencies]
aes = { version = "0.8", default-features = false }
heapless = "0.9"
tlsr8258-hal = { path = "../tlsr8258-hal", optional = true }
bl702-hal = { path = "../bl702-hal", optional = true }
efr32mg1-hal = { path = "../efr32mg1-hal", optional = true }

[features]
tlsr8258 = ["dep:tlsr8258-hal"]
bl702 = ["dep:bl702-hal"]
efr32mg1 = ["dep:efr32mg1-hal"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("tc32"))'] }
